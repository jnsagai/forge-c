[project]
name = "forge-factory"
version = "0.4.0"
description = "Forge-C v0.4 self-healing dark factory control plane (OSS, local-first)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "mcp==2.3.0",
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "ruff==0.17.0", "mypy==2.4.0", "pip-licenses==5.5.5"]

[project.scripts]
forge-preflight = "forge_factory.cli:preflight_main"
forge-supervisor = "forge_factory.supervisor.service:main"
forge-mcp = "forge_factory.mcp.launcher:main"
forge-dashboard = "forge_factory.dashboard.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["factory/python"]

[tool.pytest.ini_options]
testpaths = ["factory/python/tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "S"]
ignore = ["S603", "S607", "S101", "S108", "S104", "S311"]

[tool.ruff.lint.per-file-ignores]
"factory/python/tests/*" = ["S", "B017", "E501"]
"factory/python/forge_factory/workflow/prompts.py" = ["E501"]
"factory/python/forge_factory/workorder.py" = ["E501"]
