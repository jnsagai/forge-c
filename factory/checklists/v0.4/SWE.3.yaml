schema: forge-c/inspection-checklist/v0.4
phase: SWE.3
version: '0.4'
extends:
  path: factory/release-manager/checklists/SWE.3.yaml
  sha256: 58a79af9ef858b3c9a4e8da378803182fd41853280c3e021ad3c0faedd44e4af
policy_overrides: {}  # v0.4 may only ADD checks; v0.3 policy is inherited unchanged
additional_checks:
- id: SWE3-07
  required: true
  severity_if_failed: major
  criterion: Generated HAL/LL C code conforms to the applicable driver development guideline (automatable rule
    subset of ST Cube2 HAL SAD v1.2 - file layout, header guards, naming, const, no RPN conditionals,
    timeout-bounded loops, local array size, no register-access HAL macros).
  deterministic_check: hal_guideline_conformance
  verification_node: gate --step verify --phase SWE.3 --check hal_guideline
  rules: config/factory/guidelines/st-cube2-hal-v1.2.yaml
  source: user requirement 2026-10-14 (spec.md Clarifications)
  evidence:
  - workproduct_reference
  - guideline_report_reference
  - recorded_verdict
- id: SWE3-08
  required: true
  severity_if_failed: major
  criterion: Every LL register offset, bit position and bit mask definition matches the RM0486 register
    description supplied in the work-order inputs (register definitions are generated from RM0486 and
    re-verified; no definition for a register or field absent from the RM inputs).
  deterministic_check: register_map_conformance
  verification_node: gate --step verify --phase SWE.3 --check hal_guideline
  source: night-run finding 2026-10-15 (WO r13 - 8B model invented register offsets and masks)
  evidence:
  - workproduct_reference
  - register_map_report_reference
  - recorded_verdict
- id: SWE3-09
  required: true
  severity_if_failed: major
  criterion: The allocated design is implemented in live code - every HAL_RCC_ function allocated in the SWE.2
    architecture is declared in the HAL header and defined (non-static) in the HAL source, every LL_RCC_
    function the HAL calls is defined in the LL header, and no code is commented out (MISRA C:2012 Dir 4.4).
  deterministic_check: implementation_completeness
  verification_node: gate --step verify --phase SWE.3 --check hal_guideline
  source: night-run finding 2026-10-15 (WO r15 - all HAL code inside an unterminated comment passed every check)
  evidence:
  - workproduct_reference
  - implementation_report_reference
  - recorded_verdict
