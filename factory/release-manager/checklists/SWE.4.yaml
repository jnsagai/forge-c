schema: forge-c/inspection-checklist/v0.3
phase: SWE.4
version: '0.3'
policy:
  author_must_differ_from_inspector: true
  frozen_baseline_required: true
  missing_mandatory_item_fails: true
  critical_major_block: true
  maximum_rework_cycles: 3
  agent_cannot_approve_safety_release: true
  human_gate_during_run: false
  terminal_action_on_retry_exhaustion: AUTO_INVOKE_RELEASE_MANAGER_BLOCKED
  autonomous_safety_waiver_allowed: false
  human_offline_review_required: true
checks:
- id: SWE4-01
  required: true
  severity_if_failed: major
  criterion: Verification measures, environment, entry/exit criteria and regression
    are defined.
  evidence:
  - workproduct_reference
  - source_location_or_trace_id
  - recorded_verdict
- id: SWE4-02
  required: true
  severity_if_failed: major
  criterion: All units have appropriate positive, negative, boundary and error tests.
  evidence:
  - workproduct_reference
  - source_location_or_trace_id
  - recorded_verdict
- id: SWE4-03
  required: true
  severity_if_failed: major
  criterion: Mock register semantics and hardware side effects are assessed for fidelity.
  evidence:
  - workproduct_reference
  - source_location_or_trace_id
  - recorded_verdict
- id: SWE4-04
  required: true
  severity_if_failed: major
  criterion: Static-analysis and coding-rule gaps receive review or deviations.
  evidence:
  - workproduct_reference
  - source_location_or_trace_id
  - recorded_verdict
- id: SWE4-05
  required: true
  severity_if_failed: major
  criterion: Coverage goals and structural coverage reports are linked to actual results.
  evidence:
  - workproduct_reference
  - source_location_or_trace_id
  - recorded_verdict
- id: SWE4-06
  required: true
  severity_if_failed: major
  criterion: Unit/design/test/result traceability, reproducible logs and findings
    exist.
  evidence:
  - workproduct_reference
  - source_location_or_trace_id
  - recorded_verdict
