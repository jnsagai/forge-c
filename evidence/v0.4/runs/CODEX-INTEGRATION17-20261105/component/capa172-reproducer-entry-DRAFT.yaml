root_cause: LINE product admission tries to register amended effective limits as a
  replacement initial immutable record. M9 compares the current deadline-grant identity
  to CONTROL despite existing append-only mission amendments preserving original authority.
remedy: Validate immutable original CONTROL identity and replayed effective mission
  limits and lineage, then link a new accounted order without re-registration; retain
  current crypto control verification, cumulative counters, amendment integrity, historical
  accounting and per-job execution bounds.
