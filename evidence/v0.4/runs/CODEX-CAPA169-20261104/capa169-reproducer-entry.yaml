root_cause: The standalone archive includes committed factory Python sources but omits
  the runtime dependency closure needed by normal reliability-policy loading and schema
  validation. check/missing-volume probes do not exercise this import path.
remedy: Bundle and integrity-check the locked host dependency closure outside the
  application volume, including native ABI and resources, while retaining normal intent,
  volume, policy authorization, unit-state and cooldown fences; qualify new artifacts
  before activation.
