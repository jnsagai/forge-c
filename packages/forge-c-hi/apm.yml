name: forge-c-hi
version: 0.1.0
description: >-
  Forge-C high-integrity V-model skills. Author and independent-inspector skills for every V-model stage, from system
  requirements to system qualification, under standard profiles (generic, ISO 26262, IEC 61508, ASPICE). Deterministic
  traceability, quality and scope gates. Sealed READY_FOR_OFFLINE_REVIEW or BLOCKED review packages. Works with cloud
  and local models. Not a certification tool.
author: Forge-C contributors
license: Apache-2.0
dependencies:
  apm: []
  mcp:
    - name: forge-c-hi
      registry: false
      transport: stdio
      command: sh
      args:
        - "-c"
        - 'for r in .claude .agents .github .cursor .kiro .gemini .opencode .windsurf; do f="$r/skills/hi-gates/scripts/hi_mcp.py"; [ -f "$f" ] && exec "${HI_PYTHON:-python3}" "$f"; done; echo "forge-c-hi: hi-gates skill not found under the project skill folders" >&2; exit 127'
includes: auto
scripts: {}
