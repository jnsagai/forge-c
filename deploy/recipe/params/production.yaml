# Recipe parameters for production (feature 017). Values from docs/ONPREM-DEPLOYMENT.md (2026-10-15) and the owner
# (2026-11-08: one H200 141 GB, shared). `confirmed: false` = waiting for the platform team. Secrets by name only.
site: production
parameters:
  gpu_model:              {value: "NVIDIA H200", description: "GPU of the shared model service (DGX)"}
  gpu_vram_mib:           {value: 144384, description: "141 GB"}
  model_catalog:          {value: "platform-defined", confirmed: false, description: "Models offered and whether they are co-resident or swapped; the factory is unaffected"}
  reference_model:        {value: "Qwen3.6-35B-A3B", description: "Production reference model"}
  reference_precision:    {value: bf16, description: "Reference precision"}
  reference_context:      {value: 262144, description: "Engine context limit (factory uses 65536 per agent)"}
  reference_sequences:    {value: 11, description: "Concurrent sequences"}
  reference_kv_cache_tokens: {value: 761376, description: "KV cache size"}
  reasoning_mode:         {value: "off", description: "Non-thinking"}
  prefix_caching:         {value: true, description: "Must stay on"}
  request_logging:        {value: false, description: "Must stay off"}
  channel_url:            {value: null, confirmed: false, description: "GPU server API URL"}
  channel_tls:            {value: true, description: "HTTPS"}
  channel_ca_bundle:      {value: null, confirmed: false, description: "Internal CA, if needed"}
  auth_method:            {value: null, confirmed: false, description: "Platform authentication method"}
  tenant_key_factory:     {value: "forge-prod", secret_ref: true, description: "Name of the factory's API key in Fabro's secret vault"}
  identity_extension:     {value: null, confirmed: false, description: "Whether the platform offers /forge/v1/identity"}
  factory_share_concurrency: {value: 7, confirmed: false, description: "Sequences for the factory (2 reserved for the coding assistant)"}
  factory_queue_wait_max_s:  {value: 900, description: "Factory bounded wait"}
  factory_machine:        {value: "vm", description: "Ubuntu VM, no GPU"}
  factory_vcpu:           {value: 16, description: "vCPU"}
  factory_ram_gib:        {value: 64, description: "RAM"}
  factory_data_volume:    {value: "/srv/forge-c", description: "250 GB SSD data volume, encrypted, backed up daily"}
  factory_os:             {value: "ubuntu-22.04.5", description: "OS image"}
not_proven_here: []
