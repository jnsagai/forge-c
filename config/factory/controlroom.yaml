# Feature 007 Control Room configuration (schema: specs/007-kpi-control-room/contracts/controlroom-config.schema.json)
schema: forge-c/controlroom-config/0.1
tz: Europe/Lisbon            # host time zone; shift/day boundaries are local, converted to UTC (DST-safe)
shifts:
  - {name: Day, start: "00:00", end: "24:00"}
staleness_s: 120             # live data older than this while units run => stale banner
idle_threshold_s: 600
lead_time_limit_s: 21600     # 6 h, the default work-order timeout
rework_near_ratio: 0.67      # alert when 2 of 3 rework cycles are used
yield_threshold: 0.5         # per-station first-pass yield alert threshold
spc:
  min_subgroups: 10
  min_n: 50
  min_points: 15
  rules: [WE1, WE2, WE3]
prices: {}                   # {model_id: {input_per_mtok, output_per_mtok, currency}}; absent => cost NOT_MEASURED
