# Owner dispositions of escalated verification INPUT issues (an approved input or the simulation environment cannot
# show what a requirement states). Only the owner writes this file. workorder.prepare copies the matching entries,
# read-only, into .forge-run/owner_dispositions.json; an INPUT defect that a disposition settles is recorded as
# DISPOSITIONED (not a package gap) and the limitation is stated in every package. Not a safety approval.
schema_version: '1.0'
dispositions:
  - id: OD-2026-10-18-01
    examples: [0002a-arm_55_rcc_ll, 0002b-arm_55_rcc_hal]
    requirement_text_regex: 'RCC_CR\.HSION\b.*\breset value\b|\breset value\b.*\bRCC_CR\.HSION\b|\bHSI\b.*\bon at reset\b'
    disposition: VERIFIED_AGAINST_DOCUMENTED_RESET_VALUE_ONLY
    limitation: >-
      The RCC_CR.HSION reset value (1, RM0486) is verified against the documented reset value only: the Renode
      behavioural RCC model resets every register to 0, so the reset state is not observable in simulation, and no
      physical target or HIL observation exists (EASA audit finding F-08; r136 DEF-005).
    approved_by: Jefferson Nascimento
    approved_at: '2026-10-18'
    reference: "owner instruction 2026-10-18 on DEF-005: 'go with 2'"
  - id: OD-2026-10-20-07
    examples: [0008c-st-cube-rcc]
    # feature 008: a disposition of DELIVERED-CODE findings (FROZEN vendor code), matched on the recorded finding id
    delivered_finding_regex: '^GUIDELINE:GL-ARG-01:software/ll/stm32n6xx_ll_bus\.h:(879|897|911|925|939)$'
    disposition: ACCEPTED_VENDOR_NAMING_STYLE
    limitation: >-
      ST's delivered stm32n6xx_ll_bus.h (STM32CubeN6 stm32n6xx-hal-driver v1.4.0) names the parameter of the in-scope
      AHB1 bus functions `Periphs`; GL-ARG-01 of the factory's Cube2 HAL guideline subset (parameters in lower case) is
      not the vendor's LL naming convention. The owner accepts these 5 findings as a naming-style deviation of the
      delivered code, not a defect; the code is unchanged (FROZEN).
    approved_by: Jefferson Nascimento
    approved_at: '2026-10-20'
    reference: "owner answer 2026-10-20 to the agent's question on the 5 GL-ARG-01 findings of b008: 'Disposition them (Recommended)'"
  - id: OD-2026-10-25-01
    # 0014d is a subset of 0014c with the identical frozen CRC header; the existing
    # owner's "All 5 LL headers" naming disposition covers the same findings.
    # 0014e retains that exact frozen header/API scope and adds only reviewed
    # simulation performance targets; the existing naming approval also applies.
    examples: [0010c-st-cube-gpio, 0011c-st-cube-spi, 0012c-st-cube-usart, 0013c-st-cube-tim, 0014c-st-cube-crc, 0014d-st-cube-crc-idr-assisted, 0014e-st-cube-crc-idr-simulation]
    # feature 015 benchmark: DELIVERED-CODE findings (FROZEN vendor code) of GL-ARG-01 on ST's five LL headers
    delivered_finding_regex: '^GUIDELINE:GL-ARG-01:software/ll/stm32n6xx_ll_(crc|spi|usart|gpio|tim)\.h:\d+$'
    disposition: ACCEPTED_VENDOR_NAMING_STYLE
    limitation: >-
      ST's delivered LL headers (STM32CubeN6 stm32n6xx-hal-driver v1.4.0: stm32n6xx_ll_crc.h, _spi.h, _usart.h,
      _gpio.h, _tim.h) name the parameters of the in-scope functions in the vendor's LL style (CRCx, SPIx, USARTx,
      GPIOx, TIMx, Mode, ...); GL-ARG-01 of the factory's Cube2 HAL guideline subset (parameters in lower case) is not
      the vendor's LL naming convention. The owner accepts these findings as a naming-style deviation of the delivered
      code, not a defect; the code is unchanged (FROZEN). Same class as OD-2026-10-20-07.
    approved_by: Jefferson Nascimento
    approved_at: '2026-10-25'
    reference: "owner answer 2026-10-25 to the agent's question on the 32 GL-ARG-01 findings of the CRC and SPI benchmark packages: 'All 5 LL headers (Recommended)'"
  - id: OD-2026-10-26-01
    examples: [0010c-st-cube-gpio]
    # feature 015: a clang static-analyzer finding in FROZEN vendor code (owner 2026-10-26: analyzer findings in frozen
    # vendor code are "Dispositionable")
    delivered_finding_regex: '^STATIC_ANALYSIS:core\.BitwiseShift:software/ll/stm32n6xx_ll_gpio\.h:675$'
    disposition: ACCEPTED_OUT_OF_CONTRACT_INPUT
    limitation: >-
      ST's delivered stm32n6xx_ll_gpio.h (STM32CubeN6 stm32n6xx-hal-driver v1.4.0) LL_GPIO_SetAFPin_8_15 shifts by
      POSITION_VAL(Pin >> 8U) * 4. For a Pin below LL_GPIO_PIN_8, outside the function's documented range
      LL_GPIO_PIN_8..LL_GPIO_PIN_15, POSITION_VAL(0) is 32 and the shift (128) is undefined behaviour in C (clang
      core.BitwiseShift). Valid calls are correct. Pin in LL_GPIO_PIN_8..15 is a caller obligation; the code is
      unchanged (FROZEN). Not a safety approval.
    approved_by: Jefferson Nascimento
    approved_at: '2026-10-26'
    reference: "owner answer 2026-10-26 to the agent's question on the clang core.BitwiseShift finding of BENCH-GPIO-ST-R4 (stm32n6xx_ll_gpio.h:675): 'Approve as drafted (Recommended)'"
