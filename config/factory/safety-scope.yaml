# Owner decisions on the PRODUCT safety scope (ADR-0010). Only the owner writes this file; an agent never derives an
# ASIL. workorder.prepare copies the matching decision, read-only, into .forge-run/safety_scope.json.
# Recording a target ASIL is not a safety approval: ASIL work orders need the HSI, the allocation review, a software
# safety analysis and a tool assurance assessment, written by competent humans; until then the package stays BLOCKED.
