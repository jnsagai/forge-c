    examples: [0002a-arm_55_rcc_ll, 0002b-arm_55_rcc_hal]
    target_asil: B
    product_asil_source: >-
      approved:owner-decision-2026-10-18 by Jefferson Nascimento - RCC work orders are ASIL B ("consider RCC as
      ASIL", letter confirmed: "it is ASIL B")
    approved_by: Jefferson Nascimento
    approved_at: '2026-10-18'
    hsi_hash: null
    allocation_review_ref: null
    # OD-2026-10-19-11: owner-signed safety documents for this scope. A document counts only when approved_by,
