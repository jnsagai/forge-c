# Feature 016 OB-T068 (owner decision 2026-11-11, "Extend 016 to factory HAL"): every difference between the
# generated factory-HAL texts (driver style HAL_ON_LL, onboarding/factory_hal.py) and the hand-written WWDG and CRC
# factory-HAL overlays (config/factory/peripherals/{wwdg,crc}.yaml `prompt.hal_*`, `semantic_required_operations`),
# with its reason. tests/test_onboarding_factory_hal_oracle.py fails on an unlisted difference and on a stale entry.
#
# Common causes (cited by the entries):
# - DESIGN: the generated HAL is a template over the LL function kinds (Init configuration of every LL setter and
#   enable pair, Start/Stop/IsEnabled for the main enable, GetFlag/ClearFlag with selectors, Set<X>/Get<X> for values
#   the LL scope reads back, one wrapper per data or action function). The hand overlays are peripheral designs
#   (WWDG: Init activates the watchdog, Refresh(counter); CRC: Calculate/Accumulate over a word buffer). A buffer
#   loop or a merged activation is a domain choice the LL code does not state.
# - RM_LIMITS: value limits that only the RM states (WWDG window and counter 0x40..0x7F with T6 set, RM0486 60.4.4/
#   60.4.5; CRC even polynomials unsupported, RM0486 26.3.3) are not derivable from the LL code. The generated checks
#   are the field masks the LL writes; SWE.1 derives the RM limits from the RM chapter input and the inspector checks
#   them against the RM.
# - ENCODING: a generated configuration value is the register encoding the LL setter takes (its LL constants); the
#   hand WWDG HAL takes the WDGTB field value 0..7 and shifts it.
# - SAMPLE: generated example values are deterministic (the field's reset value with bit 0 flipped); the hand ones
#   were chosen by the author (WWDG window 0x50, CRC polynomial 0x04C11DB7).
schema: forge-c/onboarding-factory-hal-oracle-exceptions/0.1
exceptions:
  - {peripheral: wwdg, key: hal_requirement_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/SAMPLE: the example names the first Init field in LL scope order (the counter, WWDG_CR.T); the hand one names the window (WWDG_CFR.W). Both are single-field EARS examples of the same Init."}
  - {peripheral: wwdg, key: hal_reset_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "Wording: the template names the request by the register prefix ('no WWDG initialisation'), the hand text by the domain word ('no watchdog initialisation'). Same requirement."}
  - {peripheral: wwdg, key: hal_failure_responses, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "RM_LIMITS/ENCODING: the hand text names the RM limits (prescaler above 7, window and counter outside 0x40..0x7F, T6) with RM0486 sections; the generated text names the LL-derived checks (bits outside WWDG_CR.T, WWDG_CFR.WDGTB, WWDG_CFR.W, an enable other than 0/1, an unknown flag selector). Both state the no-wait timing requirement."}
  - {peripheral: wwdg, key: hal_api, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/ENCODING: hand API Init (activates, counter before WDGA) + Refresh + Get/ClearEarlyWakeupFlag; generated API Init (configuration only) + Start (LL_WWDG_Enable) + IsEnabled + GetFlag/ClearFlag(HAL_WWDG_FLAG_EWKUP) + Set/Get Counter, Prescaler, Window (HAL_WWDG_SetCounter is the refresh). The activation order the RM requires (counter with T6 before WDGA, RM0486 60.4.4) is the caller's sequence Init, Start, not an Init internal."}
  - {peripheral: wwdg, key: hal_dynamic_view, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: the view lists the generated functions (Init, Start, IsEnabled, GetFlag, ClearFlag, Set/Get*) instead of the hand Init/Refresh/flag sequence."}
  - {peripheral: wwdg, key: hal_wait_rule, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "RM_LIMITS/ENCODING: both say no function waits and checks come first; the hand text lists the RM limits and the WDGTB shift, the generated one the LL field-mask checks and the LL-encoding rule."}
  - {peripheral: wwdg, key: hal_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/RM_LIMITS: the generated Init example checks the field masks and calls the LL setters in LL scope order without activating; the hand example checks the RM limits, clears EWIF before enabling EWI and activates last. LL calls are written without the instance (the CAPA-131 rewrite inserts it; the hand example's explicit WWDG argument is doubled by that rewrite)."}
  - {peripheral: wwdg, key: hal_wait_rest, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: describes the generated non-Init functions (Start, IsEnabled, GetFlag, ClearFlag, Set/Get*) instead of Refresh and the flag functions."}
  - {peripheral: wwdg, key: hal_contract_rule, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/RM_LIMITS: the generated contract lists the effects of the generated functions read from the LL code (Init writes T, WDGTB, W and sets EWI with ewkup_it_enable 1; Start sets WDGA; ClearFlag writes EWIF 0); the hand contract has Init also setting WDGA and the RM-limit invalid values."}
  - {peripheral: wwdg, key: hal_ut_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/SAMPLE: the generated example checks the first configured value passed to its LL setter and an invalid mask value with no LL call; the hand one also checks the RM call order (SetCounter before Enable, ClearFlag before EnableIT)."}
  - {peripheral: wwdg, key: hal_ut_rule, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: one rule per generated function (valid case, invalid value, scripted LL queries, unknown flag selector) instead of the hand Init/Refresh/flag rules with the RM call order."}
  - {peripheral: wwdg, key: hal_integration, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: the generated sequence is Init, Start, the queries and the flag functions with EWIF preset; the hand one is Init (activating), Refresh and the flag functions."}
  - {peripheral: wwdg, key: hal_effect_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "SAMPLE: INIT_COUNTER on WWDG_CR.T with 0x7E (reset 0x7F with bit 0 flipped) instead of INIT_WINDOW on WWDG_CFR.W with 0x50."}
  - {peripheral: wwdg, key: hal_args_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "ENCODING/SAMPLE/RM_LIMITS: generated configuration literal in LL encodings (prescaler 0x800 = WDGTB 1) and mask-invalid values; the hand literal uses field values and the RM-invalid values (window 0x3F, counter 0x80, prescaler 8)."}
  - {peripheral: wwdg, key: hal_target_tests, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/SAMPLE: the generated scenario defers the expected values to the simulator description and RM0486; the hand one names the model's countdown and the early wake-up at T = 0x40, which needs the activation design."}
  - {peripheral: wwdg, key: semantic_required_operations, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "SAMPLE: the same 12 register/field/action forms; the three write_field logical values differ (generated WWDG_CR.T 126, WWDG_CFR.WDGTB 1, WWDG_CFR.W 126 = reset with bit 0 flipped; hand 127, 0, 80)."}
  - {peripheral: crc, key: hal_requirement_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/SAMPLE: names the first Init field in LL scope order (polynomial size, CRC_CR.POLYSIZE); the hand one names the polynomial (CRC_POL.POL)."}
  - {peripheral: crc, key: hal_failure_responses, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "RM_LIMITS/DESIGN: the hand text names the buffer arguments (NULL buffer/result, count 0) and the RM limit (even polynomial, RM0486 26.3.3); the generated text names the LL field-mask checks of POLYSIZE, REV_IN/RTYPE_IN, REV_OUT/RTYPE_OUT and NULL pointers. Both state the no-wait timing requirement."}
  - {peripheral: crc, key: hal_api, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: hand API Init (resets after configuring) + Calculate/Accumulate over a 32-bit word buffer; generated API Init + ResetCRCCalculationUnit + FeedData32 + ReadData32 + Write_IDR/Read_IDR (one wrapper per LL data/action function; the LL lineage 0014l scopes the IDR functions in, the hand HAL scope excluded them). A buffer loop is a domain design the LL code does not state."}
  - {peripheral: crc, key: hal_dynamic_view, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: lists the generated functions instead of Init/Calculate/Accumulate."}
  - {peripheral: crc, key: hal_wait_rule, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "RM_LIMITS/DESIGN: both say no function waits and checks come first; the hand text cites the 4-cycle computation (RM0486 26.3.3) and lists the buffer and even-polynomial checks, the generated one the LL field-mask checks."}
  - {peripheral: crc, key: hal_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: the generated example is Init (field-mask checks, LL setters in scope order); the hand example is Calculate (reset, feed loop, read)."}
  - {peripheral: crc, key: hal_wait_rest, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: describes the generated wrappers instead of Init-then-reset and Accumulate-without-reset."}
  - {peripheral: crc, key: hal_contract_rule, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/RM_LIMITS: the generated contract lists the LL-read effects of the generated functions (Init writes POLYSIZE, REV_IN/RTYPE_IN, REV_OUT/RTYPE_OUT, CRC_INIT, POL; Reset sets CR.RESET; FeedData32 writes DR); the hand one has Calculate/Accumulate writing the last buffer word and the RM-limit invalid values."}
  - {peripheral: crc, key: hal_ut_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: the generated example tests Init (a configured value passed to its LL setter, an invalid mask value with no LL call); the hand one tests Calculate (reset before the words, scripted result)."}
  - {peripheral: crc, key: hal_ut_rule, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: one rule per generated function instead of the Init/Calculate/Accumulate rules."}
  - {peripheral: crc, key: hal_integration, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN: the generated sequence is Init and the wrappers on the real LL; the hand one is Init, Calculate over two words and Accumulate."}
  - {peripheral: crc, key: hal_effect_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "SAMPLE: INIT_POLYNOMIAL_SIZE on CRC_CR.POLYSIZE (LL encoding 0x8) instead of INIT_POLYNOMIAL on CRC_POL.POL with 0x04C11DB7."}
  - {peripheral: crc, key: hal_args_example, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "ENCODING/SAMPLE/RM_LIMITS: generated configuration literal in LL encodings with deterministic values and mask-invalid values; the hand literal uses the standard CRC-32 configuration, a buffer argument and the RM-invalid even polynomial."}
  - {peripheral: crc, key: hal_target_tests, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "DESIGN/SAMPLE: the generated scenario defers expected values to the simulator description and RM0486; the hand one names the CRC-32 result of one word (0xDF8A8A2B), which needs the Calculate design."}
  - {peripheral: crc, key: semantic_required_operations, reviewed_by: "Claude Code 2026-11-11 (owner review pending)", reason: "The hand CRC profile states no semantic_required_operations; the generated package lists the LL scope's register forms (every factory-HAL package carries them)."}
