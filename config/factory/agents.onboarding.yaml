# Feature 016 opt-in roles; the canonical 20-role SWE registry remains intact.
schema: forge-c/agent-registry-overlay-onboarding/0.1
agents:
- id: onboard-model-author
  skill: factory/skills/onboarding/onboard-model-author/SKILL.md
  description: Author a peripheral model solely from the supplied owner inputs and derived facts.
  phase: null
  model: qwen3:8b
  model_provider: ollama
  max_stage_tokens: 24000
  max_turns: 40
  max_mcp_output_bytes: 2048
  allowed_tools: [forge-docs-mcp.read_onboarding_input, forge-sim-mcp.check_model]
  readonly: false
  output_contract: specs/002-self-healing-factory/contracts/agent-output.schema.json
  status: IMPLEMENTED_ONBOARDING_OPT_IN
  task: Read inputs/case.json, inputs/onboarding-package.json and the supplied RM sections through forge_fs MCP.
    Write only onboarding/model/model.py using the documented pure Python 2.7-compatible request interface.
    Use arithmetic, containers and functions only; no imports, reflection, filesystem, network, process or output
    access. Implement only RM-sourced register behavior. Run forge-sim-mcp.check_model; fix its findings within
    this visit's budget. Never read a hand model, author expected results from implementation behavior, edit
    facts or source documents, invent missing semantics or change the gate. Report an exact gap if inputs are missing.
- id: onboard-model-inspector
  skill: factory/skills/onboarding/onboard-model-inspector/SKILL.md
  description: Independently inspect the exact candidate model hash against the supplied RM and gate evidence.
  phase: null
  model: qwen3:8b
  model_provider: ollama
  max_stage_tokens: 20000
  max_turns: 30
  max_mcp_output_bytes: 2048
  allowed_tools: [forge-docs-mcp.read_onboarding_input, forge-sim-mcp.check_model]
  readonly: true
  output_contract: specs/002-self-healing-factory/contracts/agent-output.schema.json
  status: IMPLEMENTED_ONBOARDING_OPT_IN
  task: Read the candidate, its gate report and authoritative inputs through forge_fs MCP. Inspect reset and
    access semantics, read/write side effects, scope coverage and every declared MODEL_LIMITS entry against RM
    pages. Never edit the model or any artifact. Finish with only the compact agent-output JSON; include the
    exact model:sha256:<hash from onboarding/gate.json> artifact. PASS requires no findings and the exact inspected
    model hash; otherwise return REWORK or BLOCKED with short factual findings. Gate PASS alone is insufficient.
