# Versioned Feature 005 (AFO) role overlay. agents.yaml (the v0.4 20-role design registry) stays unchanged;
# AFO code loads base + this overlay (registry.agents.load_agents(include_afo=True)). Skills are locked separately in
# config/factory/skills.afo.lock.json. specs/005-autonomous-factory-operations/agent-contracts.md defines the roles.
schema: forge-c/agent-registry-overlay-afo/0.1
agents:
- id: afo-recovery-planner
  # kept outside .fabro/skills: the v0.4 design check expects exactly 20 skills there; a planner run copies it
  skill: factory/skills/afo/afo-recovery-planner/SKILL.md
  description: Propose (never execute) one bounded, materially different recovery plan for a PRODUCT_QUALITY failure
    when no deterministic rule applies.
  phase: null
  model: qwen3:8b  # registry default like the 20 base roles; the run profile chooses the model
  model_provider: ollama
  max_stage_tokens: 16000
  max_turns: 8
  max_mcp_output_bytes: 2048
  allowed_tools:
  - forge-afo-mcp.read_failure_bundle
  - forge-afo-mcp.list_gate_findings
  - forge-afo-mcp.read_requirement_excerpt
  - forge-afo-mcp.read_budget_snapshot
  - forge-afo-mcp.submit_recovery_plan
  readonly: true
  output_contract: specs/002-self-healing-factory/contracts/agent-output.schema.json
  status: IMPLEMENTED_AFO_DISABLED_BY_POLICY
  task: Read the frozen case through forge-afo-mcp, choose one allowed strategy that changes something material
    (artifact scope, technique or model), and submit it with submit_recovery_plan. Never edit code, tests, requirements,
    oracles, evidence, policies or archives; never ask to disable or relax a gate.
