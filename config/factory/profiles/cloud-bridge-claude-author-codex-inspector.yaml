schema: forge-c/local-profile/1
id: cloud-bridge-claude-author-codex-inspector
version: 1
work_order_purpose: ASPICE_ONLY
status: EXPERIMENT_ONLY_NOT_QUALIFIED
description: 'Owner 2026-11-02 (comparison line: ''run those examples again using claude and codex, following exactly the
  same configuration as the local models, for a fair comparison''): a copy of local-rtx-v2-omniverse2-ornith-think-author-q38-inspector
  v5 - the same structured runner, packets, validators, gates, time box (240 s), inspection limits and phase-by-phase resume
  - with only the models changed: Claude Opus 5.5 authors (the owner''s Anthropic API, authorized 2026-11-02) and Codex
  gpt-6.1-sol inspects (Codex CLI). The stack''s gateway (loopback-only namespace) forwards both models to the cloud bridge
  (lrtx/cloud_bridge.py) over a unix socket; no ollama or llama-server runs. Native agent nodes (defect triage, Release
  Manager inventory) use Claude, the author model.'
host_reference:
  gpu: RTX 6000 Ada 48 GB
  cpu: Core Ultra 9 285K
  ram_gb: 125
local_only: false
provider: ollama
models:
  default: claude-opus-5-5
  allowed:
    claude-opus-5-5:
      digest: cloud:anthropic:claude-opus-5-5
      license: proprietary (Anthropic API, owner account)
      role_qualification: NOT_QUALIFIED; comparison line author (owner 2026-11-02)
    gpt-6.1-sol:
      digest: cloud:openai-codex:gpt-6.1-sol
      license: proprietary (Codex CLI, owner account)
      role_qualification: NOT_QUALIFIED; comparison line inspector (owner 2026-11-02)
runtime:
  context_limit_tokens: 262144
  fabro_context_tokens: 262144
  fabro_max_output_tokens: 16384
  ollama:
    OLLAMA_NUM_PARALLEL: '1'
    OLLAMA_MAX_LOADED_MODELS: '1'
    OLLAMA_FLASH_ATTENTION: '1'
    OLLAMA_KV_CACHE_TYPE: f16
    OLLAMA_CONTEXT_LENGTH: '262144'
    OLLAMA_NOPRUNE: '1'
  timeout_scale: 10
  cloud_bridge:
    socket: run/cloud-bridge.sock
    models:
      claude-opus-5-5:
        backend: anthropic
        effort: medium
        extra_output_tokens: 98304
        max_output_tokens: 128000
        usd_per_mtok:
          input: 4
          output: 20
          cache_read: 0.2
          cache_write: 5
      gpt-6.1-sol:
        backend: codex
        model: gpt-6.1-sol
        timeout_s: 1500
structured:
  coherent_scope_groups: true
  complete_scope_sections: true
  author_max_calls_by_phase:
    SWE.1: 256
  phases_by_layer:
    LL:
    - SWE.1
    - SWE.2
    - SWE.3
    - SWE.4
    - SWE.5
    - SWE.6
    HAL: []
    LL+HAL: []
  inspect_phases_by_layer:
    LL:
    - SWE.1
    - SWE.2
    - SWE.3
    - SWE.4
    - SWE.5
    - SWE.6
    HAL: []
    LL+HAL: []
  semantic_phases: []
  semantic_inspect_phases: []
  swe2_named_functions: true
  swe2_constrained_design: true
  inspector_sampling:
    default: {}
  inspector_coverage: true
  inspector_entries: true
  inspector_stepwise: true
  advisory_continue: false
  brownfield_structured_phases:
  - SWE.1
  - SWE.2
  reinspect_direct: true
  timeout_s: 21600
  visit_time_s: 240
  inspection_max_source_chars: 1048576
  c_parameter_list_note: true
  role_models:
    author: claude-opus-5-5
    inspector: gpt-6.1-sol
gateway:
  drop_retries: 0
  live_tap: true
  request_timeout_s: 21600
  reasoning: {}
afo:
  role_job_tokens:
    afo-recovery-planner: 1048576
    afo-factory-maintainer: 131072
admission:
  max_inflight: 1
  max_queue: 8
  max_wait_s: 21600
measurement:
  sample_s: 10
deployment:
  root_env: FORGE_LRTX_ROOT
  default_root: /mnt/data/forge-c/lrtx-cloud-bridge
  ports:
    ollama: 11465
    gateway: 11466
    fabro: 32393
    llama: 11467
  forbidden_ports:
  - 8765
  - 8787
  - 11434
  - 11435
  - 11436
  - 11437
  - 11445
  - 11446
  - 32290
  - 32291
  - 32390
  writable_env:
  - FORGE_DATA_ROOT
  - FORGE_STATE_DIR
  - FORGE_ARCHIVE_DIR
  - FORGE_FABRO_CONFIG
  - FORGE_FABRO_STORAGE
  - FORGE_FABRO_HOME
  - FORGE_VENV
  - UV_CACHE_DIR
  - PIP_CACHE_DIR
  shared_readonly:
    toolchains: /mnt/data/forge-c/toolchains
    standards: /mnt/data/forge-c/standards
    inputs: /mnt/data/forge-c/inputs
existing_deployment:
  roots:
  - /home/omniverse2/forge-c-remote/repos/forge-c
  - /home/omniverse2/forge-c-remote/repos/safec
network:
  required: namespace_denied
