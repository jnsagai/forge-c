schema: forge-c/mcp-registry/0.4
version: 0.4.0
policy: EVERY_AGENT_TOOL_USES_MCP
status: PROPOSED_WRAPPERS_REQUIRED
server_catalog:
- id: forge-build-mcp
  transport: stdio
  lifecycle: SPECIFIED_NOT_IMPLEMENTED
  open_source_only: true
  description: Wrapper for C compiler/build/binutils; not an official MCP
  server_mandatory: true
  ops:
  - name: configure
    logical_tool: cmake
    mandatory: true
    status: WRAPPER_TO_CREATE
    timeout_seconds: 60
    role_grants:
    - swe3-author
    - swe4-author
    - swe5-author
    - swe6-author
    - footprint-optimizer
  - name: compile
    logical_tool: ninja/clang/arm-none-eabi-gcc
    mandatory: true
    status: WRAPPER_TO_CREATE
    timeout_seconds: 180
    role_grants:
    - swe3-author
    - swe4-author
    - swe5-author
    - swe6-author
    - footprint-optimizer
  - name: measure_elf
    logical_tool: size/objdump/nm
    mandatory: true
    status: WRAPPER_TO_CREATE
    timeout_seconds: 60
    role_grants:
    - swe3-author
    - swe4-author
    - swe5-author
    - swe6-author
    - footprint-optimizer
  - name: stack_usage
    logical_tool: gcc -fstack-usage
    mandatory: true
    status: WRAPPER_TO_CREATE
    timeout_seconds: 60
    role_grants:
    - swe3-author
    - swe4-author
    - swe5-author
    - swe6-author
    - footprint-optimizer
  - name: disassemble
    logical_tool: objdump
    mandatory: true
    status: WRAPPER_TO_CREATE
    timeout_seconds: 60
    role_grants:
    - footprint-optimizer
