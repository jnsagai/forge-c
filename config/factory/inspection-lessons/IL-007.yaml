statement: >-
  When the source names conditions under which a field write takes no effect or is not allowed (write protection, an
  update still in progress, missing access rights), a requirement that promises that effect states who establishes
  each condition: a caller precondition of the supported invocation domain, or the driver behaviour when it does not
  hold. In a low-level work order the caller precondition is sufficient and no failure response is required; an open
  point that only names the condition leaves the requirement infeasible as written.
