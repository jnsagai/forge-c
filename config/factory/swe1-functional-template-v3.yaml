# Feature 020 round 4 (owner 2026-11-14, pre-approved recommendation after the UART L50B benchmark comparison):
# template v3 = v2 plus the granularity rule (one requirement per API service behaviour, its error and state
# variants merged into it; design constraints one per guideline part) and D41 (HAL-only behaviour - callbacks,
# MSP hooks, handle state - traces to the HAL driver guideline instead of awaiting traceability).
schema: forge-c/swe1-functional-template/1
template_id: swe1-functional-v3
attributes:   # author-written attributes
  - key
  - title
  - statement
  - type
  - precondition
  - origin_group
  - links
  - use_cases
  - operations                 # D32: the delivered public functions the requirement is about (allocation source)
  - verification_method
  - test_level
enums:
  type: [functional, design_constraint, architectural]
  origin_group: [use_case, out_of_context, hal_design_constraint, state_behaviour, awaiting_traceability]
  link_kind: [trace, derive]
  verification_method: [test, analysis, inspection, demonstration]
  test_level: [unit, component, integration, qualification, not_testable]
fixed:        # set by assembly, never by the model (this lane: ASPICE-only, QM)
  status: draft
  asil: QM
  cal: "0"
allocation:   # D32: derived by assembly from `operations` (brownfield: the delivered API is known at SWE.1)
  interface_from: component    # the delivered component(s) of the named operations (governance inventory)
  unallocated: not allocated (design constraint)
rules:
  design_constraint_verification: inspection     # a design constraint is verified by inspection
  derive_needs_rationale: true
  awaiting_has_no_links: true
  delivered_code_never_a_source: true
  design_constraints_per_part: 1                 # round 4: one per guideline part (benchmark: ~5 per module)
  design_constraint_no_use_cases: true           # D31: a design constraint serves no single use case
  design_constraint_no_operations: true          # D32: design constraints stay unallocated
  functional_precondition_required: true         # D33: every functional requirement states its precondition
  functional_operations_required: true           # D32: every functional requirement names >=1 delivered operation
  references_by_key: true                        # D40: cite requirements as [key]/[task/key]; assembly writes the id
  no_author_meta_text: true                      # D40: no authoring-process text in requirements or open points
  budget_verified_by_measurement: true           # D40: budgets mandatory, measured; intro states the budget policy
  functional_requirements_per_operation: 2       # round 4: a delivered function is the only operation of at most 2
                                                 # functional requirements of a task (its service behaviour with
                                                 # error variants, and one more behaviour); merge the rest
  hal_behaviour_traces_to_guideline: true        # round 4 D41: HAL-only behaviour is traced to the guideline input
level_rule:   # functional level: no register-level vocabulary in a statement
  term_sources:
    - rm_register_index        # register and field names of the order's reference-manual sections
    - cmsis_header_symbols     # register-block member and _Msk/_Pos symbol names of the device header
  patterns:
    - '\b0x[0-9A-Fa-f]{4,}\b'   # addresses and reset values
  allowed: delivered public API names (functions, states, option constants)
