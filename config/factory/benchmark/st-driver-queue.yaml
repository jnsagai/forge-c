# Feature 015 (owner 2026-10-25): STM32N6 driver benchmark queue for the production line (Codex authors, Claude
# inspectors) on loop10, one work order at a time. Use case: ST's existing STM32CubeN6 v1.4.0 code is delivered FROZEN
# and the factory produces the ASPICE SWE.1-SWE.6 work products for it (no code generation). An item whose example does
# not exist yet (peripheral not onboarded) is skipped, never failed. ST HAL items follow later ("LL first, HAL later").
schema: forge-c/benchmark-queue/0.1
id: st-drivers-stm32n6
target: STM32N6 (RM0486 Rev 4, DS14791 Rev 9)
line: {acp_authors: codex, acp_inspectors: claude}
work_order_prefix: WO-BENCH
items:
  - {id: crc-st,   example: examples/0014c-st-cube-crc,   layer: LL}
  - {id: spi-st,   example: examples/0011c-st-cube-spi,   layer: LL}
  - {id: usart-st, example: examples/0012c-st-cube-usart, layer: LL}
  - {id: gpio-st,  example: examples/0010c-st-cube-gpio,  layer: LL}
  - {id: tim-st,   example: examples/0013c-st-cube-tim,   layer: LL}
