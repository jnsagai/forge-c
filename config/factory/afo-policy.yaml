# Feature 005 (AFO) policy - owner-controlled. Validated by forge_factory.afo.policy against
# specs/005-autonomous-factory-operations/contracts/afo-policy.schema.json plus the code floor (policy.FLOOR).
# OBSERVE_ONLY: AFO reads, simulates and records only. PILOT/ACTIVE take effect only with a signed owner
# authorization (config/factory/afo-authorizations/, verified by forge_factory.afo.authz) bound to this file's sha256.
# Models: owner rule 2026-10-16 (DeepSeek, no local Qwen) and 2026-10-18 (Codex authors via the forge ACP proxy).
schema_version: '1.0'
feature_id: 005-autonomous-factory-operations
mode: OBSERVE_ONLY
integration:
  reuse_002_supervisor: true
  reuse_004_cre: true
  reuse_003_kpi: true
  use_existing_fabro: true
  no_auto_source_deploy: true
host:
  state_dir_env: FORGE_STATE_DIR
  data_root_env: FORGE_DATA_ROOT
  require_stable_mount: true
  mount_marker: state/.forge-volume-id
  require_write_probe: true
  linger_operator_managed: true
queue:
  max_concurrent_workorders: 1
  max_queued_orders: 100
  priority_aging_seconds: 3600
  lease_seconds: 120
  control_poll_seconds: 15
  submission_requires_approval: true
  allow_autogenerated_work_orders: false
budgets:
  max_order_attempts: 3
  max_strategy_variants_per_phase: 2
  max_recovery_model_calls_per_order: 4
  max_model_tokens_per_order: 120000
  max_gpu_seconds_per_order: 43200
  max_recovery_wall_seconds: 3600
  max_order_wall_seconds: 86400
  max_retries_per_transient_operation: 2
engineering:
  allow_scoped_product_draft_rework: false
  enable_recovery_planner: false
  allowed_model_profiles:
  - deepseek-flash
  - codex-gpt-6.1-sol
  preserve_independent_inspector: true
  require_material_difference: true
  require_frozen_upstream_revalidation: true
maintenance:
  enable_factory_maintainer: false
  auto_merge_source: false
  auto_promote_factory_code: false
  auto_mutate_safety_policy: false
  allow_proposal_pr: false
  protect_holdouts: true
security:
  all_new_agent_calls_mcp_only: true
  deny_agent_direct_shell: true
  redact_secrets: true
  audit_min_level: INFO
  unknown_side_effect_fail_closed: true
slo:
  availability_target: 0.99
  rolling_days: 30
  transient_restore_p95_seconds: 600
  smoke_hours: 24
  pilot_hours: 72
  soak_hours: 168
  measurement_only_until_calibrated: true
notifications:
  dedupe_window_seconds: 900
  minimum_local_audit: true
