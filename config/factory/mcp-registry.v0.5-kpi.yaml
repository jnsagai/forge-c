# Versioned v0.5 overlay (feature 003, KPI-T012). The v0.4 design registry stays unchanged; loaders merge this.
schema: forge-c/mcp-registry-overlay/0.5
extends: config/factory/mcp-registry.yaml
servers:
  forge-observer-mcp:
    ops:
    - name: get_kpis
      logical_tool: Forge KPI read API (latest immutable snapshot)
      mandatory: false
      status: IMPLEMENTED_V05
      timeout_seconds: 60
      role_grants: [release-manager, safety-evidence-auditor]
      notes: Read-only, bounded; no SQL, no formula/baseline mutation.
    - name: get_kpi_evidence
      logical_tool: Forge KPI evidence drilldown (numerator/denominator/source refs)
      mandatory: false
      status: IMPLEMENTED_V05
      timeout_seconds: 60
      role_grants: [release-manager, safety-evidence-auditor]
  forge-tests-mcp:
    ops:
    - name: run_robot
      logical_tool: Robot Framework SWE.6 requirement-based tests on the Renode STM32N6 model
      mandatory: false
      status: IMPLEMENTED_V05
      timeout_seconds: 600
      role_grants: [swe6-author, swe6-inspector]
      notes: Owner request 2026-10-15; PASS only if all tests pass and every SWR is a tag of a passing test.
role_tool_additions:
  release-manager: [forge-observer-mcp.get_kpis, forge-observer-mcp.get_kpi_evidence]
  safety-evidence-auditor: [forge-observer-mcp.get_kpis, forge-observer-mcp.get_kpi_evidence]
  swe6-author: [forge-tests-mcp.run_robot]
  swe6-inspector: [forge-tests-mcp.run_robot]
