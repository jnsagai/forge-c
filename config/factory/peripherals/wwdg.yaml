# Peripheral profile (feature 014 operation-24 campaign, owner 2026-10-27 "RNG, LPTIM, WWDG"): system window watchdog,
# RM0486 Rev 4 chapter 60 (pp. 2995-3001); secure base 0x50002C00, 1 KB (RM0486 p.181, Table 3).
schema: forge-c/peripheral-profile/0.1
id: wwdg
name: System window watchdog (WWDG)
register_prefix: WWDG
base_address: "0x50002C00"
mm_page: 181
window_bytes: 1024
system_name: WWDG LL driver
rm:
  doc: RM0486
  chapter: 60
  key_sections: ["60.6.1", "60.6.2", "60.6.3"]
ll:
  header: stm32n6xx_ll_wwdg.h
  compile_unit: stm32n6xx_ll_wwdg.c
  function_prefix: LL_WWDG_
  register_block: ll_wwdg_regs
  register_count: 256
  void_signatures: false   # LL_WWDG_SetCounter(WWDG_TypeDef *, uint32_t), LL_WWDG_SetWindow(WWDG_TypeDef *, uint32_t)
hal:
  header: stm32n6xx_hal_wwdg.h
  source: stm32n6xx_hal_wwdg.c
  function_prefix: HAL_WWDG_
sim:
  model: wwdg_model.py
  platform: stm32n6_wwdg.repl
# Prompt texts that replace the RCC domain content of the generic LL/HAL prompts (feature 009 mechanism). They describe
# the WWDG work-order scope; hardware facts stay in the RM0486 chapter 60 inputs (cite RM0486 p.N).
prompt:
  swe1_cover: >-
    Cover (only what the WWDG scope names): activating the watchdog (set WWDG_CR.WDGA; WDGA is set by software and
    cleared only by a reset, RM0486 60.6.1, so there is no disable function) and the activation query (return 1U when
    WWDG_CR.WDGA is set, else 0U); writing the counter (write the requested value to WWDG_CR.T, preserving
    WWDG_CR.WDGA) and reading it (return WWDG_CR.T); the timer base prescaler (write the requested encoding to
    WWDG_CFR.WDGTB) and its query; the window value (write the requested value to WWDG_CFR.W) and its query, each
    preserving the other WWDG_CFR fields; the early wake-up interrupt enable (set WWDG_CFR.EWI, cleared only by a
    reset) and its query; the early wake-up flag query (return 1U when WWDG_SR.EWIF is set, else 0U) and its clear
    (WWDG_SR.EWIF is cleared by writing 0, writing 1 has no effect: write 0 to WWDG_SR.EWIF); one requirement per
    function and value, naming the register field (e.g. WWDG_CFR.WDGTB); then a reset/startup requirement (e.g. '-
    **SWR-0nn** While no LL function has been called after reset, the WWDG LL driver shall not write any WWDG
    register.'). The watchdog reset generation itself, the early wake-up interrupt handler, the WWDG bus clock enable
    (RCC) and the HAL are out of scope.
  swe1_effect_example: '{"case":"SET_WINDOW_0x50","swr":"SWR-007","register":"WWDG_CFR","field":"W","op":"write","value":"0x50"}'
  swe1_effect_rule: >-
    Use op "set" for the set-only bits (WWDG_CR.WDGA, WWDG_CFR.EWI) and op "write" with "value" (an integer or "0x..."
    string) for the multi-bit fields (WWDG_CR.T, WWDG_CFR.WDGTB, WWDG_CFR.W); a function that writes a caller-supplied
    value gets one entry with a representative value and the api_calls args pass that value (the counter and window
    take a 7-bit value from 0x40 to 0x7F, the prescaler an encoding LL_WWDG_PRESCALER_1..128); the flag clear gets op
    "write" of value 0 on WWDG_SR.EWIF. Queries get op no_write with register/field.
  ll_api: >-
    the ST CubeN6 functions as delivered (each takes the WWDG_TypeDef instance pointer first): LL_WWDG_Enable,
    LL_WWDG_IsEnabled, LL_WWDG_SetCounter, LL_WWDG_GetCounter, LL_WWDG_SetPrescaler, LL_WWDG_GetPrescaler,
    LL_WWDG_SetWindow, LL_WWDG_GetWindow, LL_WWDG_IsActiveFlag_EWKUP, LL_WWDG_ClearFlag_EWKUP, LL_WWDG_EnableIT_EWKUP
    and LL_WWDG_IsEnabledIT_EWKUP; list in Interfaces exactly the functions of the allocation table
  swe2_static_view: >-
    a Caller, the component stm32n6xx_ll_wwdg (LL, header-only) and the WWDG register block (0x50002C00, RM0486 p.181)
    and their dependencies (Caller -> LL -> registers)
  swe2_dynamic_view: >-
    participants Caller, stm32n6xx_ll_wwdg, WWDG, showing the configuration (prescaler, window, early wake-up interrupt
    enabled), the counter written and the watchdog activated, the caller polling the early wake-up flag (the caller
    bounds the loop), the flag cleared and the counter refreshed inside the window, using the allocated LL_WWDG_
    function names
  ut_example: |-
    static void ut_wwdg_window(void)
    {
        ut_reset_regs();
        forge_host_wwdg.CFR = WWDG_CFR_EWI | 0x7FU;
        LL_WWDG_SetWindow(WWDG, 0x50U);
        CHECK("UT-001", (forge_host_wwdg.CFR & WWDG_CFR_W) == 0x50U);
        CHECK("UT-002", (forge_host_wwdg.CFR & WWDG_CFR_EWI) == WWDG_CFR_EWI);
        forge_host_wwdg.SR = WWDG_SR_EWIF;
        CHECK("UT-003", LL_WWDG_IsActiveFlag_EWKUP(WWDG) == 1U);
        forge_host_wwdg.SR = 0U;
        CHECK("UT-004", LL_WWDG_IsActiveFlag_EWKUP(WWDG) == 0U);
    }
  ut_rule: >-
    Host unit tests pass the generated host instance WWDG (forge_host_device.h maps it to the RAM struct
    forge_host_wwdg; 0x50002C00 is the device address and is used on the target only). Set and value functions check the
    written field and that a preset unrelated field of the same register is preserved (WWDG_CR.WDGA across a counter
    write; WWDG_CFR.EWI across a window or prescaler write); the flag clear checks that WWDG_SR.EWIF is written 0;
    queries get a set and a clear case.
  target_model: >-
    The simulated WWDG (factory/sim/stm32n6/wwdg_model.py) is behavioural: WWDG_CR and WWDG_CFR reset to 0x7F and
    WWDG_SR to 0; WWDG_CR.WDGA and WWDG_CFR.EWI are set by writing 1 and keep their value on a write of 0 (cleared only
    by a reset); WWDG_SR.EWIF is cleared by writing 0 and unchanged by writing 1. While WDGA is set, time advances by one
    counter step on every read of WWDG_CR (deterministic polling): the counter WWDG_CR.T decrements by one down to 0x40,
    where it stops and sets WWDG_SR.EWIF; the watchdog reset (T decremented from 0x40 to 0x3F, or a refresh outside the
    window) is not modelled. Expected values in target checks follow this model.
  target_tests: >-
    write software/tests/target/test_wwdg_target.c (after reset WWDG_CR and WWDG_CFR read 0x7F and the early wake-up
    flag is clear; the prescaler, window and counter values written reach WWDG_CFR and WWDG_CR; activation sets
    WWDG_CR.WDGA and the activation query returns 1U) and software/tests/target/test_wwdg_target_flag.c (with the counter
    written to 0x42 and the watchdog active, polling the counter reaches 0x40 and the early wake-up flag sets; the flag
    clear makes the query return 0U; a counter refresh to 0x7F is read back)
  field_mask_example: WWDG_CFR_W
  query_example: LL_WWDG_GetCounter(WWDG)
  integration: >-
    a configuration of the prescaler and window with the early wake-up interrupt enabled, the counter written and the
    watchdog activated, then the early wake-up flag queried and cleared and the counter refreshed (on the host the
    registers keep the written values; there is no countdown)
  requirement_example: When LL_WWDG_SetWindow is called with a window value, the WWDG LL driver shall write the window value to WWDG_CFR.W.
  # ---- HAL layer: configuration, activation, refresh and the early wake-up flag. The WWDG needs no wait: activation
  # and refresh are writes of WWDG_CR, the configuration a write of WWDG_CFR (RM0486 60.4.3-60.4.5, pp.2997-2998) and
  # WWDG_SR holds only the early wake-up flag EWIF (p.3001) - there is no update, busy or ready flag - so the HAL has no
  # timeout. Parameter rules from the RM: WDGTB is 3 bits, W and T are 7 bits (pp.2999-3000); a refresh is allowed only
  # while the counter is at most W and above 0x3F (p.2997), so a window of 0x3F or less never allows one; T6 must be
  # written 1 or the reset is immediate (pp.2997, 2996: the WWDG_CR value is 0xC0..0xFF); the down-counter runs while
  # the watchdog is disabled (p.2997), so the counter is written before WDGA; EWIF is cleared before EWI is set
  # (p.2999); WDGA and EWI are cleared only by a reset (p.3000), so there is no disable/deinit function -------------
  hal_requirement_example: When the watchdog initialisation is requested with a valid configuration, the WWDG driver shall write the configured window value to WWDG_CFR.W.
  hal_reset_example: >-
    (e.g. '- **SWR-0nn** While no watchdog initialisation has been requested after reset, the WWDG driver shall not
    write any WWDG register.')
  hal_failure_responses: >-
    one requirement per failure response (invalid parameter -> HAL_ERROR without register writes, naming the invalid
    values: a NULL configuration or flag pointer, a prescaler above 7 (WWDG_CFR.WDGTB is 3 bits, RM0486 60.6.2), a
    window value below 0x40 or above 0x7F (a refresh is allowed only while the counter is at most the window value and
    above 0x3F, RM0486 60.4.4), a counter value below 0x40 or above 0x7F at initialisation or refresh (WWDG_CR.T6 must
    be written 1 to avoid an immediate reset, RM0486 60.4.5), and an early wake-up interrupt selection other than 0 or
    1), and one timing requirement: every HAL_WWDG_ function returns without waiting on a WWDG flag (activation,
    configuration and refresh are register writes and WWDG_SR holds only the early wake-up flag, RM0486 60.6.3)
  hal_api: >-
    Interfaces (each HAL_WWDG_ API with hal_status_t: HAL_WWDG_Init(const hal_wwdg_config_t *p_config) with typedef
    struct {uint32_t prescaler; uint32_t window; uint32_t counter; uint32_t ewi_enable;} hal_wwdg_config_t - writes the
    timer base prescaler (the WWDG_CFR.WDGTB encoding 0..7) and the window value, with ewi_enable 1 clears the early
    wake-up flag and then enables the early wake-up interrupt (RM0486 60.5), then writes the counter and activates the
    watchdog (the counter, with T6 set, before WWDG_CR.WDGA: the down-counter runs while the watchdog is disabled, RM0486
    60.4.4); HAL_WWDG_Refresh(uint32_t counter) - writes the counter value to WWDG_CR.T (the caller refreshes inside the
    window); HAL_WWDG_GetEarlyWakeupFlag(uint32_t *p_flag) - writes 1U to *p_flag when WWDG_SR.EWIF is set, else 0U;
    HAL_WWDG_ClearEarlyWakeupFlag(void) - writes 0 to WWDG_SR.EWIF; no disable or deinit function: WWDG_CR.WDGA and
    WWDG_CFR.EWI are cleared only by a reset, RM0486 60.6.1/60.6.2)
  hal_dynamic_view: >-
    showing HAL_WWDG_Init (prescaler and window written, the early wake-up flag cleared and the interrupt enabled, the
    counter written, then the watchdog activated), HAL_WWDG_Refresh (counter written), HAL_WWDG_GetEarlyWakeupFlag and
    HAL_WWDG_ClearEarlyWakeupFlag using the allocated HAL_WWDG_ function names, plus an invalid parameter returning
    HAL_ERROR without register access
  hal_wait_rule: >-
    No HAL_WWDG_ function waits (RM0486 60.4.3-60.4.5: activation, configuration and refresh are register writes;
    WWDG_SR holds only the early wake-up flag); each function checks its parameters first (a NULL pointer, a prescaler
    above 7, a window or counter value outside 0x40..0x7F, an ewi_enable other than 0 or 1), returning HAL_ERROR before
    any register write, then calls the LL functions like this example (adapt names; the provided ST LL takes the WWDG
    instance first and the prescaler as its WWDG_CFR.WDGTB field value):
  hal_example: |-
    hal_status_t HAL_WWDG_Init(const hal_wwdg_config_t *p_config)
    {
        hal_status_t status = HAL_ERROR;
        if ((p_config != NULL) && (p_config->prescaler <= 7U) &&
            (p_config->window >= 0x40U) && (p_config->window <= 0x7FU) &&
            (p_config->counter >= 0x40U) && (p_config->counter <= 0x7FU) && (p_config->ewi_enable <= 1U))
        {
            LL_WWDG_SetPrescaler(WWDG, p_config->prescaler << WWDG_CFR_WDGTB_Pos);
            LL_WWDG_SetWindow(WWDG, p_config->window);
            if (p_config->ewi_enable == 1U)
            {
                LL_WWDG_ClearFlag_EWKUP(WWDG);
                LL_WWDG_EnableIT_EWKUP(WWDG);
            }
            LL_WWDG_SetCounter(WWDG, p_config->counter);
            LL_WWDG_Enable(WWDG);
            status = HAL_OK;
        }
        return status;
    }
  hal_wait_rest: >-
    (the parameter checks come first). An ewi_enable of 0 leaves WWDG_CFR.EWI unwritten (only a reset clears it).
    HAL_WWDG_Refresh checks the counter (0x40..0x7F), calls LL_WWDG_SetCounter and returns HAL_OK;
    HAL_WWDG_GetEarlyWakeupFlag checks p_flag for NULL and writes the LL flag query result to *p_flag;
    HAL_WWDG_ClearEarlyWakeupFlag calls the LL flag clear; both return HAL_OK.
  hal_contract_rule: >-
    The oracle sees only the register values after the call: HAL_WWDG_Init with a valid configuration gets op write
    entries for WWDG_CFR.WDGTB, WWDG_CFR.W and WWDG_CR.T (the configured values) and op set entries for WWDG_CR.WDGA
    and, with ewi_enable 1, WWDG_CFR.EWI, status HAL_OK; HAL_WWDG_Refresh with a valid counter: op write WWDG_CR.T with
    that value, status HAL_OK; HAL_WWDG_ClearEarlyWakeupFlag: op write WWDG_SR.EWIF value 0, status HAL_OK;
    HAL_WWDG_GetEarlyWakeupFlag with a valid pointer: op no_write with register WWDG_SR and field EWIF, status HAL_OK;
    invalid parameter: one entry per invalid value (NULL configuration or flag pointer, a prescaler of 8, a window of
    0x3F or 0x80, a counter of 0x3F or 0x80, an ewi_enable of 2) with op no_write and status HAL_ERROR (no
    register/field). The call order (counter before activation, flag clear before the interrupt enable) is verified by
    the unit tests, not by the contract.
  hal_ut_example: |-
    static void ut_wwdg_init(void)
    {
        hal_status_t st;
        const hal_wwdg_config_t cfg = {3U, 0x50U, 0x7FU, 1U};
        const hal_wwdg_config_t bad = {3U, 0x3FU, 0x7FU, 1U};
        ut_reset();
        st = HAL_WWDG_Init(&cfg);
        CHECK("UT-001", st == HAL_OK);
        CHECK("UT-001-WINDOW", ll_fake_last_arg(LL_FAKE_LL_WWDG_SetWindow, 1U) == 0x50U);  /* argument 1: after the instance */
        CHECK("UT-001-ORDER", ll_fake_index_of(LL_FAKE_LL_WWDG_SetCounter, 1U) < ll_fake_index_of(LL_FAKE_LL_WWDG_Enable, 1U));
        CHECK("UT-001-EWI", ll_fake_index_of(LL_FAKE_LL_WWDG_ClearFlag_EWKUP, 1U) < ll_fake_index_of(LL_FAKE_LL_WWDG_EnableIT_EWKUP, 1U));
        ut_reset();
        st = HAL_WWDG_Init(&bad);
        CHECK("UT-002", st == HAL_ERROR);
        CHECK("UT-002-NO-LL", ll_fake_log_count() == 0U);
    }
  hal_ut_rule: >-
    HAL_WWDG_Init gets a valid case (each configured value passed to its LL function, the flag clear before the
    interrupt enable, the counter written before the activation, no early wake-up call with ewi_enable 0) and one
    HAL_ERROR case per invalid value with no LL call; HAL_WWDG_Refresh gets a valid case (the counter passed to the LL)
    and a HAL_ERROR case below 0x40 and above 0x7F with no LL call; HAL_WWDG_GetEarlyWakeupFlag gets a flag-set case
    (the LL query scripted 1U), a flag-clear case and a NULL pointer case; HAL_WWDG_ClearEarlyWakeupFlag checks the
    clear call.
  hal_integration: >-
    (HAL_WWDG_Init with a valid configuration on the real LL - the prescaler, window and counter reach WWDG_CFR and
    WWDG_CR, WWDG_CR.WDGA and WWDG_CFR.EWI are set -, then HAL_WWDG_Refresh, HAL_WWDG_GetEarlyWakeupFlag with
    WWDG_SR.EWIF preset and HAL_WWDG_ClearEarlyWakeupFlag - on the host the registers keep the written values; there is
    no countdown -, and an invalid configuration returning HAL_ERROR with WWDG_CR and WWDG_CFR unchanged)
  hal_effect_example: '{"case":"INIT_WINDOW","swr":"SWR-002","register":"WWDG_CFR","field":"W","op":"write","value":"0x50","status":"HAL_OK"}'
  hal_args_example: >-
    , e.g. "&(const hal_wwdg_config_t){ .prescaler = 3U, .window = 0x50U, .counter = 0x7FU, .ewi_enable = 1U }", for
    the refresh "0x7FU" and for the flag query "&flag"; invalid cases pass the invalid value (NULL, a prescaler of 8U, a
    window of 0x3FU or 0x80U, a counter of 0x3FU or 0x80U, an ewi_enable of 2U)
  hal_target_tests: >-
    write software/tests/target/test_wwdg_target.c (HAL_WWDG_Init with prescaler 3, window 0x50, counter 0x7F and the
    early wake-up interrupt enabled returns HAL_OK on the WWDG model: WWDG_CFR holds WDGTB 3, W 0x50 and EWI set,
    WWDG_CR.WDGA is set and WWDG_CR.T reads between 0x40 and 0x7F - the model counts down one step per read of WWDG_CR
    while the watchdog is active -; HAL_WWDG_Refresh(0x7F) returns HAL_OK) and
    software/tests/target/test_wwdg_target_errors.c (each invalid parameter returns HAL_ERROR and leaves WWDG_CR and
    WWDG_CFR at their reset value 0x7F with WWDG_CR.WDGA clear; then HAL_WWDG_Init with the counter 0x41: reading
    WWDG_CR until T is 0x40 sets the early wake-up flag, HAL_WWDG_GetEarlyWakeupFlag reports 1U and after
    HAL_WWDG_ClearEarlyWakeupFlag it reports 0U)

# Source-bound mandatory forms; preflight uses the actual engine, before inference.
# This does not replace authored requirements, full coverage or any quality gate.
semantic_required_operations:
  - {register: WWDG_CR, field: WDGA, action: set_field}
  - {register: WWDG_CR, field: WDGA, action: read_field}
  - {register: WWDG_CR, field: T, action: write_field, logical_value: "127"}
  - {register: WWDG_CR, field: T, action: read_field}
  - {register: WWDG_CFR, field: WDGTB, action: write_field, logical_value: "0"}
  - {register: WWDG_CFR, field: WDGTB, action: read_field}
  - {register: WWDG_CFR, field: W, action: write_field, logical_value: "80"}
  - {register: WWDG_CFR, field: W, action: read_field}
  - {register: WWDG_CFR, field: EWI, action: set_field}
  - {register: WWDG_CFR, field: EWI, action: read_field}
  - {register: WWDG_SR, field: EWIF, action: write_field, logical_value: "0"}
  - {register: WWDG_SR, field: EWIF, action: read_field}
