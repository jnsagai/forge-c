# Peripheral profile (feature 009): independent watchdog, RM0486 Rev 4 chapter 59 (pp. 2979-2994);
# secure base 0x56004800, 1 KB (RM0486 p.179, Table 3).
schema: forge-c/peripheral-profile/0.1
id: iwdg
name: Independent watchdog (IWDG)
register_prefix: IWDG
base_address: "0x56004800"
mm_page: 179
window_bytes: 1024
system_name: IWDG LL driver
rm:
  doc: RM0486
  chapter: 59
  key_sections: ["59.7.1", "59.7.2", "59.7.3", "59.7.4"]
ll:
  header: stm32n6xx_ll_iwdg.h
  compile_unit: stm32n6xx_ll_iwdg.c
  function_prefix: LL_IWDG_
  register_block: ll_iwdg_regs
  register_count: 256
  void_signatures: false   # LL_IWDG_SetPrescaler(uint32_t), LL_IWDG_SetReloadCounter(uint32_t)
hal:
  header: stm32n6xx_hal_iwdg.h
  source: stm32n6xx_hal_iwdg.c
  function_prefix: HAL_IWDG_
sim:
  model: iwdg_model.py
  platform: stm32n6_iwdg.repl
# Prompt texts that replace the RCC domain content of the generic LL prompts (feature 009, FR-006). They describe
# the IWDG work-order scope; hardware facts stay in the RM0486 chapter 59 inputs (cite RM0486 p.N).
prompt:
  swe1_cover: >-
    Cover (only what the IWDG scope names): starting the watchdog (write the start key 0x0000CCCC to IWDG_KR.KEY),
    refreshing the counter (write 0x0000AAAA to IWDG_KR.KEY), enabling write access to IWDG_PR/IWDG_RLR (write
    0x00005555 to IWDG_KR.KEY) and disabling it (write any other key value, e.g. 0x00000000), setting the prescaler
    (write the requested value to IWDG_PR.PR, within its 4-bit range) and the reload value (write the requested value to
    IWDG_RLR.RL, within its 12-bit range), and status queries (return 1U when IWDG_SR.PVU, IWDG_SR.RVU or IWDG_SR.ONF is
    set, else 0U); one requirement per function and value, naming the register field (e.g. IWDG_KR.KEY); then a
    reset/startup requirement (e.g. '- **SWR-0nn** While no LL function has been called after reset, the IWDG LL driver
    shall not write any IWDG register.'). The window option (IWDG_WINR), the early wake-up interrupt (IWDG_EWCR,
    IWDG_ICR), option bytes, low-power and debug freeze are out of scope.
  swe1_effect_example: '{"case":"START","swr":"SWR-001","register":"IWDG_KR","field":"KEY","op":"write","value":"0xCCCC"}'
  swe1_effect_rule: >-
    Use op "write" with "value" (an integer or "0x..." string) for a field the requirement writes a value to (keys,
    prescaler, reload); a function that writes a caller-supplied value gets one entry with a representative value and
    the api_calls args pass that value. Query functions get op no_write with register/field.
  ll_api: >-
    static inline functions named exactly LL_IWDG_Enable (start key), LL_IWDG_ReloadCounter (refresh key),
    LL_IWDG_EnableWriteAccess and LL_IWDG_DisableWriteAccess (register access keys), LL_IWDG_SetPrescaler(uint32_t
    prescaler) and LL_IWDG_SetReloadCounter(uint32_t counter) (value writes, masked to the field), and
    LL_IWDG_IsActiveFlag_PVU, LL_IWDG_IsActiveFlag_RVU and LL_IWDG_IsActive (status flags, return uint32_t 1U or 0U);
    keys are written to the whole IWDG_KR register (a write-only key register: never read-modify-write it); list in
    Interfaces exactly the functions of the allocation table
  swe2_static_view: >-
    a Caller, the component stm32n6xx_ll_iwdg (LL, header-only) and the IWDG register block (0x56004800, RM0486 p.179)
    and their dependencies (Caller -> LL -> registers)
  swe2_dynamic_view: >-
    participants Caller, stm32n6xx_ll_iwdg, IWDG, showing the start sequence (enable write access, set prescaler and
    reload, then the caller polls the PVU/RVU update flags - the caller bounds the loop - then start) and a refresh,
    using the allocated LL_IWDG_ function names
  ut_example: |-
    static void ut_iwdg_start(void)
    {
        ut_reset_regs();
        LL_IWDG_Enable();
        CHECK("UT-001", (ll_iwdg_regs[LL_IWDG_KR_OFFSET / 4U] & LL_IWDG_KR_KEY_MSK) == 0x0000CCCCU);
        LL_IWDG_SetPrescaler(4U);
        CHECK("UT-002", (ll_iwdg_regs[LL_IWDG_PR_OFFSET / 4U] & LL_IWDG_PR_PR_MSK) == 4U);
        CHECK("UT-003", LL_IWDG_IsActiveFlag_PVU() == 0U);
        ll_iwdg_regs[LL_IWDG_SR_OFFSET / 4U] = LL_IWDG_SR_PVU_MSK;
        CHECK("UT-004", LL_IWDG_IsActiveFlag_PVU() == 1U);
    }
  ut_rule: >-
    Key and value functions check the written field value; query functions get a flag-set and a flag-clear case.
  target_model: >-
    The simulated IWDG (factory/sim/stm32n6/iwdg_model.py) is behavioural: every register starts at 0 except IWDG_RLR
    (0x00000FFF); IWDG_KR is write-only and reads 0; writes to IWDG_PR and IWDG_RLR take effect only after the access key
    0x5555 was written to IWDG_KR (a later 0x0000 key or the start key locks them again) and then set IWDG_SR.PVU or
    IWDG_SR.RVU until the next read of IWDG_SR; the start key 0xCCCC sets IWDG_SR.ONF; in scenario never_ready the PVU
    and RVU flags never clear. Expected values in target checks follow this model.
  target_tests: >-
    write software/tests/target/test_iwdg_target.c (access key, prescaler and reload writes reach IWDG_PR/IWDG_RLR and the
    update flags report them; start sets the enable status) and software/tests/target/test_iwdg_target_timeout.c (in
    scenario never_ready a poll of at most 1000 iterations never sees the update flags clear)
  field_mask_example: LL_IWDG_KR_KEY_MSK
  query_example: LL_IWDG_IsActive()
  integration: >-
    the start sequence (access key, prescaler and reload writes, a bounded poll of the update flags with the flag preset,
    the same poll ending without the flag clearing when it is never cleared, then the start key) and a counter refresh
  requirement_example: When the IWDG start function is called, the IWDG LL driver shall write 0xCCCC to IWDG_KR.KEY.
  # ---- HAL layer (owner request 2026-10-20: "a watchdog HAL driver"); RM0486 59.3, window option disabled ----------
  hal_requirement_example: When the watchdog initialisation is requested with a valid configuration, the IWDG driver shall write the configured prescaler to IWDG_PR.PR.
  hal_reset_example: >-
    (e.g. '- **SWR-0nn** While no watchdog initialisation has been requested after reset, the IWDG driver shall not
    write any IWDG register.')
  hal_failure_responses: >-
    one requirement per failure response (update timeout -> IWDG_SR.PVU or IWDG_SR.RVU is still set after the timeout:
    the driver returns HAL_TIMEOUT without writing the refresh key; a started IWDG cannot be stopped, so the fallback
    state is the running watchdog and a watchdog reset follows unless the caller recovers; invalid parameter ->
    HAL_ERROR without register writes, naming the invalid values: a NULL configuration pointer, a prescaler above 7, a
    reload value above 0xFFF, and a timeout argument of 0 or greater than HAL_IWDG_TIMEOUT_VALUE)
  hal_api: >-
    Interfaces (each HAL_IWDG_ API with hal_status_t: HAL_IWDG_Init(const hal_iwdg_config_t *p_config, uint32_t timeout)
    with typedef struct {uint32_t prescaler; uint32_t reload;} hal_iwdg_config_t - starts the watchdog, enables register
    access, writes IWDG_PR and IWDG_RLR, waits until IWDG_SR.PVU and IWDG_SR.RVU are 0 for at most timeout polling
    iterations, then refreshes the counter - and HAL_IWDG_Refresh(void) - writes the refresh key)
  hal_dynamic_view: >-
    showing HAL_IWDG_Init with the update path (PVU and RVU cleared: refresh, HAL_OK) and the timeout path (a flag still
    set after the timeout: no refresh, HAL_TIMEOUT) using the allocated HAL_IWDG_ function names, plus a HAL_IWDG_Refresh
  hal_wait_rule: >-
    HAL_IWDG_Init follows RM0486 59.3 (start key, access key, prescaler, reload, wait until both update flags are 0,
    refresh) with the wait bounded like this example (adapt names; check the pointer for NULL, the prescaler (at most 7),
    the reload (at most 0xFFF) and a timeout of 0 or greater than HAL_IWDG_TIMEOUT_VALUE first, returning HAL_ERROR
    before any register write):
  hal_example: |-
    hal_status_t HAL_IWDG_Init(const hal_iwdg_config_t *p_config, uint32_t timeout)
    {
        hal_status_t status;
        uint32_t count = 0U;
        LL_IWDG_Enable();
        LL_IWDG_EnableWriteAccess();
        LL_IWDG_SetPrescaler(p_config->prescaler);
        LL_IWDG_SetReloadCounter(p_config->reload);
        while (((LL_IWDG_IsActiveFlag_PVU() != 0U) || (LL_IWDG_IsActiveFlag_RVU() != 0U)) && (count < timeout))
        {
            count++;
        }
        if ((LL_IWDG_IsActiveFlag_PVU() != 0U) || (LL_IWDG_IsActiveFlag_RVU() != 0U))
        {
            status = HAL_TIMEOUT;
        }
        else
        {
            LL_IWDG_ReloadCounter();
            status = HAL_OK;
        }
        return status;
    }
  hal_wait_rest: >-
    (the parameter checks come first, see above; on a timeout there is no refresh and the watchdog keeps running).
    HAL_IWDG_Refresh calls LL_IWDG_ReloadCounter and returns HAL_OK.
  hal_contract_rule: >-
    The oracle sees only the register values after the call: HAL_IWDG_Init with a valid configuration gets op write
    entries for IWDG_PR.PR and IWDG_RLR.RL (the configured values) and for IWDG_KR.KEY with value 0xAAAA (the last key
    written), status HAL_OK; update timeout: op write IWDG_PR.PR (written before the wait) with "busy":"IWDG_SR.PVU" (the
    flag is held set) and status HAL_TIMEOUT; invalid parameter: one entry per invalid value (NULL pointer, prescaler
    above 7, reload above 0xFFF, timeout 0, timeout above HAL_IWDG_TIMEOUT_VALUE) with op no_write and status HAL_ERROR
    (no register/field); HAL_IWDG_Refresh: op write IWDG_KR.KEY value 0xAAAA, status HAL_OK. The key order is verified by
    the unit tests, not by the contract.
  hal_ut_example: |-
    static void ut_iwdg_init(void)
    {
        hal_status_t st;
        const hal_iwdg_config_t cfg = {4U, 0x0FFFU};
        ut_reset();
        st = HAL_IWDG_Init(&cfg, 10U);
        CHECK("UT-001", st == HAL_OK);
        CHECK("UT-001-PRESCALER", ll_fake_last_arg(LL_FAKE_LL_IWDG_SetPrescaler, 0U) == 4U);
        CHECK("UT-001-ORDER", ll_fake_index_of(LL_FAKE_LL_IWDG_EnableWriteAccess, 1U) < ll_fake_index_of(LL_FAKE_LL_IWDG_SetPrescaler, 1U));
        ut_reset();
        ll_fake_return_from(LL_FAKE_LL_IWDG_IsActiveFlag_PVU, 1U, 1U);  /* the update never completes */
        st = HAL_IWDG_Init(&cfg, 10U);
        CHECK("UT-002", st == HAL_TIMEOUT);
        CHECK("UT-002-NO-REFRESH", ll_fake_calls(LL_FAKE_LL_IWDG_ReloadCounter) == 0U);
    }
  hal_ut_rule: >-
    HAL_IWDG_Init gets an update case (flags clear: HAL_OK, the prescaler and reload passed to the LL, the key order and
    the final refresh), a timeout case (a flag scripted set: HAL_TIMEOUT, no refresh) and one HAL_ERROR case per invalid
    parameter with no LL call; HAL_IWDG_Refresh checks the refresh call.
  hal_integration: >-
    (HAL_IWDG_Init with a valid configuration on the real LL - the update flags are clear - then HAL_IWDG_Refresh, and a
    forced timeout with IWDG_SR.PVU preset and never cleared)
  hal_effect_example: '{"case":"INIT_PRESCALER","swr":"SWR-002","register":"IWDG_PR","field":"PR","op":"write","value":4,"status":"HAL_OK"}'
  hal_args_example: >-
    , e.g. "&(const hal_iwdg_config_t){ .prescaler = 4U, .reload = 0x0FFFU }" and "{timeout}" where the caller passes
    the timeout; invalid cases pass the invalid value (NULL, a prescaler of 8U, a reload of 0x1000U, 0U,
    HAL_IWDG_TIMEOUT_VALUE + 1U)
  hal_target_tests: >-
    write software/tests/target/test_iwdg_target.c (HAL_IWDG_Init with a valid configuration returns HAL_OK on the IWDG
    model: IWDG_PR and IWDG_RLR hold the configured values, IWDG_SR.ONF is set; HAL_IWDG_Refresh returns HAL_OK) and
    software/tests/target/test_iwdg_target_timeout.c (in scenario never_ready the update flags never clear: HAL_IWDG_Init
    returns HAL_TIMEOUT)
