    remedy: "sync_trace sets a unit's Functions list to the functions the code tags @unit <id> (units the code tags at all) before the SWE.3 trace check; changes are logged; specs, designs and code are untouched."
  - id: RPR-047
    script: rpr047_fake_state_preset_internal.py
    sha256: b3ff13ab9bed37521d8522752ad5a8ed8048898bd0dda9800224ae77cea9ed9b
    symptom_signature: "LL test double has no state preset and accepts internal helper calls"
    observed_in: r146
    baseline_revision: 567f0c602aaa96fed5ba5c8b1e0cd060d3849416
    fix_revision: 353bc4bdb97007de3dee46826fd731a292adcb71
    error_codes: ["INSPECTION_FAIL:SWE4-02", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.4/author, SWE.4/inspect]
    root_cause: "The generated LL test double (CAPA-038) documented no way to preset the state a state query reads (e.g. a peripheral already enabled), and its bit helpers were public; r146's SWE.4 author called ll_fake_set_bit()/ll_fake_query_bit() with magic indices tied to the generated enum order (14 calls; r144: 2), the inspector rejected UT-009 (abstract bits, vacuous test) and the SWE.4 rework budget ran out."
    remedy: "ll_fake_set_state(query_fn, value) presets the state of a state query without an LL call (returns 0U for scripted flags); the helpers are named ll_fake_internal_* and run_unit fails a unit test that calls them (LL_FAKE_INTERNAL_CALL); the SWE.4 prompt names the preset call."
  - id: RPR-048
    script: rpr048_asil_scope_states_qm.py
    sha256: 46b1522a3c55a02afbc5b4b946a0f23d28faac9e88b5cbf53ff6da1d5b0f7941
    symptom_signature: "ASIL scope work order states QM safety allocation"
    observed_in: r144-r152
    baseline_revision: 1da76b0489d35f66ccfccf498e855f5b165cd90e
    fix_revision: fdf081a5355e0f815e16a1ff217519dbdcdeaa12
    error_codes: ["SAFETY_SCOPE:QM_CLAIM_IN_ASIL_SCOPE"]
    operations: [SWE.1/author, SWE.6/author]
    root_cause: "workorder.prepare recorded the owner scope (SC-RCC-2026-10-18, ASIL B) as safety_target but kept the example's target.safety_allocation 'OUT_OF_SCOPE: QM development ... (owner decision 2026-10-15)'; the SWE.1 prompt turns OUT_OF_SCOPE into 'QM development scope: no software safety requirements are allocated', and no gate or the EASA pilot check compared stated safety level with the scope. Found in owner review of batch 3 (r144, r147, r149-r152; LL r125 too)."
    remedy: "An owner scope supersedes target.safety_allocation (ASIL B without allocation review -> 'software safety allocation PENDING owner allocation review'); the SWE.1 prompt states that gap and never QM; the author gate (SAFETY_SCOPE:...) and the pilot check (SAFETY_SCOPE_TEXT:...) reject a QM claim or another ASIL inside an owner ASIL scope."
  - id: RPR-049
    script: rpr049_codex_reply_prose.py
    sha256: 2ef6e6aa4e975a6064d1a241e882ea6d83557136b40d2ced146e957115d1b92a
    symptom_signature: "Codex ACP prompt has no trailing reply rule and default verbosity"
    observed_in: r143-r154
    baseline_revision: ab18ceca9f0000b5dcc4067c4f4480cce18918fc
    fix_revision: 4e7ce38eb3559369e3e98fce2940de8f3aeadcda
    error_codes: ["AGENT_OUTPUT_CONTRACT", "AGENT_OUTPUT_PROSE", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.1/author, SWE.2/author, SWE.3/author, SWE.4/author, SWE.5/author, SWE.6/author]
    root_cause: "On the Codex ACP path the reply contract ('Finish with ONLY this JSON') sat in the middle of a long prompt (the proxy prepended its tool note) and Codex ran at default verbosity; Codex added prose to most final replies (r143-r152) and in r153 SWE.1 replied twice without the JSON, which the strict contract rejects, exhausting the rework budget with valid work products."
    remedy: "Codex runs with model_verbosity = low and the proxy appends the factory reply rule as the LAST prompt item; the strict reply contract is unchanged (owner decision 2026-10-19: produce just what is expected)."
  - id: RPR-050
    script: rpr050_inspector_asks_for_rcc_base.py
    sha256: 4e9cfef50f8899575fa843eee58b005797e5cf1a03026e11cd2692b1059c95b5
    symptom_signature: "SWE.3 inspector not told the register-block design and LL gate accepts an authored compile unit"
    observed_in: r103, r159
    baseline_revision: 5053d0e54d42e73f173e969c6201ee58ae0f16de
    fix_revision: 41823779b83caf2f7446c9ee8df7c4f92af25a98
    error_codes: ["INSPECTION_FAIL:SWE3-01", "INSPECTION_FAIL:SWE3-02", "CODE:UNDOCUMENTED_FUNCTION", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/inspect, SWE.3/author]
    root_cause: "The SWE.2/SWE.3 inspector prompts never stated the mandated register access (extern ll_rcc_regs placed by the linker, no integer-to-pointer casts; SWE.2 author prompt, ADR-0009), so the DeepSeek inspector failed the correct design for lacking the RCC base address in C (r103 SWE3-02, r159 SWE3-01); the LL author answered with an authored address unit and pointer helpers, which the LL implementation gate did not reject as a non-header-only unit, and SWE.3 exhausted its rework budget. With such a unit the header-only oracle would also have crashed at link time."
    remedy: "SWE.2/SWE.3 inspector prompts carry REGISTER_BLOCK_NOTE; the LL implementation gate reports IMPL:LL_EXTRA_COMPILE_UNIT for any authored .c beside the generated unit; an oracle link failure returns BUILD_FAILED (ORACLE_BUILD_FAILED finding in contract mode)."
  - id: RPR-051
    script: rpr051_no_write_register_semantics.py
    sha256: a36c246b5743711fbde866bd3c06d5b6a621b2aae2678d4b15701e3120ff207c
    symptom_signature: "no_write effect naming a register demands zero register accesses"
    observed_in: r164
    baseline_revision: dcdce940ddf3f5922afa9f00c2e8bd6842dbb0f4
    fix_revision: f1782d454d34b224991d8fca989c0bb70a9d8828
    error_codes: ["ORACLE_FAIL"]
    operations: [SWE.4/assurance-oracle]
    root_cause: "Register contract rc-v1 gave op no_write one meaning (no register access at all, as for a NULL configuration) while its schema allowed a register/field on a no_write effect; the SWE.1 author used it for 'leave RCC_CR.HSEON/HSION at reset value' and SWE.2 mapped it to HAL_RCC_GPDMA1_Enable, which writes RCC_AHB1ENR. The contract checker skipped no_write entries and the oracle demanded zero accesses, failing a correct driver (r164 SWR-010/011)."
    remedy: "A no_write effect that names a register means the call leaves that register unchanged (oracle compares the register word before/after); without a register it still means no register access. The checker validates the named register/field against the RM and the SWR, and the SWE.1 contract prompt states both meanings."
  - id: RPR-052
    script: rpr052_package_duplicate_compile_unit.py
    sha256: 1809c871f1b04fabf42e9ce77cdeb91a2150155204600f126d951498575d4d93
    symptom_signature: "package workspace links the same compile unit twice"
    observed_in: T-015 on HAL r161-r164
    baseline_revision: b5bd89441a146a0f384c1190c7e3086d83a13099
    fix_revision: 6d7ccbc696608c5cf05fe39df2cb7cffb8e9fc73
    error_codes: ["BASE_BUILD_FAIL", "multiple definition"]
    operations: [T-015/optimization, sim.build_image]
    root_cause: "sim.build_image collected every .c of software/hal and software/src; a workspace rebuilt from a sealed package holds the HAL unit in both (packaged flat view), so the target image linked each HAL function twice. The link-error summary dropped 'multiple definition' lines and optimization.collect reported MEASURED although no case had a count."
    remedy: "One compile unit per file name (software/hal first); 'multiple definition' kept in the error summary; NOT_MEASURED:<reason> when no case produced a count."
  - id: RPR-053
    script: rpr053_permission_denial_cancels_run.py
    sha256: bcf3bcd576d581f75f349dd91841a60a7954e89172e22af9323647e01fec4cb5
    symptom_signature: "denied permission answered as a cancelled turn"
    observed_in: r165
    baseline_revision: d3a06d191c349222d0b08915aec1938a9ff3ea11
    fix_revision: ca4959ec721f98b1cd99522afd841fa641070662
    error_codes: ["run_not_completed:INCOMPLETE", "agent.acp.cancelled"]
    operations: [SWE.3/author]
    root_cause: "The forge ACP proxy denied every session/request_permission with outcome 'cancelled', which ACP defines as 'the prompt turn was cancelled'; when the Codex SWE.3 author asked to edit files natively (LL r165), Codex ended the turn and Fabro failed the whole run as 'Pipeline cancelled'."
    remedy: "Deny by selecting the request's reject option (reject_once, else reject_always); 'cancelled' only when the request offers no reject option."
  - id: RPR-054
    script: rpr054_regmap_register_field_rows.py
    sha256: 4b67672fbc120a61aa2d1413a8779ff892fbb23d051dd3bfefd0ff68df5752e0
    symptom_signature: "register map generator finds no register in register.field table rows"
    observed_in: r166
    baseline_revision: 533b7e0109e03f1e08be9462cccdff9469211578
    fix_revision: 98f6f095bfa7d75489eeb584daf6c606dabaaed9
    error_codes: ["NO_REGISTERS_FROM_SWE2_TABLE", "IMPL:LL_EXTRA_COMPILE_UNIT", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/regmap, SWE.3/author]
    root_cause: "The SWE.2 register-table contract asks for one row per register/bit with a 'name' column; the r166 author wrote register.field names (RCC_CR.HSION). The register map generator accepted only bare RCC_ names, found none, BLOCKED and skipped writing the generated LL compile unit; the SWE.3 author wrote its own compile unit, which the CAPA-046 check rejects and which no author tool can delete, until the rework budget ran out."
    remedy: "The generator takes the leading RCC_ register name of a register.field / register[field] / backticked cell, and writes the constant LL compile unit before any BLOCKED return."
  - id: RPR-055
    script: rpr055_acp_attach_multiline_prompt.py
    sha256: 7b655b4611b0a623a5317c65f5e317858c3809eb708575417e9709f971153f90
    symptom_signature: "author node with a multi-line prompt left on the run model"
    observed_in: i003
    baseline_revision: e7cd8ea3f504cdb22b9aaef8e3b483f57fda4bb0
    fix_revision: 87c312f83cee347c12bd9c2a0e1faa0ac39461bd
    error_codes: ["MODEL_SUSPENDED"]
    operations: [workorder/run, acp/attach]
    root_cause: "acp.attach matched each node statement with a single-line regex. swe4_test_author (unit-test example) and swe3_hal_author (HAL example) carry prompts with real line breaks, so their statements span several lines, never matched, and kept the Fabro run model (DeepSeek) in runs launched with --acp-authors codex. The DeepSeek usage meter shows those calls (i003 SWE.4, 2026-10-20T04:3x-04:42Z)."
    remedy: "attach and native_agent_nodes parse whole node statements (quote-aware, multi-line); workorder.run refuses a suspended run-model provider (config/factory/model-suspensions.yaml, OD-2026-10-20-03) unless every agent node is on an ACP backend."
  - id: RPR-056
    script: rpr056_gateway_calls_suspended_provider.py
    sha256: f2321741f78a52c8ab4d5a46adb4786296049191e58e3fe01ce90fa86ee1ea5a
    symptom_signature: "gateway forwards a request to a suspended provider"
    observed_in: h001
    baseline_revision: 625ed0245a6840535416c18cca514306f39225bf
    fix_revision: 4d89805f1512529d0063eba3fa4e10e6247a09a2
    error_codes: ["MODEL_SUSPENDED"]
    operations: [llm_gateway/chat, fabro/run_title_generation]
    root_cause: "CAPA-051 guards the workflow graph (no agent node on the suspended run model), but the Fabro server itself generates a run title with its default run model (deepseek-flash) for every new run, through the forge LLM gateway, which forwarded every request upstream. h001 at 2026-10-20T06:53:12Z reached api.deepseek.com (it failed with 'response_format type is unavailable', so no tokens were reported)."
    remedy: "The gateway maps its upstream host to a provider and refuses every request (chat and models) while config/factory/model-suspensions.yaml suspends that provider, before reading the body or opening a connection; it records the refusal (upstream_called false), which cost and token metrics ignore. Read per request: lifting the suspension needs no restart."
  - id: RPR-057
    script: rpr057_hal_allocation_rcc_prefix.py
    sha256: bec0d336ee5f4b3550aac76ab5aae69927aff890f47536e419dcc934c3f950cc
    symptom_signature: "HAL allocation read with the RCC prefix on a non-RCC work order"
    observed_in: h001
