  - id: RPR-008
    script: rpr008_unverifiable_ll_requirement.py
    sha256: 9116632b82a7207c8d790c109a904450303e5b66ae27c44ffc8119e17efc1b2f
    symptom_signature: "LL SWE.1 procedure demands an access-count requirement"
    observed_in: r80
    baseline_revision: face7ca7427ede2a18904e7aa09709072b9d113b
    fix_revision: 71b83b6b815144ab1536b223df9f6a4f89572ee6
    error_codes: ["INSPECTION_FAIL:SWE4-02", "INSPECTION_FAIL:SWE5-04", "REQUIRED_TOOL_NOT_PASS:run_integration", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.4/inspect, SWE.5/inspect, SWE.5/author, SWE.5/route]
    root_cause: "The LL SWE.1 procedure asked for a requirement on the number of register reads/writes, which a host RAM register array cannot observe; SWE.4/SWE.5 spent their rework budget on access-counting stubs (r80 BLOCKED at SWE.5)."
    remedy: "The LL SWE.1 procedure no longer asks for access counts and requires every requirement to be verifiable on the register array or by the size/stack tools."
