  - id: RPR-115
    script: rpr115_test_declaration_ticket_mismatch.py
    sha256: 74abef84553d93dff78cfc0d4fdf337c88c34ec577f3d6a13c101bf4c2748577
    symptom_signature: "native author's report_defect kind TEST declaration refused NO_AUTHORIZATION_TICKET; test stays undeclared"
    observed_in: "Fabro runs WO-F014-SWE5-CRCL-20261102-L12 and -L12B (local line, Omniverse2, Ornith native SWE.5 author) and WO-F014-CMP-SWE6-CRCL-20261102-07 (cloud line, loop10, Claude native SWE.6 author), 2026-11-02"
    baseline_revision: e7ec0083726c32a0a7822df1b5735d97599fb972
    error_codes: ["NO_AUTHORIZATION_TICKET", "TEST_CHANGED_AFTER_FAIL", "REQUIRED_TOOL_NOT_PASS"]
    operations: [policy hook (fabro_hook ticket), mcp/sdk invoke + normalize_args, forge-evidence-mcp.report_defect, inspection/defects bent_tests]
    root_cause: "Fabro sends list arguments as JSON text; the MCP SDK JSON-decodes strings of non-str fields before the server (pre_parse_json), while the policy hook hashed the undecoded text: the one-time ticket never matched, every report_defect kind TEST declaration was refused NO_AUTHORIZATION_TICKET, the corrected test stayed TEST_CHANGED_AFTER_FAIL, two identical author rejections and BLOCKED STUCK."
    remedy: "sdk.normalize_args applies the SDK's JSON pre-parse rule (string value of a non-str field decoded unless it decodes to str/int/float) identically for hook and server, so the ticket binds the call the server executes."
  - id: RPR-114
