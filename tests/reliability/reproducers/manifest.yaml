    the Cortex-M55 target shall ...'); the SWE.1 author could not see what was wrong and repeated it for three cycles (r112 SWR-024, r114 SWR-020).
  remedy: A major EARS_SYSTEM_NAME_HINT finding names the parsed subject, lists the allowed system names and says to move qualifiers into the
    condition clause; the original issue code is unchanged.
- id: RPR-035
  script: rpr035_trace_feedback_not_actionable.py
  sha256: b6c7c84b92db95e65d73aea9ee60abdd6eca64f2dd681846942cbcd238b9c274
