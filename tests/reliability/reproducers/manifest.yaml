- id: RPR-161
  script: rpr161_verified_factory_source_hold.py
  sha256: 1a194eb008ec54d4f66cc6e43dd6c5f77eca1b24314acecd5da84378a2324b2b
  symptom_signature: verified factory cause retries its known failing source after
    fix qualification
  observed_in: Actual retained cloud WWDG SWE4 F, verified/effectiveness CAPA160,
    actual source002f independent PRESENT and qualified G27 prevention ABSENT; pure
    Planner baseline queued the known bad source with two preserved strikes.
  baseline_revision: 04d95051047ae0b5e13ed8b8b375ff61ada3bd3d
  error_codes:
  - VERIFIED_FACTORY_SOURCE_RETRY
  operations:
  - afo.line_orders.Planner.decide
  - afo.line_orders.Placer.cycle
  root_cause: Only open CAPAs are read. Qualified FIX moves CAPA to effectiveness
    observation while the campaign can still name its proven failing factory revision;
    UNKNOWN then follows normal retry.
  remedy: Keep open map/classifications unchanged; source-bound verified-cause guard
    requires eligible FIX contrast and exact source PRESENT receipt; replacement requires
    exact eligible promotion with cause-specific ABSENT prevention. Preserve history/counters,
    queued/live adoption, healthy PASS and signed admission.
