  - id: RPR-013
    script: rpr013_ll_no_concurrency_section.py
    sha256: 5bffeb47d50a7272f2d4dea6f3b67273e1a508634c0b14d9e0979561d2443181
    symptom_signature: "LL SWE.2 procedure omits concurrency and reentrancy"
    observed_in: r82
    baseline_revision: 14f1ab112c80f21dbb0f630916df596df2e7bb4a
    fix_revision: 68df55037fb4ebf58cd63b705b550b81b778f182
    error_codes: ["INSPECTION_FAIL:SWE2-03"]
    operations: [SWE.2/inspect]
    root_cause: "The LL SWE.2 procedure asked for read-modify-write access but no concurrency/reentrancy section, so SWE2-03 (concurrency, ISR synchronisation, reentrancy) failed on a one-line note."
    remedy: "The LL SWE.2 procedure requires a Concurrency and reentrancy section (stateless, non-atomic RMW, set/clear registers or caller serialisation, ISR use)."
  - id: RPR-014
