  - id: RPR-040
    script: rpr040_budget_wording_not_component_level.py
    sha256: 0b6e853b7f821ad351c811ecdd997e00145f6ad3a2206ab1300409e59df7dab9
    symptom_signature: "byte budget not recognised as component-level"
