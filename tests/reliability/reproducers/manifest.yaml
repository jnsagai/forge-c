    Matrix 4; the deterministic gate gave no actionable finding and the inspector rejected the contradiction with the PASS run.'
  remedy: The trace gate reports UT:/IT:TEST_NOT_OBSERVED for such a test and states how its checks must be named (<id> or <id>-<suffix>).
- id: RPR-043
  script: rpr043_resume_overwrites_provided.py
  sha256: ff1923291f0df9f95a670c493c6b39b95e331ee2bf294effdbb2f514022be790
  symptom_signature: resume overwrites provided read-only file
  observed_in: r132
  baseline_revision: 7427cf165442e53393aa9ba0d5c9541b26147951
  fix_revision: 591d62addd25eef8048edbd5e8bb87ca00f4b015
  error_codes:
  - RESUME_FAILED
  operations:
  - WORKORDER/resume
  root_cause: resume_from copied every file of the carried phases, including the HAL work order's provided read-only LL header; the new work order
    already holds its own verified 0444 copy, so the copy failed with Permission denied and the run never started (first HAL resume, r132/r133).
  remedy: Provided files are never copied; the source's copy must match the new work order's provided sha256, otherwise the resume is refused
    (RESUME_PROVIDED_MISMATCH).
- id: RPR-044
  script: rpr044_fake_state_query_constant.py
  sha256: 4e93207dad589b447753c172dfdd2f6f53a10bc9a0fe6a42bd3b0419f5ac4466
  symptom_signature: state query of the LL test double ignores Enable
  observed_in: r135
  baseline_revision: 2b03bc5b4eae90386f00ab7ec94bdc0385b29e9b
  fix_revision: ca9b5c084f003e5f4f54978e8176c0df76b8bbac
  error_codes:
  - REQUIRED_TOOL_NOT_PASS:run_unit
  - DEFECT:TEST
  - TURN_BUDGET_EXHAUSTED
  operations:
  - SWE.4/author
  - SWE.3/author
  root_cause: CAPA-038 iteration 1 made every LL uint32_t query scripted (default 0U); a state query such as LL_RCC_ADC12_IsEnabled() therefore
    read 0U right after LL_RCC_ADC12_Enable(), unlike the LL; r135's authors declared TEST defects (DEF-001, DEF-004) to work around it and the
    SWE.3 rework loop ran out of turns.
  remedy: Queries of a register bit that an LL function writes follow that bit (shadow state); flags no LL function writes (IsReady) stay scripted;
    ll_fake_return_from overrides both.
- id: RPR-045
  script: rpr045_fix_loop_turn_budget.py
  sha256: 534aae88fa05cea0b0df16bf814ebd156a4a225c5b6061a642332efa95937c6e
  symptom_signature: fix-loop visit has the first-pass turn budget
  observed_in: r137
  baseline_revision: c2c0273e6a25be8b69ab14ba64dae13d0029f3fd
  fix_revision: 78f2728564e24c26836f20c79c69e7731500dca4
  error_codes:
  - TURN_BUDGET_EXHAUSTED
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.3/author
  root_cause: A phase re-entered by an upstream loop to fix a reported defect had the first-pass turn budget although the visit must re-read its
    context, fix the code and re-validate unit specs, designs and trace tags; all three HAL SWE.3 fix visits (r135, r136, r137) ended TURN_BUDGET_EXHAUSTED
    and two of the runs then exhausted the rework budget.
  remedy: While a defect targeted at the author's phase is IN_FIX, its author gets LOOP_EXTRA_TURNS (15) on top of the authored budget; first
    passes and inspectors are unchanged.
- id: RPR-046
  script: rpr046_stale_unit_function_list.py
  sha256: b396d6e896d4ff9db8796711f1c9f965606e658a8859a9b52c4814a3f7c240da
  symptom_signature: unit function list not synchronised with the code
  observed_in: r129
  baseline_revision: 724d3f2cb053721c37e1467588659d5a9f74f7e7
  fix_revision: b2a6a925c2b955af636e6c2ab0cc20786433e846
  error_codes:
  - CODE:UNIT_FUNCTION_NOT_IN_CODE
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.3/author
  root_cause: A unit's 'Functions:' list in unit_specifications.md is a fact of the code (@unit tags) but was kept by hand; after code changes
    in SWE.3 rework it still named removed functions, the trace gate rejected UNIT_FUNCTION_NOT_IN_CODE and rework cycles went to bookkeeping
    (r129; r113 same class).
  remedy: sync_trace sets a unit's Functions list to the functions the code tags @unit <id> (units the code tags at all) before the SWE.3 trace
    check; changes are logged; specs, designs and code are untouched.
- id: RPR-047
  script: rpr047_fake_state_preset_internal.py
  sha256: b3ff13ab9bed37521d8522752ad5a8ed8048898bd0dda9800224ae77cea9ed9b
  symptom_signature: LL test double has no state preset and accepts internal helper calls
  observed_in: r146
  baseline_revision: 567f0c602aaa96fed5ba5c8b1e0cd060d3849416
  fix_revision: 353bc4bdb97007de3dee46826fd731a292adcb71
  error_codes:
  - INSPECTION_FAIL:SWE4-02
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.4/author
  - SWE.4/inspect
  root_cause: 'The generated LL test double (CAPA-038) documented no way to preset the state a state query reads (e.g. a peripheral already enabled),
    and its bit helpers were public; r146''s SWE.4 author called ll_fake_set_bit()/ll_fake_query_bit() with magic indices tied to the generated
    enum order (14 calls; r144: 2), the inspector rejected UT-009 (abstract bits, vacuous test) and the SWE.4 rework budget ran out.'
  remedy: ll_fake_set_state(query_fn, value) presets the state of a state query without an LL call (returns 0U for scripted flags); the helpers
    are named ll_fake_internal_* and run_unit fails a unit test that calls them (LL_FAKE_INTERNAL_CALL); the SWE.4 prompt names the preset call.
- id: RPR-048
  script: rpr048_asil_scope_states_qm.py
  sha256: 46b1522a3c55a02afbc5b4b946a0f23d28faac9e88b5cbf53ff6da1d5b0f7941
  symptom_signature: ASIL scope work order states QM safety allocation
  observed_in: r144-r152
  baseline_revision: 1da76b0489d35f66ccfccf498e855f5b165cd90e
  fix_revision: fdf081a5355e0f815e16a1ff217519dbdcdeaa12
  error_codes:
  - SAFETY_SCOPE:QM_CLAIM_IN_ASIL_SCOPE
  operations:
  - SWE.1/author
  - SWE.6/author
  root_cause: 'workorder.prepare recorded the owner scope (SC-RCC-2026-10-18, ASIL B) as safety_target but kept the example''s target.safety_allocation
    ''OUT_OF_SCOPE: QM development ... (owner decision 2026-10-15)''; the SWE.1 prompt turns OUT_OF_SCOPE into ''QM development scope: no software
    safety requirements are allocated'', and no gate or the EASA pilot check compared stated safety level with the scope. Found in owner review
    of batch 3 (r144, r147, r149-r152; LL r125 too).'
  remedy: An owner scope supersedes target.safety_allocation (ASIL B without allocation review -> 'software safety allocation PENDING owner allocation
    review'); the SWE.1 prompt states that gap and never QM; the author gate (SAFETY_SCOPE:...) and the pilot check (SAFETY_SCOPE_TEXT:...) reject
    a QM claim or another ASIL inside an owner ASIL scope.
- id: RPR-049
  script: rpr049_codex_reply_prose.py
  sha256: 2ef6e6aa4e975a6064d1a241e882ea6d83557136b40d2ced146e957115d1b92a
