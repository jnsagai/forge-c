    fix_revision: b2a6a925c2b955af636e6c2ab0cc20786433e846
    error_codes: ["CODE:UNIT_FUNCTION_NOT_IN_CODE", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/author]
