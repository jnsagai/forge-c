- id: RPR-136
  script: rpr136_ears_condition_with_commas_nonconformant.py
  sha256: df98ac1bb7509351fb3a4684d7ec27c4d4750a21d0d59ccfbadb147937bdc1f0
  symptom_signature: an EARS condition containing commas is NONCONFORMANT although it ends with ', [then] the <system> shall'
  observed_in: 'Fabro run WO-F014-SWE1-WWDGHAL-20261103-L32 (local line, Omniverse2, 2026-11-03): SWE.1 BLOCKED ''rework budget exhausted (3 failed
    cycles)''; the deterministic EARS check (forge-docs-mcp validate_artifact, check ears) kept SWR-010 (an If-condition listing the invalid arguments)
    and SWR-011 (a When-condition over activation, configuration or refresh) EARS_PATTERN_NONCONFORMANT across ~70 author tool calls'
  baseline_revision: 82e3291c903624fd5e8f9016462a26a51c126d77
  error_codes:
  - EARS_PATTERN_NONCONFORMANT
  operations:
  - inspection/ears match + check_statement (forge-docs-mcp validate_artifact ears
  - SWE.1 author gate
  - lrtx/swe1 self_check)
  root_cause: 'inspection/ears.py PATTERNS matched every EARS condition as (?P<pre>[^,]+): the condition had to end at its FIRST comma, so a condition
    containing a comma - a list of invalid arguments, several operations - could never match, and the finding EARS_PATTERN_NONCONFORMANT carried
    no hint of why. EARS allows commas in the condition; it ends at the comma before ''[then] the <system> shall''.'
  remedy: The condition is matched non-greedily (.+?) up to the comma followed by '[then] the <system> shall' in COMPLEX/UNWANTED/EVENT/STATE/OPTIONAL,
    so every statement the first-comma form matched keeps the identical split; a statement starting with If/When/While/Where that still has no
    split gets ':expected ...' after the unchanged EARS_PATTERN_NONCONFORMANT token.
