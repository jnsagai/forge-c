    after reset); the r116 author could not map it to a unit and SWE.3 stopped STUCK.
  remedy: Initial-state invariants are classified as component-level (like resource budgets); SWR_NOT_REFINED states what to add for ordinary
    SWRs.
- id: RPR-037
  script: rpr037_sub_check_ids_with_underscore_not_run.py
  sha256: 42e5931fd2206eabd3e4755ec79051eda55e465e40556162867f9ef803ff01dc
