  - id: RPR-120
    script: rpr120_truncated_write_argument_forced_to_field_value.py
    sha256: 71cf1ba06ca9462619281fd6c1375b7895e8da0f27ee6bd750ba1ebb752099eb
    symptom_signature: "a truncating-write case cannot pass the SWE.2 argument check with the above-field input its requirement requires"
    observed_in: "Fabro run WO-F014-CMP-SWE2-IWDGG-20261102-08 (cloud comparison line, loop10, 2026-11-02)"
    baseline_revision: 2a88c806dfd5109173bcbb2744560fa8c2f989cf
    error_codes: []
    operations: [lrtx/swe1 register effects (author schema, validation, assembly), assurance/register_contract check_effects, lrtx/swe2 validate_interfaces]
    root_cause: "SWR-009 is a truncating write (requested value above 0xFFF, only bits 11:0 reach IWDG_RLR.RL; verified with 0x00001234 -> RL == 0x234). The SWE.1 register-effects contract could record only the resulting field value (RLR_RL_WRITE_TRUNCATED value 0x234; the author schema had no other property and the value must fit the field), and lrtx/swe2.py validate_interfaces required the api_calls.json argument to equal that value, so the author wrote LL_IWDG_SetReloadCounter(0x234U) and the inspector correctly rejected it as not exercising the above-0xFFF input (SWE2-06 three times: BLOCKED STUCK SAME_ITEM_FAILED_3X)."
    remedy: "A write effect may carry an optional requested input next to the field value (SWE.1 author schema and rule; validated at SWE.1 and by check_effects as a 32-bit number above the field whose low field-width bits are the value; SWE.1 flags a write whose verification calls with such an input but records none). The SWE.2 check requires the call argument to equal the requested input when present, otherwise the value (the truncated value is refused); the SWE.2-6 case listings show the requested input. Baselines without requested are unchanged."
  - id: RPR-121
    script: rpr121_swe3_design_without_timing_bound.py
    sha256: 4af062f1cfaa2ebe9afeed54c3fee838ef83b77b85cf5f5fe24b2d2d21d658ba
    symptom_signature: "the SWE.3 detailed design gives no per-call timing bound for the simulation performance budget"
    observed_in: "Fabro runs WO-F014-CMP-SWE3-OBL-20261102-09 and WO-F014-CMP-SWE3-IWDG-20261102-09 (cloud comparison line, loop10, 2026-11-02)"
    baseline_revision: 7788a927fd11a735a23db6a2e6f545c08d4d02df
    error_codes: []
    operations: [lrtx/swe3 visit_design detailed design]
    root_cause: "Work orders with a simulation_performance allocation carry SWRs 'complete each measured call within 64 executed target instructions / 100 microseconds of virtual time in the pinned Renode simulation at 100 MIPS'. The structured SWE.3 detailed design is rendered deterministically by lrtx/swe3.py visit_design from the code tasks and the measured tools (flash, RAM, stack, static analysis) and had no timing bound for these requirements; the author could not add one (the design is factory-rendered, swe3-author has no disassembly or simulation grant) and wrote only 'unverified'. The inspector failed SWE3-03 ('timing ... bounded') in all three rounds of both work orders (BLOCKED STUCK SAME_ITEM_FAILED_3X)."
    remedy: "For a greenfield header-only LL order with a simulation performance budget the factory compiles the measurement unit SWE.6 measures (forge_measure_<function> wrappers) with the pinned cross compiler at the target-cm55-gcc flags, disassembles it and records the static instruction count of each straight-line wrapper (no branch, call, loop, table branch, low-overhead loop, pc write or wait; one final return; refused as NOT_BOUNDED otherwise) and the derived virtual time at the budget's MIPS against the budget, in workproducts/SWE.3/static_timing_bound.json (frozen with the SWE.3 baseline, header/unit/object hashes) and a 'Timing bound (static analysis)' design section. SWE.6 Renode measurement stays the verification; no hardware WCET is claimed; orders without the budget are unchanged."
  - id: RPR-122
    script: rpr122_call_outage_counted_as_author_rejection.py
    sha256: 539c77f9b34dd96c82d5ff9a3738bc0ffd4229750a91a793808568625b913871
    symptom_signature: "a model-call outage visit is recorded as a rejected author attempt and the route ends the phase as STUCK"
    observed_in: "Fabro run WO-F014-CMP-SWE1-CRCL-20261102-10 (cloud comparison line, loop10, 2026-11-03; owner Claude account usage limit 00:59-01:05Z)"
    baseline_revision: 2a2513d168e003472a4f9157fa1cdb9b6b9ab459
    error_codes: []
    operations: [lrtx/visit run_task, inspection/gate author/inspect/route]
    root_cause: "During the account outage every structured SWE.1 author call returned CALL_REFUSED:bridge_upstream_failed; lrtx/visit.run_task treated it as a failed attempt (immediate retries, task INVALID), the visit ended FAILED, the author gate recorded the visit as a REJECTED attempt (LRTX_TASK_INVALID:...CALL_REFUSED) and the route's STUCK rule (identical deterministic rejection twice) ended the phase 'BLOCKED STUCK: repeated rejection without changed evidence; external diagnosis required'. The next visit also lost the inspection findings (the outage visit counted as the last finished visit). The local line has the same exposure (CALL_FAILED transport errors, gateway HTTP 500 / PROVIDER_REQUEST_OUTCOME_UNKNOWN when llama-server/Ollama is down)."
    remedy: "A refused/unreachable model call (inspection/outage.py classification; admission, budget and 4xx refusals excluded) is no repair attempt: the visit waits and retries with a bounded visit-wide schedule (FORGE_LRTX_OUTAGE_WAIT_S, default 600 s), then ends with INFRA_UNAVAILABLE:MODEL_CALLS_REFUSED and the checkpoints untouched. The author/inspect gates record an INFRA_UNAVAILABLE outcome (never REJECTED, never a re-use of an earlier verdict) and the route ends the phase BLOCKED with a retryable infra_outcome before any rework cycle, development reservation, STUCK/same-item rule, auto defect or advisory record; the package states SWE.n:INFRA_UNAVAILABLE."
  - id: RPR-123
    script: rpr123_unexamined_evidence_routed_as_product_finding.py
    sha256: 9d7155c842ce771f5da6383bee6616f8782c9c6c5008eb2554d46ad3fc588d5d
    symptom_signature: "an inspection whose findings say the evidence was not examined is routed to the author as a product finding"
    observed_in: "Fabro run WO-F014-CMP-SWE3-IWDGHAL-20261102-10 (cloud comparison line, loop10, 2026-11-03)"
    baseline_revision: 3a3507883c55673cacabefcfb61bf6136573444d
    error_codes: []
    operations: [mcp/evidence check_inspection, inspection/engine record_inspection + gate, inspection/gate inspect/route, lrtx/reinspect, workflow/prompts native inspector]
    root_cause: "The native SWE.3 inspector's grep on a file path returned nothing and the role policy reserved its last calls (16/20); following the prompt rule 'retain an explicit finding for evidence you could not examine' (workflow/prompts.py inspector_prompt) it recorded INS-SWE.3-001 PASS and then INS-SWE.3-002 FAIL with SWE3-01/SWE3-06 'not examined (budget reserved)'. check_inspection/Store.record_inspection recorded them as major product findings and the gate sent the author to rework; the next three inspector sessions failed on the account outage before any call and step_inspect re-used INS-SWE.3-002 as a new failed inspection each time, until 'rework budget exhausted (5 failed cycles)'."
    remedy: "A FAIL item whose every finding states unexamined evidence (NOT_EXAMINED marker or the incident wording; narrow, real-defect wording excluded) is no product finding: without another major finding the submission is an INCOMPLETE inspection (inspection/<phase>/incomplete/INC-*.json, voiding an earlier PASS of the baseline) and the gate re-inspects (bounded, then BLOCKED INSPECTION_INCOMPLETE_REPEATEDLY); with real majors the INS is FAIL as before and the unexamined items are flagged and kept out of the author's findings and the same-item rules. An inspector visit that recorded nothing re-inspects (bounded, then BLOCKED INSPECTION_NOT_PERFORMED_REPEATEDLY) instead of re-using the earlier verdict. Neither counts as a rework cycle; the reinspect node returns straight to the inspector. The native inspector prompt asks for ID=FAIL:NOT_EXAMINED:<what> and never a PASS/FAIL on unexamined evidence."
  - id: RPR-124
    script: rpr124_no_wait_hal_view_timeout_path.py
    sha256: bb9cade6ea5a9aa8779f36adc249c23d02ab71baa3bd6fc899873d4cd3c19b9c
    symptom_signature: "the SWE.2 dynamic view of a no-wait HAL (CRC) is rejected for a missing HAL_TIMEOUT path"
    observed_in: "Fabro run WO-F014-SWE2-CRCHAL-20261103-L26 (local line, Omniverse2, CRC HAL order 0014m on run/gen8d, 2026-11-03)"
    baseline_revision: 7788a927fd11a735a23db6a2e6f545c08d4d02df
    error_codes: [VIEWS:DYNAMIC_MISSING_TIMEOUT_PATH]
    operations: [inspection/views check_views]
    root_cause: "inspection/views.py:check_views (line 66) required the string HAL_TIMEOUT in the SWE.2 dynamic view of every non-LL work order. The CRC HAL has no wait and no timeout (crc.yaml: hal_wait_rule 'No HAL_CRC_ function waits', RM0486 26.3.3; hal_dynamic_view names no timeout path), so the author was rejected twice with VIEWS:DYNAMIC_MISSING_TIMEOUT_PATH and SWE.2 ended BLOCKED STUCK (identical deterministic rejection twice)."
    remedy: "layer.hal_waits(ws) decides from the peripheral profile whether the HAL has a bounded wait: a hal.time_base, RCC, a HAL wait text (hal_wait_rule, hal_failure_responses, hal_dynamic_view) left to the waiting RCC default, or one of them naming HAL_TIMEOUT. The timeout path is required only then; IWDG, RCC and every profile without its own HAL texts still require it."
  - id: RPR-126
    script: rpr126_no_wait_hal_swe1_timeout_requirement.py
    sha256: c2824b08abc8dbfe37c51f86d68a21cf59e851b53c142e2f36a339b46e72a8b5
    symptom_signature: "the SWE.1 HAL prompt of a no-wait HAL (CRC) demands a polling-iteration timeout bound"
    observed_in: "Fabro run WO-F014-SWE2-CRCHAL-20261103-L26 (local line, Omniverse2, CRC HAL order 0014m on run/gen8d, 2026-11-03)"
    baseline_revision: 454690a5fdd5ff116dad4a2fbe52e0600a607d2b
    error_codes: []
    operations: [workflow/prompts peripheralize (SWE.1/SWE.2/SWE.3 HAL author prompts)]
    root_cause: "workflow/prompts.py:peripheralize removed the RCC timing requirement ('one measurable timing requirement (every wait is bounded by HAL_RCC_TIMEOUT_VALUE = 1000 polling iterations)', prompts.py:129-130), its pass-criterion example (line 119) and the header line '#define HAL_RCC_TIMEOUT_VALUE 1000U' (line 294) only for a profile with hal.time_base. The CRC HAL has no wait, so its SWE.1 prompt asked both for 'every HAL_CRC_ function returns without waiting' and for a 1000-iteration bound; the frozen L26 SWE.1 baseline got the spurious SWR-018 and the SWE.2 author drew an invented polling loop."
    remedy: "For a HAL that does not wait (layer.hal_waits_of, the CAPA-124 decision from the profile) the SWE.1/SWE.2/SWE.3 HAL prompts drop the RCC timing requirement, its example and the TIMEOUT_VALUE define, and the SWE.2 'Timeouts and error handling' section becomes 'Error handling and timing'; the profile's hal_failure_responses and hal_wait_rule stay. Prompts of waiting HALs (IWDG, RCC, every profile without own HAL texts) are byte-identical."
  - id: RPR-127
    script: rpr127_no_wait_hal_swe5_timeout_and_boundary.py
    sha256: 635990661988862ca876c68ccbe7bdb158fce9fbb7e370fdcb14ddcee83b39bf
    symptom_signature: "a no-wait HAL's SWE.5/SWE.6 prompts ask for timeout tests, or a correct non-RCC boundary test is not recognised"
    observed_in: "Fabro run WO-F014-SWE2-CRCHAL-20261103-L26 (local line, Omniverse2, CRC HAL order 0014m on run/gen8d, 2026-11-03; follow-up of CAPA-124/126) and IWDG HAL run WO-0009B-STM32N6-IWDG-HAL-h005 (2026-10-20, INTEGRATION_CATEGORY_MISSING:boundary)"
    baseline_revision: c5a79c7a80914c15429edc7ff44379b224f842cd
    error_codes: [INTEGRATION_CATEGORY_MISSING]
    operations: [workflow/prompts peripheralize (SWE.5/SWE.6 HAL author prompts), assurance/target integration_categories, assurance/verifiers v_integration]
    root_cause: "(1) The RCC SWE.5 fallback 'write test_rcc_target.c and test_rcc_target_timeout.c ... scenario never_ready for the timeout file', the report text '(timeout paths, measured sizes)' and the SWE.6 hint 'add scenario=never_ready for timeout behaviour' were kept for every peripheral, so the CRC HAL (no wait) was asked for a timeout target file and timeout paths. (2) The SWE.5 BOUNDARY_INTEGRATION category (assurance/target.py:142) recognised only RCC boundary arguments (TIMEOUT_VALUE + 1, (0U), 1000, 1001): a CRC count of 0 or a field-limit value and IWDG's HAL_IWDG_TIMEOUT_MS + 1U were reported as INTEGRATION_CATEGORY_MISSING:boundary."
    remedy: "For a HAL-layer work order of a no-wait HAL the SWE.5 fallback writes the target-test step's files, the report names error paths and the SWE.6 hint drops never_ready; LL prompts and waiting HALs are byte-identical. boundary_rule(ws) keeps the RCC pattern and adds, for a time-base HAL, its HAL_<PFX>_*TIMEOUT* constant as a call argument or + 1U, and for a no-wait HAL a count of 0 or the maximum / first-above value of a 2..31-bit field the register contract writes (RM index width), as a HAL API argument or member assignment."
  - id: RPR-128
    script: rpr128_hal_on_st_ll_not_buildable.py
    sha256: c3e7bb6f4c0bea9085fe28066210b93b4cb6d62a690d04bc82cc4017b22669ed
    symptom_signature: "a HAL work order on an ST (CMSIS) LL gets no LL test double and no vendor build inputs"
    observed_in: "Fabro run WO-F014-SWE3-CRCHAL-20261103-L27 (local line, Omniverse2, CRC HAL order 0014m on run/gen9 378aa68a, --provided-from the ST CRC LL WO-F014-SWE6-CRCL-20261103-L24, 2026-11-03)"
    baseline_revision: a88b61a5efc0a49d6d7f52d88c0b7c47f75caa96
    error_codes: []
    operations: [workflow/ll_fake generate, workorder prepare (HAL --provided-from), brownfield/cmsis host_flags + target_flags + write_host_device, mcp tests run_unit/run_integration, mcp build compile, mcp analysis]
    root_cause: "(1) workflow/ll_fake.py:28 matched only 'static inline (void|uint32_t) LL_*' functions, so generate (line 205) raised 'no static inline LL function in the provided header' on ST's LL headers (__STATIC_INLINE, the CMSIS instance pointer CRC_TypeDef *CRCx, uint8_t/uint16_t queries); the HAL unit tests, which assume the generated double, had none, and the pointer argument would have been cast to uint32_t (an error in the GoogleTest C++ unit). (2) workorder.prepare (lines 278-279) copied only the provided LL header into the HAL workspace; the header includes stm32n6xx.h, but the source LL work order's vendor includes (inputs/vendor/include, delivered_dependency) were not carried, and brownfield/cmsis.py host_flags/target_flags (lines 113-124) gave the host device directory with the host CMSIS stub, the defines and -mcmse only to a work order whose own delivery is CMSIS (is_cmsis keyed on the delivery). The first L27 target compile failed with 'stm32n6xx.h: No such file or directory'; the SWE.3 author then wrote its own stm32n6xx.h stub and a register-array HAL that bypasses the LL."
    remedy: "ll_fake also accepts __STATIC_INLINE/__STATIC_FORCEINLINE LL functions returning void or a (u)int8/16/32_t: pointer parameters (the instance) are not recorded, scalar arguments are, non-uint32_t queries are cast, SET_BIT/CLEAR_BIT (ATOMIC_) on the instance member set state bits that READ_BIT queries follow; static inline functions keep their exact processing (doubles byte-identical, checked on the 30 loop10 and 4 Omniverse2 HAL fakes). workorder.prepare of a HAL on a CMSIS-delivered LL copies the source work order's vendor include files (each byte-identical to its manifest sha256, else PROVIDED_BUILD_INPUT_MISMATCH) read-only into inputs/vendor/include and records them with the defines/secure setting as manifest provided_build; cmsis.host_flags/target_flags/write_host_device use them (hash re-checked, PROVIDED_BUILD_INPUT_CHANGED), and the HAL's host compile units force-include forge_host_device.h (weak RAM struct of the instance), so the HAL's own LL_CRC_*(CRC, ...) calls reach the host register model in integration tests (not for cppcheck). Greenfield LL -> HAL work orders get no provided_build and unchanged flags."
  - id: RPR-129
    script: rpr129_swe3_malformed_unit_ids_reported_as_no_units.py
    sha256: 24f8bdedbdad7677e8761a5af9c8775cb73292f800b3ec24b589717b15e74262
    symptom_signature: "malformed SWE.3 unit/spec ids are rejected only as NO_UNITS, without naming the ids or the required form"
    observed_in: "Fabro run WO-F014-SWE3-CRCHAL-20261103-L27 (local line, Omniverse2, CRC HAL order 0014m on run/gen9 378aa68a, 2026-11-03): SWE.3 BLOCKED 'STUCK: identical deterministic rejection twice (UNIT:NO_UNITS, UNIT:SWR_NOT_REFINED:...)'"
    baseline_revision: 5f19d046ee64df1698caed3a8b2c5e146b408cbf
    error_codes: [UNIT:NO_UNITS, UNIT:SWR_NOT_REFINED]
    operations: [inspection/swtrace check_units + parse_units (SWE.3 unit_spec_and_code_trace gate)]
    root_cause: "The SWE.3 author tagged the HAL code (@unit SWU-CRC_HAL, @spec USPEC-HAL-CRC-001) and wrote unit_specifications.md with the same ids instead of SWU-HAL-01 / USPEC-HAL-01-01 (prompts.py:654 states the form). inspection/swtrace.py parse_units (line 164) accepts only SWU-(LL|HAL)-nn headings, found no unit, and check_units (line 295) reported only UNIT:NO_UNITS plus one UNIT:SWR_NOT_REFINED per SWR: no finding named the malformed ids or the required form, so the author repeated them and the route gate stopped SWE.3 as STUCK."
    remedy: "swtrace.malformed_ids: check_units first reports UNIT:MALFORMED_UNIT_ID:<id> / UNIT:MALFORMED_SPEC_ID:<id> for every unit heading, spec item and code @unit/@spec tag that looks like an id (SWU-*, USPEC-*) but is not SWU-<L>-nn / USPEC-<L>-<unit nn>-nn (L from the layer: LL, HAL, or both), with the required form, an example and where to rename it. parse_units stays strict; well-formed ids get no new finding."
  - id: RPR-130
    script: rpr130_provided_st_ll_static_findings_counted_against_hal.py
    sha256: 3f6653a9f6d91c51f17ce8b2ee0158ef336559f23753d27f534227826fb30641
    symptom_signature: "cppcheck findings in the provided FROZEN LL header are counted as HAL issues"
    observed_in: "CAPA-128 verification of the CRC HAL on the ST CRC LL WO-F014-SWE6-CRCL-20261103-L24 (resumed copy of WO-F014-SWE2-CRCHAL-20261103-L27, loop10 scratch, 2026-11-03): cppcheck FAIL with MISRA-20.7:stm32n6xx_ll_crc.h:145/153"
    baseline_revision: 90ff4f4abc5e670b470781a8c5c750639193ddf5
    error_codes: [MISRA-20.7]
    operations: [mcp/analysis cppcheck + clang_analyze (frozen_paths, vendor_paths), workorder provided_ll, brownfield/package findings]
    root_cause: "mcp/servers/analysis.py frozen_paths (line 113) and vendor_paths (line 122) class findings as DELIVERED_CODE only for files of the work order's own FROZEN delivery; a HAL work order (no delivery) on the provided FROZEN ST LL counted cppcheck findings located in the provided header (MISRA-20.7 in ST's LL_CRC_WriteReg/ReadReg macros) as HAL issues, so cppcheck FAILed the HAL author for code it may not change, while the LL work order classes the same findings as owner findings; brownfield/package.py findings (line 48) returned [] for every non-brownfield work order."
    remedy: "workorder.provided_ll records the source's code mode (delivered_code_mode) for a delivered LL; brownfield.provided_frozen_paths lists the provided FROZEN files; analysis frozen_paths/vendor_paths include them, so cppcheck and clang_analyze class findings located there as DELIVERED_CODE (delivered findings reports), and brownfield/package.findings lists them as owner package gaps of the HAL unless an owner disposition settles them. Findings in the HAL's own code stay HAL issues; greenfield provided LLs are unchanged."
  - id: RPR-131
    script: rpr131_hal_prompts_omit_provided_ll_instance.py
    sha256: fb38715c1ce9c05c7a749bdfe8e2ffd8aae824d3a1f3a5fd592e0a026495f39a
    symptom_signature: "the HAL author prompt calls the provided ST LL functions without their CMSIS instance argument"
    observed_in: "CAPA-128 review of WO-F014-SWE3-CRCHAL-20261103-L27 (CRC HAL on the ST CRC LL, 2026-11-03): the swe3_hal_author prompt shows LL_CRC_ResetCRCCalculationUnit(), LL_CRC_FeedData32(p_data[i]), LL_CRC_ReadData32()"
    baseline_revision: b46867263dd40c0ff65f6dac36352784064519c3
    error_codes: []
    operations: [workflow/prompts hal_author_prompt + peripheralize (profile hal_example), workflow/builder build, workorder run]
    root_cause: "The HAL author prompts take the LL calls from the peripheral profile's HAL texts (config/factory/peripherals/crc.yaml:144 hal_example: LL_CRC_FeedData32(p_data[i]) ...), written for the greenfield register-array LL; workflow/prompts.py HAL_ON_PROVIDED_LL (line 621) only says to use the provided functions. ST's provided LL takes the CMSIS instance first (LL_CRC_FeedData32(CRC_TypeDef *CRCx, uint32_t InData)); nothing told the HAL author to pass CRC."
    remedy: "brownfield/cmsis.provided_api derives the instance API from the provided header (functions whose first parameter is <P>_TypeDef *, the instance macro, signatures, example calls); workorder.run passes it to builder.build for a HAL work order; prompts.providedize adds the instance to every call of a provided LL function in the prompts and extends the provided-LL rule with the instance macro, an example call and a real signature. No per-profile edits (CRC and WWDG from their headers). Greenfield LLs give no API: 48 builder graphs byte-identical to the parent; the greenfield control in the reproducer is a frozen sha256."
  - id: RPR-132
    script: rpr132_fatal_compile_error_not_in_issues.py
    sha256: b168f1ad1409d15646c2090d544011d66d8ceb1801936d8f8db6e784950d8432
    symptom_signature: "a fatal compile error (missing header) is not in the tool issues and clang_analyze passes the unit"
    observed_in: "Fabro run WO-F014-SWE3-CRCHAL-20261103-L27 (local line, Omniverse2, 2026-11-03): forge-build-mcp compile FAIL '0/1 units compiled (target-cm55-gcc)' with issues [] while the log says 'fatal error: stm32n6xx.h: No such file or directory'"
    baseline_revision: 5617b3afca29d28eae673eb1bfcfd829466c9f4a
    error_codes: []
    operations: [mcp/build compile, mcp/tests run_unit/run_integration (_diag), mcp/analysis clang_analyze]
    root_cause: "mcp/servers/build.py compile_ (line 146) collected only lines with ': error:' or ': warning:'; a fatal diagnostic reads ': fatal error:', so the failed unit had an empty issue list. mcp/servers/tests.py (line 228) filtered BUILD_FAIL diagnostics the same way, and mcp/servers/analysis.py clang_analyze (line 154) fails only on collected lines, so it PASSED a unit it could not analyse."
    remedy: "compile, run_unit/run_integration and clang_analyze collect ': fatal error:' lines; a failed compile unit without a diagnostic line gets COMPILE_FAILED:<unit>:exit <n>:<last line>, a failed analyzer run ANALYZE_FAILED:<unit>:exit <n>. Clean builds are unchanged."
  - id: RPR-133
    script: rpr133_checklist_item_edit_invalidates_unrelated_verdicts.py
    sha256: 0376795e695bbea2203141296c3e68f9833b4b570ae791be1f854b97ecbb337f
    symptom_signature: "an edit to a checklist item that does not apply to the order invalidates the order's inspection verdict"
    observed_in: "lineage invalidation after oracle commit a88b61a5 (checklist SWE2-08 wording): provided_ll refused the verified ST CRC LL lineage WO-F014-SWE6-CRCL-20261103-L24 (local line, Omniverse2) with PROVIDED_LL_NOT_VERIFIED:...:SWE.2; the SWE.2 gate of CRC HAL WO-F014-SWE2-CRCHAL-20261103-L27 also recomputed REINSPECT (2026-11-03)"
    baseline_revision: a88b61a5efc0a49d6d7f52d88c0b7c47f75caa96
    error_codes: [INSPECTION_ASSESSMENT_CONTEXT_CHANGED, PROVIDED_LL_NOT_VERIFIED]
    operations: [inspection/engine gate + applicable + record_inspection, inspection/assessment_context checklist, workorder provided_ll, workorder resume_from, brownfield/resume]
    root_cause: "inspection/engine.py:413 re-inspected whenever the inspection's checklist_sha256 differed from the current resolved checklist sha, and that sha (assessment_context.py:70 over engine.py:80) covers the WHOLE base + overlay file. a88b61a5 changed only SWE2-08's wording (timeout path only where the HAL has a bounded wait), so every earlier SWE.2 verdict recomputed REINSPECT INSPECTION_ASSESSMENT_CONTEXT_CHANGED, LL orders included, and provided_ll (workorder.py:157) refused L24."
    remedy: "inspection/item_binding.py: the verdict is bound to the checklist context (phase, version, policy, assessment context, QM tailoring) and to the items that apply to the order (applies_when as before, optional applies_to layer/purpose selector), each hashed over every field except source and owner revision records. It holds only when the context and the ordered applicable item ids are equal, the inspection judged each of them and every item hash is equal or bridged by an owner revision record bound to exactly the recorded and current item hash for this order's layer/purpose. New records carry their item binding; older ones are resolved from the repository history (the historical checklist whose composed sha equals the recorded checklist_sha256), else re-inspect. Added, removed, reordered or newly applicable items and any change of an applicable item's criterion, evidence, severity, required flag, deterministic check or selector re-inspect."
  - id: RPR-134
    script: rpr134_hal_bypasses_provided_st_ll.py
    sha256: 66c54e5383249a6c36c88b0e71028cc223b25e16b8e53677281768ed29edaad2
    symptom_signature: "SWE.3 does not refuse a HAL that accesses the registers directly instead of calling its provided ST (CMSIS) LL"
    observed_in: "Fabro run WO-F014-SWE3-CRCHAL-20261103-L27 (local line, Omniverse2, 2026-11-03): the SWE.3 HAL source declares extern volatile uint32_t CRC_registers[] and writes the CRC registers with WRITE_REG/MODIFY_REG/SET_BIT, bypassing the provided ST LL"
    baseline_revision: 65b4672752f2c8318ee59034622c9727d1cd6f32
    error_codes: []
    operations: [inspection/implementation check_implementation (HAL layer)]
    root_cause: "For a greenfield LL the generated test double drops the register array, so a HAL that bypasses the LL does not build in its unit test (CAPA-038). With ST's LL (CAPA-128) the double keeps the device header (CRC_TypeDef, the CRC macro, WRITE_REG), so direct register access builds; inspection/implementation.py check_implementation (HAL branch, line 121) checks only that the LL functions the HAL calls exist and has no rule against direct register access."
    remedy: "implementation.hal_bypass_findings: for a HAL on a provided CMSIS LL (brownfield/cmsis.provided_api) the HAL source and header (comments and literals stripped) are refused with IMPL:HAL_BYPASSES_LL:<file>:<line>:<token> for the instance dereferenced, the CMSIS register macros, the LL WriteReg/ReadReg macros, the host RAM struct, an own volatile register array and the instance base address. HALs calling only the provided LL and every greenfield HAL are unchanged."
