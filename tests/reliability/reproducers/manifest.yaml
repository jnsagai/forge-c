  - acp/attach
  root_cause: acp.attach matched each node statement with a single-line regex. swe4_test_author (unit-test example) and swe3_hal_author (HAL example)
    carry prompts with real line breaks, so their statements span several lines, never matched, and kept the Fabro run model (DeepSeek) in runs
