- id: RPR-144
  script: rpr144_launcher_reads_previous_command_output.py
  sha256: 5fb3ce08cc4c793f2f50acd17441e82a8553d8c0b7c2bf60bf344f90d7e7e020
  symptom_signature: the line launcher interprets accumulated command output as the current model probe
  observed_in: 'Omniverse2 ACT startup 2026-11-04: CRC HAL SWE.5 L31C and WWDG HAL SWE.5 L32B refused SMOKE_FAIL before Fabro launch although
    Ornith and Qwen swaps and both model lists were correct'
  baseline_revision: 211f1162f0815ba244015292a911f6ce1cb09bdc
  error_codes:
  - SMOKE_FAIL
  operations:
  - afo.line_launcher ShellHost.stack model-swap smoke
  root_cause: ShellHost.stack appends subprocess output to an attempt log and returns the accumulated log on every invocation. curl model-list
    responses have no final newline; the second probe returns two concatenated JSON objects, so _last_json returns None and the healthy Qwen response
    is reported as an empty model list. Empty current output can also reuse a prior successful JSON reply.
  remedy: Keep the complete append-only command log, but record the invocation byte offset and return only the current invocation's bounded output.
    A real-subprocess reproducer checks both newline-free model probes and an empty-current-output control.
