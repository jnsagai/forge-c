    remedy: "SPEC_NOT_IMPLEMENTED names the unit and the functions whose @spec line should carry the item; DESIGN_RENDER_FAILED includes the PlantUML -syntax result and a start/end hint."
  - id: RPR-036
    script: rpr036_initial_state_swr_forced_into_units.py
    sha256: 0deb0f1a7e39dddbe8946dbfe509231c56d84a7a31ca08ecf837345a16691e23
