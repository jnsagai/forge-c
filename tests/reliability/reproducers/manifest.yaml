  sha256: 1371342046b4fbc37455ce66943d753de19bcd991fa6f8f7605335dccaa5823f
  symptom_signature: provided LL unit register observation unavailable
  observed_in: Actual cloud WWDG SWE.4 T1F FACTORY DEF-001; independent same-RAM original
    LL vs generated fake CPU contrast and unchanged retained HAL Refresh probe
  baseline_revision: 796d662a450b243843f7637c15bba29b57adf2f1
  error_codes:
  - PROVIDED_LL_UNIT_OBSERVATION_UNAVAILABLE
  operations:
  - forge-tests-mcp.run_unit
