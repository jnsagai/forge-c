- id: RPR-163
  script: rpr163_wwdg_reserved_write_false_pass.py
  sha256: fcd8a5538272bb6b843a7cd36ff644365c37d489ffeefc7fb27a5de8938d0c85
  symptom_signature: reserved SR write credited as full WWDG unit verification
  observed_in: Independent actual Renode CONTROL; original ST complement SR write
    has before1/after0/HAL_OK but writes reserved bits as1; not production SWE4 PASS
  baseline_revision: b0d8ef13998291a3e16d65d5158a63eaf7bfdadf
  error_codes:
