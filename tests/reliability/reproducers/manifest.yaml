      author-side check (any author path), unchanged on code without it'
  symptom_signature: SWE.1 baseline that records a critical owner obligation as a gap is frozen by the author gate
  observed_in: 'Fabro SWE.1 run WO-F014-SWE1-OBL-20261031-02 (01M69RYT6NP8Y8ZXB3MB173SDP) on Omniverse2 2026-10-31: Qwen3.8 medium recorded the
    critical OBL-preserve-other-registers as an obligation gap (''covered by the register-level task''); no requirement implements it; author
