    fix_revision: 40a3b31228f77704876063e716ee7e55942fbf38
    error_codes: ["IMPL:NO_ALLOCATED_HAL_FUNCTIONS_IN_SWE2", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/verify, SWE.3/author, evidence/allocation_map]
    root_cause: "inspection.implementation.allocated_functions and mcp.servers.evidence._allocation_map called layer.api_prefix(layer_of(ws)) without the workspace, so the default (RCC) profile gave HAL_RCC_; the IWDG LL runs used the LL path where the same call was not reached with a HAL layer. h001's SWE.2 allocated HAL_IWDG_Init/HAL_IWDG_Refresh, the check found none and SWE.3 exhausted its rework budget; the authors escalated DEF-001/DEF-002 (FACTORY)."
