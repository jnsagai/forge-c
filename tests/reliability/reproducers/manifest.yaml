  - IMPL:LL_EXTRA_COMPILE_UNIT
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.3/regmap
  - SWE.3/author
  root_cause: The SWE.2 register-table contract asks for one row per register/bit with a 'name' column; the r166 author wrote register.field names
    (RCC_CR.HSION). The register map generator accepted only bare RCC_ names, found none, BLOCKED and skipped writing the generated LL compile
    unit; the SWE.3 author wrote its own compile unit, which the CAPA-046 check rejects and which no author tool can delete, until the rework
    budget ran out.
