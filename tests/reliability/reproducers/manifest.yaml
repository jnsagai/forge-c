    remedy: "finalize.tool_records builds the record from evidence/tool-results.jsonl (each tool with the version its MCP result recorded, the calling operations, call counts and times) and .forge-run/model-profile.json (Codex authors, Claude inspectors, the run model and its status); known_limitations names only DISABLED operations not used by this run. The PlantUML entry states that the jar version is not recorded."
  - id: RPR-069
    script: rpr069_setclear_read_returns_target.py
    sha256: 26ace75715b2a7e3c29c88aa369d16fb28e043fd55563bacdc52c42077381ced
    symptom_signature: "a read of a write-only set/clear register returns its target register"
    observed_in: rc1 (WO-0008A-STM32N6-RCC-LL-rc1)
    baseline_revision: 7ec4af1a8e5523da7c08a217f551bd05a5a14766
    fix_revision: 0e31a13ed44d9f6191dda022e30cbbf3bfba41cf
    error_codes: ["unresolved_finding:escalated_defect:FACTORY"]
    operations: [sim/rcc_model, SWE.6/run_robot]
    root_cause: "The 8 KB RCC model added for the ST pilot (feature 008 follow-up) returned the target register on a read of a set/clear register, an assumption marked NOT_VERIFIED. RM0486 marks those fields write-only ('w', e.g. RCC_CSR p.647), so they read 0; with the old behaviour, a factory-style SWE.6 full-register preservation check saw RCC_CSR change whenever RCC_CR was written, and the author escalated DEF-003 (FACTORY) - the regression campaign rc1 package for 0008a stayed BLOCKED."
    remedy: "A read of a set/clear register returns 0 (write-only per RM0486); writes still set/clear their target register. The NOT_VERIFIED assumption is replaced by the RM access type."
  - id: RPR-070
    script: rpr070_verifies_rule_not_explicit.py
    sha256: 1b7d34cd9cbc37f7fa4cf2b72954be696f47845b2f2cb9d50119f102fc7960bb
    symptom_signature: "the unit-test trace rule does not exclude SWR/SWU ids from @verifies"
    observed_in: h004, h005, rc1
    baseline_revision: 2a7dae9944ff056f3ebdb00687025755fb33e946
    fix_revision: 0293a4f890c5f654579ee6c3f61d26d8dcf8c584
    error_codes: ["UT:UNKNOWN_SPEC_REF", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.4/author, swtrace/check_ut]
    root_cause: "The owner trace rule for unit tests showed '@verifies USPEC-...-..' but did not say that SWR-, SWU- or IF- ids are invalid there; every IWDG HAL v2 SWE.4 author (h004, h005, rc1) first listed SWR/SWU ids, and the UT:UNKNOWN_SPEC_REF rejection cost one of the three rework cycles. In rc1 a later format slip then exhausted the budget and the work order BLOCKED at SWE.4."
    remedy: "The rule says '@verifies lists ONLY USPEC ids - never SWR-, SWU- or IF- ids (the gate rejects them as UNKNOWN_SPEC_REF)', and the finding for a non-USPEC id adds '(@verifies takes USPEC ids only)'."
  - id: RPR-071
    script: rpr071_multi_test_doc_block.py
    sha256: c1a8039d3b7b788c9d8f1f3c7552844628a1f160a09916cca43fcaefe63fa9fb
    symptom_signature: "only the first @test of a multi-test doc block is traced"
    observed_in: rc3
    baseline_revision: ffd30972dc126c5036268b77c0af2fbc1cc1b910
    fix_revision: 588c221138950c1a3dc6bb485df3510c7155da34
    error_codes: ["UT:SPEC_NOT_VERIFIED", "STUCK_IDENTICAL_REJECTION"]
    operations: [SWE.4/author, swtrace/check_ut]
    root_cause: "swtrace.tagged_tests took only the first @test and the first @verifies of each Doxygen block (re.search). The rc3 SWE.4 author documented six tests in one block above one test function - valid Doxygen - so UT-002..UT-006 and their USPEC references were silently dropped; the gate reported seven SPEC_NOT_VERIFIED findings for passing, tagged tests and the author could not resolve a finding that was not real."
    remedy: "A block with several @test tags yields one test per tag, each with the @verifies text between it and the next @test; a block with one @test (in either order with @verifies) and @file blocks keep the previous reading. On a copy of the rc3 workspace the SWE.4 findings go from 7 to 0."
  - id: RPR-072
    script: rpr072_route_extension_inspections.py
    sha256: 058612e16d997b8b0314991f3ada87f0f54235baa7453b92102f8a0891818da3
    symptom_signature: "progress extension granted for inspection cycles but the route still BLOCKS"
    observed_in: "feature 010 local trials (LRTX-TRIAL lrtx8-lrtxq2); documented in specs/010 validation and F011-T037"
    baseline_revision: 2f4b9cf44fd9cc56648fa26b6da6c2e29248338d
    fix_revision: be97ec26a9b7fcfe61d85d0380aadf450e8e6256
    error_codes: ["REWORK_BUDGET_EXHAUSTED"]
    operations: [route_sweN, inspection/gate.step_route]
    root_cause: "Store.gate already decides BLOCKED when failed inspections reach maximum_rework_cycles. step_route computed the progress extension (progress: true) after that decision and only cleared its own 'exhausted' flag, never the BLOCKED decision it had received, so a phase whose failed cycles were inspections was blocked although the owner's rule granted it one more cycle."
    remedy: "When a progress extension is granted (cycles below the authored maximum + extra, measurable progress, not STUCK) and Store.gate decided BLOCKED, the route decision becomes REWORK for that cycle, with the extension in the reason; no progress, the cap or STUCK block as before."
  - id: RPR-073
    script: rpr073_packet_identity_alias.py
    sha256: f4f3188cb5924881484da2e018ff48a5bba4e45c69dacce13c772cf4e055a656
    symptom_signature: "packet input_hash unchanged when the pinned model digest changes under the same alias"
    observed_in: "process-first design EGM review 2026-10-31 (docs/designs/forge-c-process-first-ornith-qwen.md G3; evidence/014-durable-local-autonomy/egm-pf-001); static finding, no native run"
    baseline_revision: 876d75f638af153ee5ecd3be4a638f40cf916521
    fix_revision: dc1dd0597dfccc5c56161cd5cbb4af53e809fb3c
    error_codes: []
    operations: [lrtx/structured.packet, lrtx/visit.run_task]
    root_cause: "structured.packet() hashed the packet dict, which named the model only by its alias and excluded the accounting block (context envelope). The selected local profile's pinned digest, precision, reasoning settings, probed schema mode and context length were not part of input_hash, so visit and inspector checkpoints keyed on it (base_hash) were reused after a model file, precision, reasoning or context change made under an unchanged alias."
    remedy: "packet() adds an identity block derived from the manifest's selected local profile (profile id + config sha, model digest, precision, served/gateway reasoning incl. the role's own effort, schema mode probed for that digest, context tokens) to the hashed packet, without adapter_revision (D10). It is never part of the prompt. Packets without a selected profile keep the legacy hash shape. run_task resolves the schema mode with the same digest."
  - id: RPR-074
    script: rpr074_scoped_write_foreign_workspace.py
    sha256: 43b18577fc822a5b446288c9fe63e4443e421bf13cf88585d15420f8e5df4fa5
    symptom_signature: "scoped write in a workspace copy touched development-execution state of the source workspace"
    observed_in: "standalone Ornith SWE.1 run on Omniverse2 2026-10-31 (evidence/014-durable-local-autonomy/swe1-ornith-standalone-20261031): modelcmp copy rewrote the trial-06 source workspace's .forge-run/lrtx/SWE.1/development-execution.json (identical bytes, new mtime)"
    baseline_revision: 7490b6d8a4c81377008d708fc5ac6e0e31c7039b
    fix_revision: 2f2aefa0ab06327ee89792ad5368b53a62ec083e
    error_codes: []
    operations: [lrtx/visit.write_scoped, policy/authz.Authorizer.decide, development_execution.mutation_allowed]
    root_cause: "visit.write_scoped built its Authorizer from the workspace's .forge-run/binding.json. A workspace copy (lrtx/modelcmp._fresh_copy, lrtx/seeded.evaluate, lrtx/campaign) keeps the source's binding, whose absolute workspace path makes Authorizer.decide call development_execution.mutation_allowed(<source>) -> phase_state(), which reads and rewrites the source's development-phase state while the file is written into the copy."
    remedy: "write_scoped re-roots the loaded binding at the workspace being written (same binding id and node roles/phases), so authorization and development-phase state always belong to that workspace. Scope, role and path-containment checks are unchanged."
  - id: RPR-075
    script: rpr075_inspector_repair_drops_findings.py
    sha256: 4054fe085221a8d16e7ec72f9c2ef453fa32b45e0e6895262b4f94d7af300e8b
    symptom_signature: "inspector findings dropped in repair are not kept in the task checkpoint"
    observed_in: "standalone SWE.1 run on Omniverse2 2026-10-31 (evidence/014-durable-local-autonomy/swe1-ornith-standalone-20261031, FINDINGS.md item 2, PROPOSAL-inspector-repair.md option A): Qwen SWE1-01/SWE1-03 'PASS with findings' rejected, repaired into a clean PASS"
    baseline_revision: 2d91c2fa6f7cc7f7983e98259bd4ddb20fba6733
    error_codes: []
    operations: [lrtx/visit.run_task, lrtx/review._visit]
    root_cause: "visit.run_task kept only errors, usage and input_hash of a rejected attempt. When validate_verdict rejected an inspector answer 'PASS with findings' and the localized repair returned PASS without findings, the findings the model had stated were not recorded anywhere, so a repair could turn an observed problem into a clean PASS without a trace."
    remedy: "Owner option A: run_task keeps a rejected inspector answer's findings (rejected_findings) in the checkpoint attempt; lrtx.review reports findings that the accepted answer no longer carries as withdrawn_in_repair in inspection-record.json and as LRTX_INSPECTOR_FINDING_WITHDRAWN_IN_REPAIR reply notes. Verdict and gate are unchanged."
  - id: RPR-076
    script: rpr076v2_owner_obligation_omitted.py
    sha256: ba6bd8413245a47cbe982444571c1ddfdb42acf15c41a986a0db18892ba3d094
    revision: 2
    supersedes: {script: rpr076_owner_obligation_omitted.py, sha256: 4e994cf3831b14b5daf34b54ab8a25ea202e9300ef5e2907d9f065e8bb5b6a8e, reason: "owner 2026-10-31 'Re-freeze v2 reproducers': CAPA-079 moved obligation coverage into the structured author's cross-cutting task, so v1's scripted author stopped before assembly and never reached the SWE.1 author gate it tests (REPRODUCER_ERROR); v2 bypasses only that author-side check (any author path), unchanged on code without it"}
    symptom_signature: "SWE.1 baseline that omits a declared owner obligation is frozen by the author gate"
    observed_in: "standalone SWE.1 inspector omission test on Omniverse2 2026-10-31 (evidence/014-durable-local-autonomy/swe1-inspector-omission-20261031, PROPOSAL-completeness.md options 3 and 1): the gate-frozen Ornith a02 CRC IDR baseline lacks no-polling, no-error-code and preserve-other-registers; Qwen medium, Qwen xhigh and qwen3-coder-next inspections did not name them"
    baseline_revision: 15218323b24a283e365adf590817656ae8675fbe
    error_codes: [SWE1_OBLIGATION_UNCOVERED]
    operations: [inspection/gate.step_author, lrtx/swe1.self_check, lrtx/review.evidence]
    root_cause: "No SWE.1 mechanism compared the requirements with the owner's obligations: the author gate checks structure only, no checklist item asks for completeness against the owner contract, and lrtx/review.evidence gives the inspector the baseline and manifest views but not the owner contract."
    remedy: "Global opt-in owner obligations (owner 2026-10-31: global mechanism): a work-order input with role owner_obligations (forge-c/owner-obligations/1). assurance/owner_obligations.coverage_findings requires every obligation to be implemented by a requirement ('  - Obligations:' lines, register effects checked) or recorded under '## Obligation gaps' with a reason; it runs in swe1.self_check (localized repair) and in the SWE.1 author gate (any author path). The structured author gets an obligation-aware schema and the obligations source; SWE.1 inspectors get the obligations and the inputs they cite. Orders without the input are unchanged."
  - id: RPR-077
    script: rpr077v2_critical_obligation_gap.py
    sha256: c2d0367cf5e6f91d0bfc05e2df60fb8771652cb9899964d6ddf2e7b131db9c28
    revision: 2
    supersedes: {script: rpr077_critical_obligation_gap.py, sha256: 55889ebdc4ba4eb87170811bec7dc4899b4e434a37b7543f099a07334ad20312, reason: "owner 2026-10-31 'Re-freeze v2 reproducers': CAPA-079 moved obligation coverage into the structured author's cross-cutting task, so v1's scripted author stopped before assembly and never reached the SWE.1 author gate it tests (REPRODUCER_ERROR); v2 bypasses only that author-side check (any author path), unchanged on code without it"}
    symptom_signature: "SWE.1 baseline that records a critical owner obligation as a gap is frozen by the author gate"
    observed_in: "Fabro SWE.1 run WO-F014-SWE1-OBL-20261031-02 (01M69RYT6NP8Y8ZXB3MB173SDP) on Omniverse2 2026-10-31: Qwen3.8 medium recorded the critical OBL-preserve-other-registers as an obligation gap ('covered by the register-level task'); no requirement implements it; author gate FROZEN, inspection PASS 6/6"
    baseline_revision: 06914b8b84da095b1bd2f10c929e67cbd9460962
    error_codes: [SWE1_OBLIGATION_CRITICAL_GAP]
    operations: [assurance/owner_obligations.coverage_findings, inspection/gate.step_author, lrtx/swe1.group_schema]
    root_cause: "An obligation gap needed only a reason of at least 10 characters, whatever the obligation's criticality, so an author could close a critical obligation with an unverified justification; the deterministic check cannot judge the reason and the inspector accepted it."
    remedy: "Owner 2026-10-31: critical obligations can never be gaps. coverage_findings reports SWE1_OBLIGATION_CRITICAL_GAP (self-check routed repair and the SWE.1 author gate); the structured cross-cutting schema offers only non-critical ids in obligation_gaps and its instructions name the critical ids."
  - id: RPR-078
    script: rpr078_obligation_requirement_removed.py
    sha256: a2172408fe754d11c440cb72e9f81847fb30845cb5c5390eb9a24c72b23a3e79
    symptom_signature: "SWE.1 author told to remove a requirement that implements a declared owner obligation"
    observed_in: "Fabro SWE.1 run WO-F014-SWE1-OBL-20261031-03 (01M69V139JKG14HMVVTT8GWNAH) on Omniverse2 2026-10-31: critical OBL-preserve-other-registers uncovered; cross-cutting task used its one development repair pass on validator findings, the coverage repair call was refused (DEVELOPMENT_PHASE_REPAIR_EXHAUSTED); author gate REJECTED, SWE.1 BLOCKED"
    baseline_revision: b4b84933f8f8a130407edd20d98eac863a1537a8
    error_codes: [SWE1_OBLIGATION_UNCOVERED, DEVELOPMENT_PHASE_REPAIR_EXHAUSTED]
    operations: [lrtx/swe1.validate_group, lrtx/swe1._visit, lrtx/visit.run_task]
    root_cause: "The cross-cutting validator refuses a requirement that names a register-task register with 'remove requirement [k] from the cross-cutting task'. A preservation obligation's natural requirement names that register, so the instruction contradicted the obligation; and obligation coverage was checked only after assembly, so its repair needed a second repair pass that the development policy does not grant. The earlier attempts' errors were overwritten in the checkpoint."
    remedy: "A cross-cutting requirement that cites an owner obligation is told to restate the rule for all scoped functions without naming the register (the no-register-requirement rule is unchanged); the cross-cutting task's own check reports uncovered obligations without register effects, so they share the task's repair pass; task checkpoints keep earlier repair rounds' attempts (history, last 12)."
