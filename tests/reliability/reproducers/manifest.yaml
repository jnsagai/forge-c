    missing, no Codex/Claude/Renode 1.17/PlantUML) into every package as configuration/toolchain_versions.json, and known_limitations listed every
    registry-DISABLED operation even when the run had executed it (Renode). The signed tool assurance assessment recorded this as TAA-FND-04.'
  remedy: finalize.tool_records builds the record from evidence/tool-results.jsonl (each tool with the version its MCP result recorded, the calling
    operations, call counts and times) and .forge-run/model-profile.json (Codex authors, Claude inspectors, the run model and its status); known_limitations
    names only DISABLED operations not used by this run. The PlantUML entry states that the jar version is not recorded.
- id: RPR-069
  script: rpr069_setclear_read_returns_target.py
  sha256: 26ace75715b2a7e3c29c88aa369d16fb28e043fd55563bacdc52c42077381ced
  symptom_signature: a read of a write-only set/clear register returns its target register
  observed_in: rc1 (WO-0008A-STM32N6-RCC-LL-rc1)
  baseline_revision: 7ec4af1a8e5523da7c08a217f551bd05a5a14766
  fix_revision: 0e31a13ed44d9f6191dda022e30cbbf3bfba41cf
  error_codes:
  - unresolved_finding:escalated_defect:FACTORY
  operations:
  - sim/rcc_model
  - SWE.6/run_robot
  root_cause: The 8 KB RCC model added for the ST pilot (feature 008 follow-up) returned the target register on a read of a set/clear register,
    an assumption marked NOT_VERIFIED. RM0486 marks those fields write-only ('w', e.g. RCC_CSR p.647), so they read 0; with the old behaviour,
    a factory-style SWE.6 full-register preservation check saw RCC_CSR change whenever RCC_CR was written, and the author escalated DEF-003 (FACTORY)
    - the regression campaign rc1 package for 0008a stayed BLOCKED.
  remedy: A read of a set/clear register returns 0 (write-only per RM0486); writes still set/clear their target register. The NOT_VERIFIED assumption
    is replaced by the RM access type.
- id: RPR-070
  script: rpr070_verifies_rule_not_explicit.py
  sha256: 1b7d34cd9cbc37f7fa4cf2b72954be696f47845b2f2cb9d50119f102fc7960bb
  symptom_signature: the unit-test trace rule does not exclude SWR/SWU ids from @verifies
  observed_in: h004, h005, rc1
  baseline_revision: 2a7dae9944ff056f3ebdb00687025755fb33e946
  fix_revision: 0293a4f890c5f654579ee6c3f61d26d8dcf8c584
  error_codes:
  - UT:UNKNOWN_SPEC_REF
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.4/author
  - swtrace/check_ut
  root_cause: The owner trace rule for unit tests showed '@verifies USPEC-...-..' but did not say that SWR-, SWU- or IF- ids are invalid there;
    every IWDG HAL v2 SWE.4 author (h004, h005, rc1) first listed SWR/SWU ids, and the UT:UNKNOWN_SPEC_REF rejection cost one of the three rework
    cycles. In rc1 a later format slip then exhausted the budget and the work order BLOCKED at SWE.4.
  remedy: The rule says '@verifies lists ONLY USPEC ids - never SWR-, SWU- or IF- ids (the gate rejects them as UNKNOWN_SPEC_REF)', and the finding
    for a non-USPEC id adds '(@verifies takes USPEC ids only)'.
- id: RPR-071
  script: rpr071_multi_test_doc_block.py
  sha256: c1a8039d3b7b788c9d8f1f3c7552844628a1f160a09916cca43fcaefe63fa9fb
  symptom_signature: only the first @test of a multi-test doc block is traced
  observed_in: rc3
  baseline_revision: ffd30972dc126c5036268b77c0af2fbc1cc1b910
  fix_revision: 588c221138950c1a3dc6bb485df3510c7155da34
  error_codes:
  - UT:SPEC_NOT_VERIFIED
  - STUCK_IDENTICAL_REJECTION
  operations:
  - SWE.4/author
  - swtrace/check_ut
  root_cause: swtrace.tagged_tests took only the first @test and the first @verifies of each Doxygen block (re.search). The rc3 SWE.4 author documented
    six tests in one block above one test function - valid Doxygen - so UT-002..UT-006 and their USPEC references were silently dropped; the gate
    reported seven SPEC_NOT_VERIFIED findings for passing, tagged tests and the author could not resolve a finding that was not real.
  remedy: A block with several @test tags yields one test per tag, each with the @verifies text between it and the next @test; a block with one
    @test (in either order with @verifies) and @file blocks keep the previous reading. On a copy of the rc3 workspace the SWE.4 findings go from
    7 to 0.
- id: RPR-072
  script: rpr072_route_extension_inspections.py
  sha256: 058612e16d997b8b0314991f3ada87f0f54235baa7453b92102f8a0891818da3
  symptom_signature: progress extension granted for inspection cycles but the route still BLOCKS
  observed_in: feature 010 local trials (LRTX-TRIAL lrtx8-lrtxq2); documented in specs/010 validation and F011-T037
  baseline_revision: 2f4b9cf44fd9cc56648fa26b6da6c2e29248338d
  fix_revision: be97ec26a9b7fcfe61d85d0380aadf450e8e6256
  error_codes:
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - route_sweN
  - inspection/gate.step_route
  root_cause: 'Store.gate already decides BLOCKED when failed inspections reach maximum_rework_cycles. step_route computed the progress extension
    (progress: true) after that decision and only cleared its own ''exhausted'' flag, never the BLOCKED decision it had received, so a phase whose
    failed cycles were inspections was blocked although the owner''s rule granted it one more cycle.'
  remedy: When a progress extension is granted (cycles below the authored maximum + extra, measurable progress, not STUCK) and Store.gate decided
    BLOCKED, the route decision becomes REWORK for that cycle, with the extension in the reason; no progress, the cap or STUCK block as before.
- id: RPR-073
  script: rpr073_packet_identity_alias.py
  sha256: f4f3188cb5924881484da2e018ff48a5bba4e45c69dacce13c772cf4e055a656
  symptom_signature: packet input_hash unchanged when the pinned model digest changes under the same alias
  observed_in: process-first design EGM review 2026-10-31 (docs/designs/forge-c-process-first-ornith-qwen.md G3; evidence/014-durable-local-autonomy/egm-pf-001);
    static finding, no native run
  baseline_revision: 876d75f638af153ee5ecd3be4a638f40cf916521
  fix_revision: dc1dd0597dfccc5c56161cd5cbb4af53e809fb3c
  error_codes: []
  operations:
  - lrtx/structured.packet
  - lrtx/visit.run_task
  root_cause: structured.packet() hashed the packet dict, which named the model only by its alias and excluded the accounting block (context envelope).
    The selected local profile's pinned digest, precision, reasoning settings, probed schema mode and context length were not part of input_hash,
    so visit and inspector checkpoints keyed on it (base_hash) were reused after a model file, precision, reasoning or context change made under
    an unchanged alias.
  remedy: packet() adds an identity block derived from the manifest's selected local profile (profile id + config sha, model digest, precision,
    served/gateway reasoning incl. the role's own effort, schema mode probed for that digest, context tokens) to the hashed packet, without adapter_revision
    (D10). It is never part of the prompt. Packets without a selected profile keep the legacy hash shape. run_task resolves the schema mode with
    the same digest.
- id: RPR-074
  script: rpr074_scoped_write_foreign_workspace.py
  sha256: 43b18577fc822a5b446288c9fe63e4443e421bf13cf88585d15420f8e5df4fa5
  symptom_signature: scoped write in a workspace copy touched development-execution state of the source workspace
  observed_in: 'standalone Ornith SWE.1 run on Omniverse2 2026-10-31 (evidence/014-durable-local-autonomy/swe1-ornith-standalone-20261031): modelcmp
    copy rewrote the trial-06 source workspace''s .forge-run/lrtx/SWE.1/development-execution.json (identical bytes, new mtime)'
  baseline_revision: 7490b6d8a4c81377008d708fc5ac6e0e31c7039b
  fix_revision: 2f2aefa0ab06327ee89792ad5368b53a62ec083e
  error_codes: []
  operations:
  - lrtx/visit.write_scoped
  - policy/authz.Authorizer.decide
  - development_execution.mutation_allowed
  root_cause: visit.write_scoped built its Authorizer from the workspace's .forge-run/binding.json. A workspace copy (lrtx/modelcmp._fresh_copy,
    lrtx/seeded.evaluate, lrtx/campaign) keeps the source's binding, whose absolute workspace path makes Authorizer.decide call development_execution.mutation_allowed(<source>)
    -> phase_state(), which reads and rewrites the source's development-phase state while the file is written into the copy.
  remedy: write_scoped re-roots the loaded binding at the workspace being written (same binding id and node roles/phases), so authorization and
    development-phase state always belong to that workspace. Scope, role and path-containment checks are unchanged.
- id: RPR-075
  script: rpr075_inspector_repair_drops_findings.py
  sha256: 4054fe085221a8d16e7ec72f9c2ef453fa32b45e0e6895262b4f94d7af300e8b
  symptom_signature: inspector findings dropped in repair are not kept in the task checkpoint
  observed_in: 'standalone SWE.1 run on Omniverse2 2026-10-31 (evidence/014-durable-local-autonomy/swe1-ornith-standalone-20261031, FINDINGS.md
    item 2, PROPOSAL-inspector-repair.md option A): Qwen SWE1-01/SWE1-03 ''PASS with findings'' rejected, repaired into a clean PASS'
  baseline_revision: 2d91c2fa6f7cc7f7983e98259bd4ddb20fba6733
  error_codes: []
  operations:
  - lrtx/visit.run_task
  - lrtx/review._visit
  root_cause: visit.run_task kept only errors, usage and input_hash of a rejected attempt. When validate_verdict rejected an inspector answer
    'PASS with findings' and the localized repair returned PASS without findings, the findings the model had stated were not recorded anywhere,
