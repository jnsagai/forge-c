    the SWE.6 hint drops never_ready; LL prompts and waiting HALs are byte-identical. boundary_rule(ws) keeps the RCC pattern and adds, for a
    time-base HAL, its HAL_<PFX>_*TIMEOUT* constant as a call argument or + 1U, and for a no-wait HAL a count of 0 or the maximum / first-above
