  root_cause: 'The HAL author prompts take the LL calls from the peripheral profile''s HAL texts (config/factory/peripherals/crc.yaml:144 hal_example:
    LL_CRC_FeedData32(p_data[i]) ...), written for the greenfield register-array LL; workflow/prompts.py HAL_ON_PROVIDED_LL (line 621) only says
    to use the provided functions. ST''s provided LL takes the CMSIS instance first (LL_CRC_FeedData32(CRC_TypeDef *CRCx, uint32_t InData)); nothing
    told the HAL author to pass CRC.'
  remedy: 'brownfield/cmsis.provided_api derives the instance API from the provided header (functions whose first parameter is <P>_TypeDef *,
