  - SWE.4/route
  root_cause: 'validate_trace checked that traced test ids exist but not that the test exercises the API SWE.2 allocated to the requirement; SWE4-02
    (most frequent block in the SLO batch: r86, r92, r93) was left to the inspector.'
  remedy: validate_trace fails TEST_DOES_NOT_CALL_ALLOCATED_API when the test function holding a traced id never calls the requirement's allocated
    API.
