    constrain the whole SWC; the r113 author invented 'resource units' around a probe function written into the generated LL compile unit and
    SWE.3 stopped STUCK.
  remedy: Resource budgets are classified as component-level constraints (matrix 2 COMPONENT_LEVEL, verified by measurement); a modified generated
    compile unit is a finding; unit function lists are read as identifiers only.
- id: RPR-034
  script: rpr034_unknown_system_name_no_hint.py
  sha256: b8b4920c85c8f155198327ea16580e30e12148fd33bbecb4e9a41f3577f4c713
