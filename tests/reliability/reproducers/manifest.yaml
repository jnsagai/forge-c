  remedy: 'Owner option A: run_task keeps a rejected inspector answer''s findings (rejected_findings) in the checkpoint attempt; lrtx.review reports
    findings that the accepted answer no longer carries as withdrawn_in_repair in inspection-record.json and as LRTX_INSPECTOR_FINDING_WITHDRAWN_IN_REPAIR
    reply notes. Verdict and gate are unchanged.'
