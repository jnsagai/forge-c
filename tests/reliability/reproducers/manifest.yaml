  - id: RPR-029
    script: rpr029_matrix_in_swe1_baseline.py
    sha256: b1faa0e1d3ce0a68434569f57465250edbeb2d4c126bf8bf76a9165bb750268c
    symptom_signature: "trace matrix written into the frozen SWE.1 baseline"
    observed_in: r109
    baseline_revision: a7d20adc5e218baeb27bdf01b71b8f7b4fba6ad6
    fix_revision: 72f1d51f29740dc3c5881e23af4aed31df5c1b65
    error_codes: ["UPSTREAM_NOT_FROZEN:SWE.1", "FREEZE_FAILED"]
    operations: [SWE.2/author]
    root_cause: "The owner-trace gate wrote traceability matrix 1 into traceability/, which PHASE_PATHS assigns to the frozen SWE.1 baseline; SWE.1 became stale and every SWE.2 freeze failed with UPSTREAM_NOT_FROZEN:SWE.1 (r109 BLOCKED at SWE.2)."
    remedy: "Each matrix is written into workproducts/SWE.n/traceability of the phase that produces it; the packager collects all six under traceability/matrices/."
  - id: RPR-030
    script: rpr030_swe3_trace_work_by_hand.py
    sha256: efdfe2af0727f0fd8ea704567f83c3441090f6a1c9b03a958b9f3c995edbc955
    symptom_signature: "trace-profile SWE.3 chain has no deterministic unit scaffold"
    observed_in: r110
    baseline_revision: 9c25965034ed776ee7a00e8f9ce19fd4520aeb53
    fix_revision: 9e8b6253ef40d962abc3c1b626ba23da5c707b0f
    error_codes: ["TURN_BUDGET_EXHAUSTED", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/author]
    root_cause: "With the owner trace profile the SWE.3 design author wrote unit specifications, a PlantUML design per unit and the MISRA statement by hand; in the third rework cycle it exceeded its tool budget (46 > 45) and SWE.3 was BLOCKED (r110)."
    remedy: "A deterministic scaffold node (swe3_units) generates the unit-spec skeleton and as-built designs from the code tags; the author only replaces placeholder markers, which the gate rejects if left."
  - id: RPR-031
    script: rpr031_no_misra_deviation_record.py
    sha256: 9c1c7501a6631077e23de697d574e8d00e236d4f5ee8a88f2fac64ae57ef49ac
    symptom_signature: "no generated MISRA deviation statement"
    observed_in: r110
    baseline_revision: 9c25965034ed776ee7a00e8f9ce19fd4520aeb53
    fix_revision: 9e8b6253ef40d962abc3c1b626ba23da5c707b0f
    error_codes: ["INSPECTION_FAIL:SWE3-04"]
    operations: [SWE.3/author]
    root_cause: "The SWE.3 inspector failed SWE3-04 because no explicit MISRA C:2012 deviation record existed although cppcheck reported no finding (r110 INS-SWE.3-001)."
    remedy: "The scaffold writes workproducts/SWE.3/misra_deviations.md from the recorded cppcheck result, code suppressions and approved records (none -> 'Deviations: none'), compliance NOT CLAIMED."
  - id: RPR-032
    script: rpr032_swe3_trace_gate_overstrict.py
    sha256: 97d680979b175f2c7a3437b97d770b99dc56387b121b20e9881cb76436363646
    symptom_signature: "SWE.3 trace gate rejects complete work (citation / Doxygen config)"
    observed_in: r111
    baseline_revision: f4a303342824c90aec2e7c2c12632c159be020f9
    fix_revision: bd666fbb9fc65845aa7c97fd741e28b48fce2a23
    error_codes: ["UNIT:DESIGN_MISSING_SPEC_REF", "CODE:DOXYGEN_WARNING", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/author]
    root_cause: "The owner-trace SWE.3 gate demanded USPEC citations inside every design (stricter than the owner requirement) and ran Doxygen with preprocessing off, which warns on documented register defines; r111 completed specs, designs and tags but was rejected three times and BLOCKED."
    remedy: "The gate generates each design's citation (legend) from unit_specifications.md; Doxygen runs with preprocessing, accepts @trace, and does not count the generated, RM-verified register defines as documentation gaps."
  - id: RPR-033
    script: rpr033_budget_swr_forced_into_units.py
    sha256: 15465dd28bdd507bcdaabf227ef796d0b3d4ce6166216d1d21ac442f59f6eb63
    symptom_signature: "budget SWR reported NOT_REFINED"
    observed_in: r113
    baseline_revision: 8901e3820cb65359c2891009523891f5817e83e4
    fix_revision: 309848ccfda805b23fb929eb3d4f3411f748515a
    error_codes: ["UNIT:SWR_NOT_REFINED", "CODE:SPEC_NOT_IMPLEMENTED", "STUCK"]
    operations: [SWE.3/author]
    root_cause: "The owner-trace SWE.3 gate required every allocated SWR to be refined by a unit-spec item, including flash/RAM/stack budgets that constrain the whole SWC; the r113 author invented 'resource units' around a probe function written into the generated LL compile unit and SWE.3 stopped STUCK."
    remedy: "Resource budgets are classified as component-level constraints (matrix 2 COMPONENT_LEVEL, verified by measurement); a modified generated compile unit is a finding; unit function lists are read as identifiers only."
  - id: RPR-034
    script: rpr034_unknown_system_name_no_hint.py
    sha256: b8b4920c85c8f155198327ea16580e30e12148fd33bbecb4e9a41f3577f4c713
    symptom_signature: "unknown EARS system name without an actionable major hint"
    observed_in: r112, r114
    baseline_revision: 6896be1881fa2fa11e4a5ef0363eea416b1652b8
    fix_revision: 99f0fb2bfc471432b7697c6f57c95b007fa283e1
    error_codes: ["INSPECTION_FAIL:SWE1-07", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.1/author, SWE.1/inspect]
    root_cause: "The deterministic EARS check reported only EARS_UNKNOWN_SYSTEM_NAME for a subject with qualifiers ('The RCC LL driver compiled for the Cortex-M55 target shall ...'); the SWE.1 author could not see what was wrong and repeated it for three cycles (r112 SWR-024, r114 SWR-020)."
    remedy: "A major EARS_SYSTEM_NAME_HINT finding names the parsed subject, lists the allowed system names and says to move qualifiers into the condition clause; the original issue code is unchanged."
  - id: RPR-035
    script: rpr035_trace_feedback_not_actionable.py
    sha256: b6c7c84b92db95e65d73aea9ee60abdd6eca64f2dd681846942cbcd238b9c274
    symptom_signature: "SWE.3 trace feedback not actionable"
    observed_in: r115
    baseline_revision: d2aa1f4398b426e0cbeffeff2f4b8a76108b9a5c
    fix_revision: e7752c412235cbcbc4af3ad00fe7470bf39bb319
    error_codes: ["UNIT:DESIGN_RENDER_FAILED", "CODE:SPEC_NOT_IMPLEMENTED", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/author]
    root_cause: "SWE.3 trace rejections gave no actionable detail: every design failed with PlantUML's bare 'No diagram found' and CODE:SPEC_NOT_IMPLEMENTED named only the spec id; r115 spent its three SWE.3 cycles and was BLOCKED."
    remedy: "SPEC_NOT_IMPLEMENTED names the unit and the functions whose @spec line should carry the item; DESIGN_RENDER_FAILED includes the PlantUML -syntax result and a start/end hint."
  - id: RPR-036
    script: rpr036_initial_state_swr_forced_into_units.py
    sha256: 0deb0f1a7e39dddbe8946dbfe509231c56d84a7a31ca08ecf837345a16691e23
    symptom_signature: "initial-state invariant reported NOT_REFINED"
    observed_in: r116
    baseline_revision: 4c658080a84b98e5e3f7d038ddc8d7de47c8e3d5
    fix_revision: cd66e3483b52dfe90958d33db2053c58b23eefd2
    error_codes: ["UNIT:SWR_NOT_REFINED", "STUCK"]
    operations: [SWE.3/author]
    root_cause: "The SWE.3 trace gate required unit refinement of an initial-state invariant of the whole SWC (no register write before any call after reset); the r116 author could not map it to a unit and SWE.3 stopped STUCK."
    remedy: "Initial-state invariants are classified as component-level (like resource budgets); SWR_NOT_REFINED states what to add for ordinary SWRs."
  - id: RPR-037
    script: rpr037_sub_check_ids_with_underscore_not_run.py
    sha256: 42e5931fd2206eabd3e4755ec79051eda55e465e40556162867f9ef803ff01dc
    symptom_signature: "passed sub-checks with '_' reported NOT_RUN"
    observed_in: r117
    baseline_revision: 488010608118f1d4c3ed6a136fe8dd333ff90208
    fix_revision: cef7e4757d47855d75a6acb055097e096b6d87a6
    error_codes: ["SWE5-05", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.5/inspect]
    root_cause: "swtrace.check_results accepted only [A-Za-z0-9-] after the test id; r117's integration checks were named IT-005-ADC12_EN etc., so IT-005/IT-006 were absent from the parsed results, Matrix 5 showed them NOT_RUN/UNVERIFIED, and the inspector rejected the contradiction with the PASS host run three times."
    remedy: "Sub-check ids may contain '_' (\\w); a failing sub-check still fails its test."
