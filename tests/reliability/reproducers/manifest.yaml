    fix_revision: 68df55037fb4ebf58cd63b705b550b81b778f182
    error_codes: ["INSPECTION_FAIL:SWE3-01", "DEFECT:ARCHITECTURE"]
    operations: [SWE.3/inspect, SWE.2/author]
    root_cause: "The LL API naming text listed MSI, LSI, LSE and PLL1..4 although the work order covers HSI and HSE, and no check compared the Interfaces section with the allocation table; SWE.3 inspection found interfaces that were never allocated or coded."
