- id: RPR-039
  script: rpr039_trace_codes_unclassified.py
  sha256: 8006071c185e43bca53e4fa8552d48787f99753d8908e7b39ea2b7a3291ea45e
  symptom_signature: trace-gate rejection classified UNCLASSIFIED
  observed_in: r120
