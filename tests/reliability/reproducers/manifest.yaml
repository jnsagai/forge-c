- id: RPR-062
  script: rpr062_trace_map_shared_function.py
  sha256: 38337242a09b2e0b30da6fb040e4f56180ae52a9d7b942120f84c469c4171b63
  symptom_signature: a delivered function shared by two units cannot be traced
  observed_in: b006
  baseline_revision: 1d478607670a53dd69eb7b88a75a8db39e81b66f
  fix_revision: 7eb6b34c5bc6840103b72e40c72c517bd19c199a
  error_codes:
  - CODE:SPEC_OF_OTHER_UNIT
  - CODE:TRACE_MAP_DUPLICATE_FUNCTION
  operations:
  - SWE.3/author
  - brownfield/trace
  root_cause: brownfield.trace.check_code took one owning unit per delivered function, while the unit design of a vendor delivery can legitimately
    share a function between units (ST's LL_AHB1_GRP1_* serve both the GPDMA1 and the ADC12 unit); the SWE.3 author could satisfy neither the
    uniqueness rule nor the unit rule and escalated DEF-003 (FACTORY), after two rework cycles.
  remedy: A trace-map row's unit may be a list of owning units; each USPEC must belong to one of them, and each listed unit must name the function.
    The SWE.3 brownfield prompt describes the list form.
- id: RPR-063
  script: rpr063_startup_invariant_on_host_test.py
  sha256: 0188c16bff8e5ca6a23dbfe88fc1e6f3f4a5f12da0af07cc944bd4b36ba15fd1
  symptom_signature: SWE.1 gate accepts a startup invariant mapped to a host unit test
  observed_in: b006
  baseline_revision: c5bfd310ea92416babafbd85c6336133535b23a6
  fix_revision: 3456ba7ed8cb23af8b4c8680c43ee28998d405fe
  error_codes:
  - SWE4-02
  - SWE4-06
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.1/author
  - SWE.4/author
  - SWE.4/inspect
  root_cause: 'The SWE.1 mapping rule sent only flash/RAM/stack/target-only requirements to the Robot suite; a reset/startup invariant (b006 SWR-018:
    ''While no LL function has been called after reset, the RCC LL driver shall not write any RCC register'') was mapped to host unit test UT-018,
    which can only check its own freshly reset RAM struct. The SWE.4 inspector rightly failed it as tautological (SWE4-02) and its traces (SWE4-06);
    the authors could not make a host test observe pre-main state, and SWE.4 BLOCKED.'
  remedy: The SWE.1 author gate reports SWE1:STARTUP_INVARIANT_ON_HOST_TEST for a 'While ... after reset' requirement mapped under software/tests/unit/,
    naming the Robot mapping; the SWE.1 prompt includes reset/startup requirements in the Robot rule.
- id: RPR-064
  script: rpr064_delivery_coverage_whole_files.py
  sha256: 91615ea86934f34d5c693dd89449c1441f6736ca0f3b7337d397715e21987bca
  symptom_signature: delivery coverage reported only over whole delivered files
  observed_in: b006
  baseline_revision: cb132162a9f2c44768af984d0b3e241bc6241884
  fix_revision: 645c071922688e1dc781cb8f7d6d6ba80bac8722
  error_codes:
  - COVERAGE_NOT_SCOPED
  operations:
  - tests/llvm_coverage
  - SWE.4/inspect
  root_cause: forge-tests-mcp llvm_coverage summarised every line of the source files it was given; for a delivery those are whole vendor headers
    (ST stm32n6xx_ll_rcc.h/ll_bus.h, about 28k lines), so the figure (line 1.21% in b006) said nothing about the 11 scope functions the unit tests
    target, and the SWE.4 inspector had no scope coverage to judge.
  remedy: For a delivery with a scope, llvm_coverage adds scope_function_pct, scope_region_pct, scope_branch_pct and the unexecuted scope functions
    from the per-function export, and leads its summary with them; the whole-file figures stay in the metrics. Greenfield coverage is unchanged.
- id: RPR-065
  script: rpr065_robot_measures_no_delivered_code.py
  sha256: 93984cfb90ebb0b9858d5ab5302d715340182045da0f66ca475b8ccdc2df0d00
  symptom_signature: Robot driver measurement builds nothing for a header-only delivery
  observed_in: b007
  baseline_revision: 1c63cb5631d9992d6088e318e689501bb5c8d44b
  fix_revision: 593a013c94034d3ebd5dc103a818604fc15078fd
  error_codes:
  - REQUIRED_TOOL_NOT_PASS:run_robot:FAIL
  - VT:SWR_NOT_VERIFIED
  operations:
  - robot/ForgeTarget
  - SWE.6/run_robot
  root_cause: ForgeTarget._objects built only software/hal/*.c and the factory LL measurement unit (static inline LL_<PPP>_ functions of the profile
    header); ST's header-only LL (__STATIC_INLINE, vendor includes) produced no unit, so the stack keyword found no call graph (b007 SWR-021 FAIL,
    DEF-004/005 FACTORY) and the flash and RAM keywords summed zero objects and passed their budgets with 0 B.
  remedy: Without HAL sources or an LL unit, ForgeTarget builds the delivery's generated scope unit (brownfield.cmsis.delivered_unit) with the
    vendor target flags; with nothing to build it raises instead of measuring 0 B. ST b007 measures 172 B flash, 0 B RAM, 8 B stack. The delivered-unit
    signature regex is line-anchored (a '#define __STATIC_INLINE static inline' line no longer matches).
- id: RPR-066
  script: rpr066_header_only_delivery_no_c_source.py
  sha256: 9c41d0a71037a3ff9cac6363c767c4f97464c74b1c80f2c4355acd4bd79d977b
  symptom_signature: header-only delivery leaves the package C-source view empty
  observed_in: b008
  baseline_revision: 0feeb644ee6108ca73eb8c15c22a2360656f2922
  fix_revision: f896363abe02effc3be2d95a6313234698491f7e
  error_codes:
  - missing_required_pattern:software/src/*.c
  - missing_or_empty_section:software/src
  operations:
  - release/finalize
  root_cause: The release policy (factory/release-manager, protected) requires a C-source view software/src/*.c; finalize filled it from software/hal
    and software/src only. A greenfield LL ships its generated compile unit there, but a header-only delivery (ST LL, __STATIC_INLINE) has none,
    so b008 - complete through SWE.6 - was BLOCKED on two packaging gaps.
  remedy: 'finalize.stage_delivered_unit stages the factory-generated build-only unit (brownfield.cmsis.delivered_unit: delivered headers + scope
    wrappers, no driver logic) as software/src/forge_delivered_unit.c, marked as generated and not delivered code, when the stage has no C source.
    The protected release policy is unchanged. Re-finalizing a copy of b008 leaves only the 5 delivered-code guideline findings (owner dispositions).'
- id: RPR-067
  script: rpr067_stack_external_time_base.py
  sha256: 13f27e072615b6fddb4d54e4d7bad0d61037cd52224e02e112ed2d1d030e854c
  symptom_signature: driver stack unbounded by the HAL's external time base
  observed_in: h004
  baseline_revision: fb5b63026e00978a61ae57f32418305c192b5489
  fix_revision: 015bc9d3ed7c99717f0bef033b0f4757ca4ae5c3
  error_codes:
  - REQUIRED_TOOL_NOT_PASS:run_robot:FAIL
  - VT:SWR_NOT_VERIFIED
  operations:
  - robot/ForgeTarget
  - SWE.6/run_robot
  root_cause: The IWDG HAL v2 (FND-07) bounds its wait with the external system time base HAL_GetTick (provided by the system and the tests).
    ForgeTarget._stack treats any call to a function outside the measured driver as an unknown bound, so the stack requirement SWR-012 could not
    be verified (DEF-003 FACTORY).
  remedy: For a profile with hal.time_base, the stack measurement adds a reference leaf implementation of the time base (a free-running counter,
    as in the tests) to the call graph and logs the assumption that the system's time base is a leaf of no larger frame; flash/RAM measurements
    do not include it.
