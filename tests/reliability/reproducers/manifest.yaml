- id: RPR-164
  script: rpr164_cloud_upstream_findings_dropped.py
  sha256: 4441f246f2db7df637a2c4391492fa347b0b7ca8ecb6e360b42b44d555a46b0f
  symptom_signature: cloud upstream route drops the failed inspection and owning defect
    context
  observed_in: Independent CloudPlacer pre-admission boundary CONTROL with explicit
    host/admission fixtures; real TEST-signed placement/native transport separately
    tested; actual WWDG4G applicability privately verified using normal resume and
    real native status.
  baseline_revision: 0965d474aff8e1fbb4ea683d0b4f934bd74462fe
  error_codes:
  - CLOUD_UPSTREAM_FINDINGS_MISSING
  operations:
  - cloud-line.recover_workorder
  root_cause: Only RETRY attaches bound failed findings; normal UPSTREAM placement
    drops them and original four-field same-phase binding cannot represent source
    stop4/current failed3/owning2.
  remedy: Attach bounded six-field upstream reference; seal current owning defect
    and complete failed independent reviews/current baseline, bind exact source terminal
    identity and fresh leading prefix, route to owning phase without importing verdict
    or defect state. Consumer capability preflight precedes native dispatch.
- id: RPR-165
  script: rpr165_completed_upstream_product_routed_as_infra.py
  sha256: b9d113c33df45c322b83934c212c70bc93299ed844a3bd7cce779c2294d813e9
  symptom_signature: completed native upstream product finding routed as infrastructure
  observed_in: 2026-11-04 retained cloud WWDG SWE4 T1G native SUCCEEDED/completed
    ends internal SWE3 with current independent INS-SWE.3-002 FAIL, intact baseline,
    Store.gate SWE3 REWORK and normal OPEN ARCH DEF005 targeting SWE2. Actual 0965
    M1 classifies INFRA/RUN_NOT_COMPLETED and CloudPlacer refuses an infrastructure
    sweep. Readonly candidate contrast restores PRODUCT/upstream SWE2; no native or
    product mutation.
  baseline_revision: 7ad0f763ca0bedc81651f1d5b8dc91a52200b974
  error_codes:
  - COMPLETED_UPSTREAM_PRODUCT_MISCLASSIFIED
  operations:
  - afo.line_conductor.classify_order
  - afo.line_conductor.Observer._core
  - afo.line_orders.Records.attempt
  root_cause: The generic finished-run bundle is synthesized as infrastructure when
    a bounded internal upstream loop ends before its stop phase without a final BLOCKED
    gate. M1 reads owning product defects only for PRODUCT_QUALITY; packaged records
    also skip native liveness and manufacture a completed default.
  remedy: For only synthetic RUN_NOT_COMPLETED, independently prove a current failed
    author/inspector-bound inspection, its exact intact baseline/current gate and
    normal typed open owning defect route; then require actual exact native run/workspace
    SUCCEEDED:completed before projecting PRODUCT/upstream. Keep other causes, unknown/failed/security/native
    errors and historical counters unchanged; bind recurring issue fingerprints to
    the sorted requirement identities.
- id: RPR-166
  script: rpr166_reviewed_provided_code_rejected.py
  sha256: 8bf5ea18c3ca918ee16d0aa26a51da2b08e268fe9d6bd963bdca05171ec93a00
  symptom_signature: reviewed provided CODE correction is refused as an unauthorized
    input change
  observed_in: Independent normal PC/CODE/SWE1-3 CONTROL; existing owner20261103 workspace-only
    correction with preserved pristine/original SHA and independent approval
  baseline_revision: 297f8ebd8f130b31536f77790f5fa99808c8f3e4
  error_codes:
  - PROVIDED_LL_UNIT_INPUT_CHANGED
  - TARGET_TIMING_APPROVED_INPUT_CHANGED
  operations:
  - forge-tests-mcp.run_unit
  - workorder.resume_from
  root_cause: Verification selectors equate effective workspace LL bytes to original
    approval SHA and discard normal CODE/diff/independent approval context, despite
    existing owner-authorized workspace-only correction protocol. Resume and restored-test
    verification lose that context.
  remedy: Pure effective identity validates original/pristine plus normal independentSWE1-3/CODE/diff
    history, imports only attested corrected bytes/provenance and binds actual restored-test
    receipts; vendor/unlinked/stale inputs stay refused and original approvals are
    never repinned.
- id: RPR-167
  script: rpr167_early_provided_code_owner_unreachable.py
  sha256: aa807decfd404d2948157fc191f407268df2312c0538d0a9a63e88b52e0542f3
  symptom_signature: normal early provided LL CODE is refused or routed as a forward
    upstream loop
  observed_in: '2026-11-04 actual cloud WWDG SWE2 T1H PC.enabled/uspec-gtest provided
    HAL non-brownfield: exact SWR034 and supplied LL:272 normal CODE is refused TARGET_NOT_UPSTREAM;
    actual INPUT history retained. Private candidate records a separate normal CODE;
    no production edits.'
  baseline_revision: 1f6802b53ab5d4193c2b6efdb5466710a8d28a86
  error_codes:
  - EARLY_PROVIDED_CODE_OWNER_UNREACHABLE
  operations:
  - forge-evidence-mcp.report_defect
  - workorder.resume_from
  - inspection.gate.provided_code_claim
  root_cause: Normal early CODE exception and entry claim exist only for brownfield
    delivered code. Provided HAL LL workspace correction is already authorized by
    uspec-gtest policy, but SWE2 cannot hand that linked CODE to its future SWE3 owner;
    same-owner SWE3 report is also refused.
  remedy: Bind only existing PC-enabled HAL provided LL plus exact original/item/location/quoted
    requirement, retain pending CODE without forward upstream or loop debit, carry
    only validated pending finding across genuine passed1/2 and claim at normal3 entry.
    Verify reviewed correction with actual4 tools; preserve original inputs, human
    review, no future PASS or old INPUT inheritance. New graph/guidance explicitly
    enabled by normal workorder scope; legacy direct graphs remain identical.
- id: RPR-168
  script: rpr168_frozen_plan_observation_binding.py
  sha256: 337a629cc5d6a85d9b2f98814966e6656a3ae65db3178423437a3106bd7474cf
  symptom_signature: frozen approved preservation case cannot bind its actual plan
    identifiers
  observed_in: '2026-11-04 actual cloud WWDG SWE4 T1I: approved unchanged SWE3 specification
    maps preservation USPEC-HAL-04-03 to generated UT-023; producer requires literal
    UT-021 which current plan maps to nominal clear/return USPEC-HAL-04-01. Full hash-equal
    private actual workspace with genuine SWE1/2/3 PASS and approved corrected LL
    reproduced both refusals; original source, plan, requirements, verdicts and history
    unchanged.'
  baseline_revision: 3e6c3d944b4aaf6260ab4cf18f6f6399d6cecfd8
  error_codes:
  - TARGET_OBSERVATION_SCOPE_OR_CASE_INVALID
  - TARGET_OBSERVATION_FROZEN_PREDICATE_UNSUPPORTED
  operations:
  - forge-tests-mcp.run_unit
  - workflow.unit_target_observation.declaration
  root_cause: Typed WWDG producer binds preservation semantics to one historical numeric
    UT and one exact authored behavior phrase, instead of the unique actual frozen
    plan row and its parsed approved USPEC. Correct current UT023 is refused and old
    UT021 contradicts the actual approved plan.
  remedy: Bind the existing exact ClearEarlyWakeupFlag preservation semantics to unique
    actual planned identifiers and parsed frozen USPEC plus exact SWR033/034 clauses;
    retain exact legacy control domain, strict MMIO reserved-write mask, source/approval/plan/proof
    identity and fresh proof version. Keep all other host obligations, no silicon
    claim or criterion waiver.
- id: RPR-169
  script: rpr169_v2_watchdog_artifact_recovery_dependencies.py
  sha256: 2871f3ba9a10dbe2254550132e5ae764b69ec53327151e4e3228046632d9211b
  symptom_signature: standalone host watchdog recovery cannot load its normal policy
    dependencies
  observed_in: '2026-11-04 actual Omniverse standalone M5 host archive recovery: ModuleNotFoundError
    yaml before any conductor action/model call. Independent byte-identical committed-source
    fixture and bare -S default-policy recovery reproduce the missing dependency.'
  baseline_revision: 27eef6a010f239b302d96c55609da02fe345982d
  error_codes:
  - ModuleNotFoundError
  operations:
  - afo.line_watchdog_package.build
  - afo.line_watchdog.recover
  - afo.operations.operational_authorized
  root_cause: The standalone archive includes committed factory Python sources but
    omits the runtime dependency closure needed by normal reliability-policy loading
    and schema validation. check/missing-volume probes do not exercise this import
    path.
  remedy: Bundle and integrity-check the locked host dependency closure outside the
    application volume, including native ABI and resources, while retaining normal
    intent, volume, policy authorization, unit-state and cooldown fences; qualify
    new artifacts before activation.
- id: RPR-170
  script: rpr170_v2_line_product_lifecycle.py
  sha256: 1a16674aa473a038c2788a1373db892e03e851c6b40a4aee0bdd9b14a917b7e8
  symptom_signature: line-local product launch cannot prepare its owned provider without
    global shutdown
  observed_in: '2026-11-04 owner-signed finite local trial L90: normal product job
    on clean826/profile32ef reached M2 then STACK_STOP_INCOMPLETE / MANAGED_PROFILE_SCOPE_MISMATCH
    before native dispatch. Original attempt, conservative 1Mi token charge, source/mission/expiry
    and no-native evidence retained. Admission fenced OBSERVE, no bypass/reset.'
  baseline_revision: 405ea04291aea7250861f4d4a7f63749c017ab8d
  error_codes:
  - MANAGED_PROFILE_SCOPE_MISMATCH
  - STACK_STOP_INCOMPLETE
  - PRODUCT_LAUNCH_NOT_STARTED
  operations:
  - line_recovery_product.execution_context
  - line_launcher.launch
  - lrtx.stack.stop
  - lrtx.stack.start
  - lrtx.stack.serve
  root_cause: Normal line-local product carries durable policy/intent but M2 generic
    managed lifecycle lacks a line-bound profile and uses the global Conductor shutdown/store
    and unconditional managed serving refusal. That path cannot prepare its own already-held
    line execution lease while preserving RUNNING intent and canonical line queue.
  remedy: Use an explicitly payload/job/nonce/mission/intent/profile/root/lease-bound
    line-local lifecycle adapter under existing M0 locks, no-native/request quiescence
    and precise provider-process ownership. Preserve generic managed/legacy behavior,
    current authority per effect, finite deadlines and source-role pins; no flag bypass,
    parallel store, global shutdown or budget reset.
- id: RPR-171
