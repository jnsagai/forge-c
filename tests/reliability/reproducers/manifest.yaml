  - IMPL:LL_NOT_STATIC_INLINE
  operations:
  - docs/validate_artifact
  root_cause: OD-2026-10-20-02 moved the SWE.3 checklist items of a delivery to the delivered-code checks (brownfield/checks.py), but the author-facing
    validator forge-docs-mcp.validate_artifact (hal_guideline, register_map, implementation, swe3_all) still ran the greenfield checks; on the
    ST delivery it reported 491+ findings the frozen author cannot act on, and the authors escalated DEF-002 (FACTORY).
