- id: RPR-050
  script: rpr050_inspector_asks_for_rcc_base.py
  sha256: 4e9cfef50f8899575fa843eee58b005797e5cf1a03026e11cd2692b1059c95b5
  symptom_signature: SWE.3 inspector not told the register-block design and LL gate accepts an authored compile unit
  observed_in: r103, r159
  baseline_revision: 5053d0e54d42e73f173e969c6201ee58ae0f16de
  fix_revision: 41823779b83caf2f7446c9ee8df7c4f92af25a98
  error_codes:
  - INSPECTION_FAIL:SWE3-01
  - INSPECTION_FAIL:SWE3-02
  - CODE:UNDOCUMENTED_FUNCTION
  - REWORK_BUDGET_EXHAUSTED
  operations:
  - SWE.3/inspect
  - SWE.3/author
  root_cause: The SWE.2/SWE.3 inspector prompts never stated the mandated register access (extern ll_rcc_regs placed by the linker, no integer-to-pointer
    casts; SWE.2 author prompt, ADR-0009), so the DeepSeek inspector failed the correct design for lacking the RCC base address in C (r103 SWE3-02,
    r159 SWE3-01); the LL author answered with an authored address unit and pointer helpers, which the LL implementation gate did not reject as
    a non-header-only unit, and SWE.3 exhausted its rework budget. With such a unit the header-only oracle would also have crashed at link time.
  remedy: SWE.2/SWE.3 inspector prompts carry REGISTER_BLOCK_NOTE; the LL implementation gate reports IMPL:LL_EXTRA_COMPILE_UNIT for any authored
    .c beside the generated unit; an oracle link failure returns BUILD_FAILED (ORACLE_BUILD_FAILED finding in contract mode).
- id: RPR-051
  script: rpr051_no_write_register_semantics.py
  sha256: a36c246b5743711fbde866bd3c06d5b6a621b2aae2678d4b15701e3120ff207c
  symptom_signature: no_write effect naming a register demands zero register accesses
  observed_in: r164
  baseline_revision: dcdce940ddf3f5922afa9f00c2e8bd6842dbb0f4
  fix_revision: f1782d454d34b224991d8fca989c0bb70a9d8828
  error_codes:
  - ORACLE_FAIL
  operations:
  - SWE.4/assurance-oracle
  root_cause: Register contract rc-v1 gave op no_write one meaning (no register access at all, as for a NULL configuration) while its schema allowed
    a register/field on a no_write effect; the SWE.1 author used it for 'leave RCC_CR.HSEON/HSION at reset value' and SWE.2 mapped it to HAL_RCC_GPDMA1_Enable,
    which writes RCC_AHB1ENR. The contract checker skipped no_write entries and the oracle demanded zero accesses, failing a correct driver (r164
    SWR-010/011).
  remedy: A no_write effect that names a register means the call leaves that register unchanged (oracle compares the register word before/after);
    without a register it still means no register access. The checker validates the named register/field against the RM and the SWR, and the SWE.1
    contract prompt states both meanings.
- id: RPR-052
  script: rpr052_package_duplicate_compile_unit.py
