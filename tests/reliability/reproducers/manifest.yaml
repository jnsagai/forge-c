    by hand; in the third rework cycle it exceeded its tool budget (46 > 45) and SWE.3 was BLOCKED (r110).
  remedy: A deterministic scaffold node (swe3_units) generates the unit-spec skeleton and as-built designs from the code tags; the author only
    replaces placeholder markers, which the gate rejects if left.
