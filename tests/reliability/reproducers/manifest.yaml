    observed_in: r80
    baseline_revision: face7ca7427ede2a18904e7aa09709072b9d113b
    fix_revision: 71b83b6b815144ab1536b223df9f6a4f89572ee6
    error_codes: ["SWE2:PLACEHOLDER_API"]
    operations: [SWE.2/author, SWE.2/inspect]
    root_cause: "The architecture check verified that every SWR is allocated but not that the allocated API names are concrete, so LL_RCC_<Peripheral>_Enable passed and SWE.3 could omit the peripheral functions."
