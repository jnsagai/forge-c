    texts) are byte-identical.
- id: RPR-127
  script: rpr127_no_wait_hal_swe5_timeout_and_boundary.py
  sha256: 635990661988862ca876c68ccbe7bdb158fce9fbb7e370fdcb14ddcee83b39bf
  symptom_signature: a no-wait HAL's SWE.5/SWE.6 prompts ask for timeout tests, or a correct non-RCC boundary test is not recognised
  observed_in: Fabro run WO-F014-SWE2-CRCHAL-20261103-L26 (local line, Omniverse2, CRC HAL order 0014m on run/gen8d, 2026-11-03; follow-up of
    CAPA-124/126) and IWDG HAL run WO-0009B-STM32N6-IWDG-HAL-h005 (2026-10-20, INTEGRATION_CATEGORY_MISSING:boundary)
  baseline_revision: c5a79c7a80914c15429edc7ff44379b224f842cd
  error_codes:
  - INTEGRATION_CATEGORY_MISSING
  operations:
  - workflow/prompts peripheralize (SWE.5/SWE.6 HAL author prompts)
  - assurance/target integration_categories
  - assurance/verifiers v_integration
  root_cause: '(1) The RCC SWE.5 fallback ''write test_rcc_target.c and test_rcc_target_timeout.c ... scenario never_ready for the timeout file'',
    the report text ''(timeout paths, measured sizes)'' and the SWE.6 hint ''add scenario=never_ready for timeout behaviour'' were kept for every
    peripheral, so the CRC HAL (no wait) was asked for a timeout target file and timeout paths. (2) The SWE.5 BOUNDARY_INTEGRATION category (assurance/target.py:142)
    recognised only RCC boundary arguments (TIMEOUT_VALUE + 1, (0U), 1000, 1001): a CRC count of 0 or a field-limit value and IWDG''s HAL_IWDG_TIMEOUT_MS
    + 1U were reported as INTEGRATION_CATEGORY_MISSING:boundary.'
