    target instructions and1000virtualus at100MIPS; normal SDK host-only HAL_Clear
    clock test UT025/USPEC0405 receives PASS and Matrix4 VERIFIED with no target metrics
    on qualified169/170. Actual4J terminal with noSWE4baseline/inspection, history
    retained.
  baseline_revision: edff27525b8331af7ce943de0490172c9fc180c5
  error_codes:
  - WWDG_TARGET_TIMING_HOST_FALSE_CREDIT
  operations:
