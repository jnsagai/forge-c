    fix_revision: 591d62addd25eef8048edbd5e8bb87ca00f4b015
    error_codes: ["RESUME_FAILED"]
    operations: [WORKORDER/resume]
    root_cause: "resume_from copied every file of the carried phases, including the HAL work order's provided read-only LL header; the new work order already holds its own verified 0444 copy, so the copy failed with Permission denied and the run never started (first HAL resume, r132/r133)."
    remedy: "Provided files are never copied; the source's copy must match the new work order's provided sha256, otherwise the resume is refused (RESUME_PROVIDED_MISMATCH)."
  - id: RPR-044
    script: rpr044_fake_state_query_constant.py
    sha256: 4e93207dad589b447753c172dfdd2f6f53a10bc9a0fe6a42bd3b0419f5ac4466
    symptom_signature: "state query of the LL test double ignores Enable"
    observed_in: r135
    baseline_revision: 2b03bc5b4eae90386f00ab7ec94bdc0385b29e9b
    fix_revision: ca9b5c084f003e5f4f54978e8176c0df76b8bbac
    error_codes: ["REQUIRED_TOOL_NOT_PASS:run_unit", "DEFECT:TEST", "TURN_BUDGET_EXHAUSTED"]
    operations: [SWE.4/author, SWE.3/author]
    root_cause: "CAPA-038 iteration 1 made every LL uint32_t query scripted (default 0U); a state query such as LL_RCC_ADC12_IsEnabled() therefore read 0U right after LL_RCC_ADC12_Enable(), unlike the LL; r135's authors declared TEST defects (DEF-001, DEF-004) to work around it and the SWE.3 rework loop ran out of turns."
    remedy: "Queries of a register bit that an LL function writes follow that bit (shadow state); flags no LL function writes (IsReady) stay scripted; ll_fake_return_from overrides both."
  - id: RPR-045
    script: rpr045_fix_loop_turn_budget.py
    sha256: 534aae88fa05cea0b0df16bf814ebd156a4a225c5b6061a642332efa95937c6e
    symptom_signature: "fix-loop visit has the first-pass turn budget"
    observed_in: r137
    baseline_revision: c2c0273e6a25be8b69ab14ba64dae13d0029f3fd
    fix_revision: 78f2728564e24c26836f20c79c69e7731500dca4
    error_codes: ["TURN_BUDGET_EXHAUSTED", "REWORK_BUDGET_EXHAUSTED"]
    operations: [SWE.3/author]
    root_cause: "A phase re-entered by an upstream loop to fix a reported defect had the first-pass turn budget although the visit must re-read its context, fix the code and re-validate unit specs, designs and trace tags; all three HAL SWE.3 fix visits (r135, r136, r137) ended TURN_BUDGET_EXHAUSTED and two of the runs then exhausted the rework budget."
    remedy: "While a defect targeted at the author's phase is IN_FIX, its author gets LOOP_EXTRA_TURNS (15) on top of the authored budget; first passes and inspectors are unchanged."
  - id: RPR-046
    script: rpr046_stale_unit_function_list.py
    sha256: b396d6e896d4ff9db8796711f1c9f965606e658a8859a9b52c4814a3f7c240da
    symptom_signature: "unit function list not synchronised with the code"
