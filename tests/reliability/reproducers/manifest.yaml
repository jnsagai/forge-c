    became stale and every SWE.2 freeze failed with UPSTREAM_NOT_FROZEN:SWE.1 (r109 BLOCKED at SWE.2).
  remedy: Each matrix is written into workproducts/SWE.n/traceability of the phase that produces it; the packager collects all six under traceability/matrices/.
- id: RPR-030
  script: rpr030_swe3_trace_work_by_hand.py
  sha256: efdfe2af0727f0fd8ea704567f83c3441090f6a1c9b03a958b9f3c995edbc955
