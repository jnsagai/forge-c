    preprocessing off, which warns on documented register defines; r111 completed specs, designs and tags but was rejected three times and BLOCKED.
  remedy: The gate generates each design's citation (legend) from unit_specifications.md; Doxygen runs with preprocessing, accepts @trace, and
    does not count the generated, RM-verified register defines as documentation gaps.
- id: RPR-033
  script: rpr033_budget_swr_forced_into_units.py
  sha256: 15465dd28bdd507bcdaabf227ef796d0b3d4ce6166216d1d21ac442f59f6eb63
