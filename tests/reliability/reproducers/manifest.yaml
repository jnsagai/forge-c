  fix_revision: 6fcbcb43c6a53c201d22c2455f8822ddf994f499
  error_codes:
  - INSPECTION_FAIL:SWE4-06
  - UT:SPEC_NOT_VERIFIED
  operations:
  - SWE.4/author
  - SWE.4/inspect
