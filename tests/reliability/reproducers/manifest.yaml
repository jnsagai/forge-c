  - id: RPR-059
    script: rpr059_req_source_first_page_only.py
    sha256: 514c0688e3d94938b884ded806d19ccbec27a424ee3bd2e998f1dfb8ce33e92c
    symptom_signature: "field on a later cited page flagged as not on the source page"
    observed_in: PG-T018 (i003 SWR-013, RCC r164 SWR-001/002/007)
    baseline_revision: e66f50740e1bc94c0760c737182e5224910559a5
    fix_revision: c925a1477cfc574779fa960c6f0f5b9d161dbf90
    error_codes: ["REQ_SOURCE_MISMATCH"]
    operations: [assurance/swe12.check_requirements]
    root_cause: "check_requirements read only the first 'RM0486 p.N' of each source line (re.search) and required every field the requirement names to be on that page. Requirements cite several pages ('RM0486 p.2989; RM0486 p.2990; RM0486 p.2991'); fields on the later pages (i003 RVU/ONF, r164 HSIRDY/HSERDY) were reported as REQ_SOURCE_MISMATCH although they are on a cited page. Observe-only SWE.1 assurance verdict FAIL on both IWDG and RCC."
    remedy: "cited_pages() collects every page of every source line (lists and bounded ranges, p./pp., en dash); a field is a mismatch only when it is on none of them; REQ_SOURCE_PAGE_NOT_IN_INPUTS is reported per source line when none of its pages is in the inputs. RCC results change by design: r164 SWR-001/002/007 no longer get the false finding."
  - id: RPR-060
    script: rpr060_delivered_compile_werror.py
    sha256: 5060f9feb134030387afc3915c08c76fb5f6d646e756066c7c69cbe44192f115
    symptom_signature: "delivered CMSIS code fails the target build on vendor-header warnings"
    observed_in: b006
    baseline_revision: e71c98c0e3e4ec14f7ed68531e60b7d85a2d2d30
    fix_revision: 1f4d745bac436a3bd76209edc554495ff8f9d102
    error_codes: ["BUILD_FAIL", "NO_OBJECTS"]
    operations: [build/compile, build/measure_elf]
    root_cause: "forge-build-mcp compile used the factory's own warning policy (-Werror -Wconversion -Wsign-conversion -pedantic) for a frozen delivery and passed the vendor include directory with -I; ST's CMSIS armv7m_cachel1.h line 117 warns under -Wsign-conversion, so the target build failed, no object was emitted and measure_elf was BLOCKED (DEF-001 FACTORY)."
    remedy: "For a delivery the warning flags drop -Werror and every warning is recorded as an issue; the vendor include and host device directories are passed with -isystem (third-party headers). Factory-written code keeps -Werror."
  - id: RPR-061
    script: rpr061_swe3_all_greenfield_on_delivery.py
    sha256: 4c894132e2eacbcdfb54fa98cc1afc9d8b2af5c5186ef607c26ea61d547b9720
    symptom_signature: "swe3_all applies greenfield checks to a delivery"
