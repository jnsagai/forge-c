- id: RPR-078
  script: rpr078_obligation_requirement_removed.py
  sha256: a2172408fe754d11c440cb72e9f81847fb30845cb5c5390eb9a24c72b23a3e79
  symptom_signature: SWE.1 author told to remove a requirement that implements a declared owner obligation
  observed_in: 'Fabro SWE.1 run WO-F014-SWE1-OBL-20261031-03 (01M69V139JKG14HMVVTT8GWNAH) on Omniverse2 2026-10-31: critical OBL-preserve-other-registers
    uncovered; cross-cutting task used its one development repair pass on validator findings, the coverage repair call was refused (DEVELOPMENT_PHASE_REPAIR_EXHAUSTED);
    author gate REJECTED, SWE.1 BLOCKED'
  baseline_revision: b4b84933f8f8a130407edd20d98eac863a1537a8
  error_codes:
  - SWE1_OBLIGATION_UNCOVERED
  - DEVELOPMENT_PHASE_REPAIR_EXHAUSTED
  operations:
  - lrtx/swe1.validate_group
  - lrtx/swe1._visit
  - lrtx/visit.run_task
  root_cause: The cross-cutting validator refuses a requirement that names a register-task register with 'remove requirement [k] from the cross-cutting
    task'. A preservation obligation's natural requirement names that register, so the instruction contradicted the obligation; and obligation
