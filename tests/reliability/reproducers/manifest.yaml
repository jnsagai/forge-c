- id: RPR-128
  script: rpr128_hal_on_st_ll_not_buildable.py
  sha256: c3e7bb6f4c0bea9085fe28066210b93b4cb6d62a690d04bc82cc4017b22669ed
  symptom_signature: a HAL work order on an ST (CMSIS) LL gets no LL test double and no vendor build inputs
  observed_in: Fabro run WO-F014-SWE3-CRCHAL-20261103-L27 (local line, Omniverse2, CRC HAL order 0014m on run/gen9 378aa68a, --provided-from the
    ST CRC LL WO-F014-SWE6-CRCL-20261103-L24, 2026-11-03)
  baseline_revision: a88b61a5efc0a49d6d7f52d88c0b7c47f75caa96
  error_codes: []
  operations:
  - workflow/ll_fake generate
  - workorder prepare (HAL --provided-from)
  - brownfield/cmsis host_flags + target_flags + write_host_device
  - mcp tests run_unit/run_integration
  - mcp build compile
  - mcp analysis
  root_cause: '(1) workflow/ll_fake.py:28 matched only ''static inline (void|uint32_t) LL_*'' functions, so generate (line 205) raised ''no static
    inline LL function in the provided header'' on ST''s LL headers (__STATIC_INLINE, the CMSIS instance pointer CRC_TypeDef *CRCx, uint8_t/uint16_t
    queries); the HAL unit tests, which assume the generated double, had none, and the pointer argument would have been cast to uint32_t (an error
    in the GoogleTest C++ unit). (2) workorder.prepare (lines 278-279) copied only the provided LL header into the HAL workspace; the header includes
    stm32n6xx.h, but the source LL work order''s vendor includes (inputs/vendor/include, delivered_dependency) were not carried, and brownfield/cmsis.py
    host_flags/target_flags (lines 113-124) gave the host device directory with the host CMSIS stub, the defines and -mcmse only to a work order
    whose own delivery is CMSIS (is_cmsis keyed on the delivery). The first L27 target compile failed with ''stm32n6xx.h: No such file or directory'';
    the SWE.3 author then wrote its own stm32n6xx.h stub and a register-array HAL that bypasses the LL.'
  remedy: 'll_fake also accepts __STATIC_INLINE/__STATIC_FORCEINLINE LL functions returning void or a (u)int8/16/32_t: pointer parameters (the
    instance) are not recorded, scalar arguments are, non-uint32_t queries are cast, SET_BIT/CLEAR_BIT (ATOMIC_) on the instance member set state
    bits that READ_BIT queries follow; static inline functions keep their exact processing (doubles byte-identical, checked on the 30 loop10 and
    4 Omniverse2 HAL fakes). workorder.prepare of a HAL on a CMSIS-delivered LL copies the source work order''s vendor include files (each byte-identical
    to its manifest sha256, else PROVIDED_BUILD_INPUT_MISMATCH) read-only into inputs/vendor/include and records them with the defines/secure
    setting as manifest provided_build; cmsis.host_flags/target_flags/write_host_device use them (hash re-checked, PROVIDED_BUILD_INPUT_CHANGED),
    and the HAL''s host compile units force-include forge_host_device.h (weak RAM struct of the instance), so the HAL''s own LL_CRC_*(CRC, ...)
    calls reach the host register model in integration tests (not for cppcheck). Greenfield LL -> HAL work orders get no provided_build and unchanged
    flags.'
