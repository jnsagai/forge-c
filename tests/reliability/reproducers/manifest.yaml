- id: RPR-120
  script: rpr120_truncated_write_argument_forced_to_field_value.py
  sha256: 71cf1ba06ca9462619281fd6c1375b7895e8da0f27ee6bd750ba1ebb752099eb
  symptom_signature: a truncating-write case cannot pass the SWE.2 argument check with the above-field input its requirement requires
  observed_in: Fabro run WO-F014-CMP-SWE2-IWDGG-20261102-08 (cloud comparison line, loop10, 2026-11-02)
  baseline_revision: 2a88c806dfd5109173bcbb2744560fa8c2f989cf
  error_codes: []
  operations:
  - lrtx/swe1 register effects (author schema
  - validation
  - assembly)
  - assurance/register_contract check_effects
  - lrtx/swe2 validate_interfaces
  root_cause: 'SWR-009 is a truncating write (requested value above 0xFFF, only bits 11:0 reach IWDG_RLR.RL; verified with 0x00001234 -> RL ==
    0x234). The SWE.1 register-effects contract could record only the resulting field value (RLR_RL_WRITE_TRUNCATED value 0x234; the author schema
    had no other property and the value must fit the field), and lrtx/swe2.py validate_interfaces required the api_calls.json argument to equal
    that value, so the author wrote LL_IWDG_SetReloadCounter(0x234U) and the inspector correctly rejected it as not exercising the above-0xFFF
    input (SWE2-06 three times: BLOCKED STUCK SAME_ITEM_FAILED_3X).'
  remedy: A write effect may carry an optional requested input next to the field value (SWE.1 author schema and rule; validated at SWE.1 and by
    check_effects as a 32-bit number above the field whose low field-width bits are the value; SWE.1 flags a write whose verification calls with
    such an input but records none). The SWE.2 check requires the call argument to equal the requested input when present, otherwise the value
    (the truncated value is refused); the SWE.2-6 case listings show the requested input. Baselines without requested are unchanged.
- id: RPR-121
  script: rpr121_swe3_design_without_timing_bound.py
  sha256: 4af062f1cfaa2ebe9afeed54c3fee838ef83b77b85cf5f5fe24b2d2d21d658ba
  symptom_signature: the SWE.3 detailed design gives no per-call timing bound for the simulation performance budget
  observed_in: Fabro runs WO-F014-CMP-SWE3-OBL-20261102-09 and WO-F014-CMP-SWE3-IWDG-20261102-09 (cloud comparison line, loop10, 2026-11-02)
  baseline_revision: 7788a927fd11a735a23db6a2e6f545c08d4d02df
  error_codes: []
  operations:
  - lrtx/swe3 visit_design detailed design
  root_cause: Work orders with a simulation_performance allocation carry SWRs 'complete each measured call within 64 executed target instructions
    / 100 microseconds of virtual time in the pinned Renode simulation at 100 MIPS'. The structured SWE.3 detailed design is rendered deterministically
    by lrtx/swe3.py visit_design from the code tasks and the measured tools (flash, RAM, stack, static analysis) and had no timing bound for these
    requirements; the author could not add one (the design is factory-rendered, swe3-author has no disassembly or simulation grant) and wrote
    only 'unverified'. The inspector failed SWE3-03 ('timing ... bounded') in all three rounds of both work orders (BLOCKED STUCK SAME_ITEM_FAILED_3X).
  remedy: For a greenfield header-only LL order with a simulation performance budget the factory compiles the measurement unit SWE.6 measures
    (forge_measure_<function> wrappers) with the pinned cross compiler at the target-cm55-gcc flags, disassembles it and records the static instruction
    count of each straight-line wrapper (no branch, call, loop, table branch, low-overhead loop, pc write or wait; one final return; refused as
    NOT_BOUNDED otherwise) and the derived virtual time at the budget's MIPS against the budget, in workproducts/SWE.3/static_timing_bound.json
    (frozen with the SWE.3 baseline, header/unit/object hashes) and a 'Timing bound (static analysis)' design section. SWE.6 Renode measurement
    stays the verification; no hardware WCET is claimed; orders without the budget are unchanged.
- id: RPR-122
  script: rpr122_call_outage_counted_as_author_rejection.py
  sha256: 539c77f9b34dd96c82d5ff9a3738bc0ffd4229750a91a793808568625b913871
  symptom_signature: a model-call outage visit is recorded as a rejected author attempt and the route ends the phase as STUCK
  observed_in: Fabro run WO-F014-CMP-SWE1-CRCL-20261102-10 (cloud comparison line, loop10, 2026-11-03; owner Claude account usage limit 00:59-01:05Z)
  baseline_revision: 2a2513d168e003472a4f9157fa1cdb9b6b9ab459
  error_codes: []
  operations:
  - lrtx/visit run_task
  - inspection/gate author/inspect/route
  root_cause: 'During the account outage every structured SWE.1 author call returned CALL_REFUSED:bridge_upstream_failed; lrtx/visit.run_task
    treated it as a failed attempt (immediate retries, task INVALID), the visit ended FAILED, the author gate recorded the visit as a REJECTED
    attempt (LRTX_TASK_INVALID:...CALL_REFUSED) and the route''s STUCK rule (identical deterministic rejection twice) ended the phase ''BLOCKED
    STUCK: repeated rejection without changed evidence; external diagnosis required''. The next visit also lost the inspection findings (the outage
    visit counted as the last finished visit). The local line has the same exposure (CALL_FAILED transport errors, gateway HTTP 500 / PROVIDER_REQUEST_OUTCOME_UNKNOWN
    when llama-server/Ollama is down).'
  remedy: 'A refused/unreachable model call (inspection/outage.py classification; admission, budget and 4xx refusals excluded) is no repair attempt:
    the visit waits and retries with a bounded visit-wide schedule (FORGE_LRTX_OUTAGE_WAIT_S, default 600 s), then ends with INFRA_UNAVAILABLE:MODEL_CALLS_REFUSED
    and the checkpoints untouched. The author/inspect gates record an INFRA_UNAVAILABLE outcome (never REJECTED, never a re-use of an earlier
    verdict) and the route ends the phase BLOCKED with a retryable infra_outcome before any rework cycle, development reservation, STUCK/same-item
    rule, auto defect or advisory record; the package states SWE.n:INFRA_UNAVAILABLE.'
- id: RPR-123
  script: rpr123_unexamined_evidence_routed_as_product_finding.py
  sha256: 9d7155c842ce771f5da6383bee6616f8782c9c6c5008eb2554d46ad3fc588d5d
  symptom_signature: an inspection whose findings say the evidence was not examined is routed to the author as a product finding
  observed_in: Fabro run WO-F014-CMP-SWE3-IWDGHAL-20261102-10 (cloud comparison line, loop10, 2026-11-03)
  baseline_revision: 3a3507883c55673cacabefcfb61bf6136573444d
  error_codes: []
  operations:
  - mcp/evidence check_inspection
  - inspection/engine record_inspection + gate
  - inspection/gate inspect/route
  - lrtx/reinspect
  - workflow/prompts native inspector
  root_cause: The native SWE.3 inspector's grep on a file path returned nothing and the role policy reserved its last calls (16/20); following
    the prompt rule 'retain an explicit finding for evidence you could not examine' (workflow/prompts.py inspector_prompt) it recorded INS-SWE.3-001
    PASS and then INS-SWE.3-002 FAIL with SWE3-01/SWE3-06 'not examined (budget reserved)'. check_inspection/Store.record_inspection recorded
    them as major product findings and the gate sent the author to rework; the next three inspector sessions failed on the account outage before
    any call and step_inspect re-used INS-SWE.3-002 as a new failed inspection each time, until 'rework budget exhausted (5 failed cycles)'.
  remedy: 'A FAIL item whose every finding states unexamined evidence (NOT_EXAMINED marker or the incident wording; narrow, real-defect wording
    excluded) is no product finding: without another major finding the submission is an INCOMPLETE inspection (inspection/<phase>/incomplete/INC-*.json,
    voiding an earlier PASS of the baseline) and the gate re-inspects (bounded, then BLOCKED INSPECTION_INCOMPLETE_REPEATEDLY); with real majors
    the INS is FAIL as before and the unexamined items are flagged and kept out of the author''s findings and the same-item rules. An inspector
    visit that recorded nothing re-inspects (bounded, then BLOCKED INSPECTION_NOT_PERFORMED_REPEATEDLY) instead of re-using the earlier verdict.
    Neither counts as a rework cycle; the reinspect node returns straight to the inspector. The native inspector prompt asks for ID=FAIL:NOT_EXAMINED:<what>
    and never a PASS/FAIL on unexamined evidence.'
- id: RPR-124
  script: rpr124_no_wait_hal_view_timeout_path.py
  sha256: bb9cade6ea5a9aa8779f36adc249c23d02ab71baa3bd6fc899873d4cd3c19b9c
  symptom_signature: the SWE.2 dynamic view of a no-wait HAL (CRC) is rejected for a missing HAL_TIMEOUT path
  observed_in: Fabro run WO-F014-SWE2-CRCHAL-20261103-L26 (local line, Omniverse2, CRC HAL order 0014m on run/gen8d, 2026-11-03)
  baseline_revision: 7788a927fd11a735a23db6a2e6f545c08d4d02df
  error_codes:
  - VIEWS:DYNAMIC_MISSING_TIMEOUT_PATH
  operations:
  - inspection/views check_views
  root_cause: 'inspection/views.py:check_views (line 66) required the string HAL_TIMEOUT in the SWE.2 dynamic view of every non-LL work order.
    The CRC HAL has no wait and no timeout (crc.yaml: hal_wait_rule ''No HAL_CRC_ function waits'', RM0486 26.3.3; hal_dynamic_view names no timeout
    path), so the author was rejected twice with VIEWS:DYNAMIC_MISSING_TIMEOUT_PATH and SWE.2 ended BLOCKED STUCK (identical deterministic rejection
    twice).'
  remedy: 'layer.hal_waits(ws) decides from the peripheral profile whether the HAL has a bounded wait: a hal.time_base, RCC, a HAL wait text (hal_wait_rule,
    hal_failure_responses, hal_dynamic_view) left to the waiting RCC default, or one of them naming HAL_TIMEOUT. The timeout path is required
    only then; IWDG, RCC and every profile without its own HAL texts still require it.'
- id: RPR-126
  script: rpr126_no_wait_hal_swe1_timeout_requirement.py
  sha256: c2824b08abc8dbfe37c51f86d68a21cf59e851b53c142e2f36a339b46e72a8b5
  symptom_signature: the SWE.1 HAL prompt of a no-wait HAL (CRC) demands a polling-iteration timeout bound
  observed_in: Fabro run WO-F014-SWE2-CRCHAL-20261103-L26 (local line, Omniverse2, CRC HAL order 0014m on run/gen8d, 2026-11-03)
