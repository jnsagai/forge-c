  - lrtx/swe1.self_check
  - lrtx/review.evidence
  root_cause: 'No SWE.1 mechanism compared the requirements with the owner''s obligations: the author gate checks structure only, no checklist
    item asks for completeness against the owner contract, and lrtx/review.evidence gives the inspector the baseline and manifest views but not
